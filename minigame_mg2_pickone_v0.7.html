<!DOCTYPE html>
<!-- Wordborn 미니게임 프로토타입 · R2 PICK ONE v0.4 · 상태: 검토중 · 문서군: minigame
     Wordtopia 오락실 사격 부스 — 단어를 읽고, 날아다니는 풍선 중 맞는 그림 풍선을 쏜다.
     v0.4: 타겟마크 오차 수정(§3.2 fx viewBox 동기화)·목표 단어 20% 축소·진행 별 대비 강화·
     풍선 12개(정답1+오답6+폭탄1~2+아이템3~4)·아이템 4종(탄창·하트·잉크·점수)·
     최고속 2단 연장(45%/초)+연속 랜덤 속도.
     v0.3: 대각선 풍선(상시 2~3개, 아래→위 비행·화면 밖 소멸→무작위 보충)·오답 풍선도 겹수만큼
     (시간 벌은 마지막 겹 1회만)·바다 낙하 JS rAF 재구동(§3.2 전이 레이스 수정)+풍덩·둥둥·
     가라앉기 연출·mouth 아이콘 재작화(입술+입안+윗니+혀).
     v0.2: 풍선 8개·몸통만 팝(그림카드 명중=뒤집기 토글)·오답 풍선 팝+그림 바다 낙하+시간 벌·
     연속 진행(전체 재진입은 폭탄만, 터진 자리 개별 보충)·새 단어 필수 발음·돌고래·오프셋 수정.
     v0.1: 풍선 비행(속도 7단·양방향·겹침), 1~5겹, 폭탄 풍선, 타이머 80초.
     v0.0: 첫 프로토타입 — 해변 스테이지, 스테이지제, 게임 중 무발음(읽기 축), 공용 시스템 승계.
     본편(wordborn_v1.4.html)은 이 파일과 무관하며 변경되지 않았다. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#241A24">
<title>Pick One</title>
<style>
:root{
  --ink:#3B2B3A; --ink-soft:#6B5560;
  --paper-0:#FBF3E4; --paper-1:#F2E4CC; --paper-2:#E4D0AE; --paper-3:#CDB489; --paper-4:#A9906A;
  --coral:#FF7A6B; --butter:#FFCE5C; --mint:#6FD9C0; --sky:#6FB8E8; --grape:#B49AE0; --rose:#F79FC4;
  --drop:#8FD8F0; --drop-deep:#5AAECF; --blush:#FF8E86;
  --ui:1; --dur:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:#241A24;color:var(--ink);overflow:hidden;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;font-size:calc(16px * var(--ui));
  touch-action:manipulation;user-select:none}
button{font-family:inherit}
#app{position:relative;width:100%;height:100%;max-width:1180px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 8%,var(--paper-0) 0%,var(--paper-1) 42%,var(--paper-2) 100%)}

/* ===== 공용 ===== */
.ib{width:56px;height:56px;border-radius:18px;border:3px solid var(--ink);background:var(--paper-0);
  box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  transition:transform .12s,box-shadow .12s,background .2s;flex:0 0 auto}
.ib:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.ib.big{width:80px;height:80px;border-radius:24px;box-shadow:0 5px 0 var(--ink);background:var(--butter)}
.ib svg{width:60%;height:60%;display:block}
.ib.corner{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));width:46px;height:46px;
  border-radius:14px;background:var(--paper-0)}
.pageC{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  overflow:auto}
.btnrow{display:flex;gap:14px;justify-content:center}

/* ===== 지갑 ===== */
.purse{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
 /* 공용 표준 — 하트는 (♥ × 숫자) 한 덩어리 */
.hearts{display:flex;gap:3px;align-items:center;background:var(--paper-0);border:3px solid var(--ink);
  border-radius:999px;padding:3px 10px 3px 6px;box-shadow:0 3px 0 var(--ink);font-weight:900}
.hearts .h{width:23px;height:23px;flex:0 0 auto;transition:transform .25s cubic-bezier(.2,1.8,.4,1)}
.hearts .h svg{width:100%;height:100%;display:block}
.hearts .h.on{animation:hbeat calc(2.4s / var(--dur,1)) ease-in-out infinite}
@keyframes hbeat{0%,88%,100%{transform:scale(1)}92%{transform:scale(1.18)}}
body.nomotion .hearts .h.on{animation:none}
.hearts .hx{font-size:calc(1.06rem);letter-spacing:-.5px;min-width:26px;text-align:left}
.hearts.zero .hx{color:#E4374B}
.hearts.bump{animation:hbump .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes hbump{40%{transform:scale(1.18)}}
body.nomotion .hearts.bump{animation:none}
.cnt{display:flex;gap:4px;align-items:center;background:var(--paper-0);border:3px solid var(--ink);
  border-radius:999px;padding:4px 10px 4px 7px;box-shadow:0 3px 0 var(--ink);font-weight:900}
.cnt svg{width:21px;height:21px;display:block}
.cnt .num{font-size:calc(1rem);letter-spacing:-.5px}
.cnt.gain{background:var(--butter)}
.cnt.gain::before{content:"+";font-weight:900;margin-right:-2px}
.cnt.seedgain{background:var(--mint)}

/* ===== 게임 ===== */
.game{position:absolute;inset:0;display:flex;flex-direction:column}
/* ★ 대시보드 = 상단 두 줄. **철자판까지가 대시보드다.**
   철자판을 필드 위에 띄우면 배경(구름)·연출·표적과 영원히 싸운다 — 겹침을 하나씩 피해 다니는 것보다
   처음부터 안 겹치는 자리에 두는 것이 옳다(사용자 판단).
   1행: ♥×N · 점수 · 먹물 · [여백] · ⚙
   2행: 시계+타이머(고정폭) · 여백 · 철자판(왼쪽 정렬, 오른쪽은 비워 둔다) */
.hud{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;
  padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
.dashrow{display:flex;align-items:center;gap:8px;min-width:0}
.hud .spacer{flex:1 1 auto;min-width:0}
.hud .ib{width:40px;height:40px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.hud .ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
/* ④ 고정폭 — 6자 공간. 점수가 올라가도 폭이 변하지 않아 레이아웃이 흔들리지 않는다 */
.cnt.fixed{width:min(29vw,116px);flex:0 0 auto;justify-content:flex-start}
.cnt.fixed .num{flex:1 1 auto;text-align:right;font-variant-numeric:tabular-nums}
/* ⑥ 시계 영역이 곧 철자판의 들여쓰기 기준이다 */
/* 시간칸을 한 칸 줄이고(104→80) 철자판을 그만큼 왼쪽으로 당겼다 */
.timecell{flex:0 0 auto;width:min(20vw,80px);display:flex;align-items:center}
/* 공용 표준 상단 바 — ♥×N · 물시계 · 점수 · 먹물 [여백] ⚙ (홈은 좌하단) */
.hud .spacer{flex:1 1 auto;min-width:0}
.hud .ib{width:40px;height:40px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.hud .ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.hud .tbar{flex:1;height:16px;border-radius:99px;background:var(--paper-2);border:3px solid var(--ink);
  overflow:hidden;box-shadow:0 3px 0 var(--ink);min-width:60px}
.hud .tbar i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--mint),var(--butter))}
.hud .tbar i.low{background:linear-gradient(90deg,var(--coral),#FF4D6D);animation:tflash .5s steps(2) infinite}
@keyframes tflash{50%{opacity:.45}}
body.nomotion .hud .tbar i.low{animation:none}
/* ★ 스코어 바 — 먹물 바와 **같은 부품**으로 통일 */
.hud .score{background:var(--paper-1);color:var(--ink);border:2.5px solid var(--ink);
  border-radius:999px;padding:3px 12px 3px 10px;box-shadow:0 3px 0 rgba(59,43,58,.28);
  font-weight:900;font-size:calc(.92rem);width:min(29vw,116px);flex:0 0 auto;text-align:right;
  letter-spacing:-.5px;font-variant-numeric:tabular-nums}
/* ★ 철자판 — 대시보드 2행. **왼쪽 정렬 + 오른쪽 개방**(긴 단어가 오른쪽으로 자란다).
   시계 영역만큼 들여쓴 자리에서 시작한다. */
.goal{flex:1 1 auto;min-width:0;margin-left:6px;
  display:flex;align-items:center;justify-content:flex-start;gap:8px;
  background:var(--paper-1);border:3px solid var(--ink);border-radius:16px;
  padding:4px 12px 4px 8px;box-shadow:0 3px 0 rgba(59,43,58,.28);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.goal::-webkit-scrollbar{display:none}
.gpic{width:min(10vw,42px);height:min(10vw,42px);background:var(--paper-0);border:3px solid var(--ink);
  border-radius:12px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:3px;
  flex:0 0 auto}
.gpic svg{width:100%;height:100%;display:block}
.slots{display:flex;gap:4px;align-items:flex-end;flex-wrap:nowrap}
.slots .slot{position:relative;width:min(8vw,32px);height:min(10vw,40px);border-radius:10px;
  background:var(--paper-1);border:3.5px dashed var(--paper-4);display:flex;align-items:center;justify-content:center;
  transition:transform .3s cubic-bezier(.2,1.7,.4,1),background .25s,border-color .25s}
.slots .slot.sp{border:none;background:none;width:min(3.4vw,12px)}
.slots .slot.on{background:var(--butter);border:3.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);
  transform:translateY(-4px)}
.slots .slot .ghost{position:absolute;inset:6px;display:flex;align-items:center;justify-content:center;
  transition:opacity .3s}
.slots .slot .ghost.g1{opacity:.55} .slots .slot .ghost.g2{opacity:.32}
.slots .slot .got{position:absolute;inset:5px;display:flex;align-items:center;justify-content:center}
.slots .slot .got svg,.slots .slot .ghost svg{width:100%;height:auto;max-height:100%}
.slots.done .slot{animation:slotpop .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes slotpop{0%{transform:translateY(-4px) scale(1)}50%{transform:translateY(-14px) scale(1.14)}
  100%{transform:translateY(-4px) scale(1)}}
body.nomotion .slots.done .slot{animation:none}


.booth{position:absolute;inset:-4%;pointer-events:none;opacity:.85}
.booth svg{width:100%;height:100%;display:block}
.field::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 26%,rgba(251,243,228,.42) 0%,rgba(251,243,228,0) 62%)}
.sky{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:crosshair}
.sky.hurt{animation:hurt .34s}
@keyframes hurt{0%,100%{filter:none}30%{filter:saturate(.5) brightness(1.12)}}
body.nomotion .sky.hurt{animation:none}
.range{position:absolute;inset:0;pointer-events:none}
.range svg{width:100%;height:100%;display:block}
.lane{position:absolute;inset:0;pointer-events:none}
.lane.far{filter:blur(1.1px);opacity:.86;z-index:2}
.lane.mid{opacity:.94;z-index:3}
.lane.near{z-index:4;filter:drop-shadow(0 6px 0 rgba(59,43,58,.18))}
.fly{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.fly svg{display:block}
.fly.gold{filter:drop-shadow(0 0 13px rgba(255,220,120,.95))}
.fly .gsp{position:absolute;width:30px;height:30px;right:-4px;top:-8px;
  animation:gspin calc(2.2s / var(--dur,1)) linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
body.nomotion .fly .gsp{animation:none}
.fly.tg .gface{fill:#7BE3B6}
.fly.tgbad .gface{fill:#FF8A8A}
.fly.burst{animation:fburst .38s ease-out forwards}
@keyframes fburst{to{opacity:0;filter:brightness(2.2)}}
.fly.vanish{animation:fvan .34s ease-out forwards}
@keyframes fvan{to{opacity:0}}
.fly.bad{animation:fbad .5s}
@keyframes fbad{0%,100%{filter:none}25%,75%{filter:grayscale(1) brightness(.72)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;width:100%;height:100%}
.shotring{animation:sring .4s ease-out forwards}
@keyframes sring{to{r:46;opacity:0;stroke-width:2}}
.splash{animation:spl .4s ease-out forwards}
@keyframes spl{to{opacity:0;transform:scale(1.5)}}
.hitmark{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  border:5px solid rgba(59,43,58,.5);z-index:7;pointer-events:none;
  animation:hm .45s ease-out forwards}
.hitmark.good{border-color:#7BE3B6;box-shadow:0 0 16px rgba(123,227,182,.9)}
@keyframes hm{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
.combo{position:absolute;left:50%;top:5%;transform:translateX(-50%) scale(.6);opacity:0;z-index:8;
  font-weight:900;font-size:calc(2rem);color:var(--coral);pointer-events:none;
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  transition:opacity .18s,transform .22s cubic-bezier(.2,1.9,.4,1)}
.combo.show{opacity:1;transform:translateX(-50%) scale(1)}
.combo.fever{color:var(--butter);animation:fever calc(.5s / var(--dur,1)) ease-in-out infinite}
@keyframes fever{0%,100%{transform:translateX(-50%) scale(1) rotate(-3deg)}
  50%{transform:translateX(-50%) scale(1.16) rotate(3deg)}}
body.nomotion .combo.fever{animation:none}
.celebrate{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.4);opacity:0;
  z-index:9;pointer-events:none;width:86%;display:flex;justify-content:center;
  animation:cele 1.45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes cele{18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-64%) scale(.94)}}
.goldpop{position:absolute;left:50%;top:40%;width:74px;height:74px;margin-left:-37px;z-index:9;
  pointer-events:none;animation:gpop 1.4s cubic-bezier(.2,1.5,.4,1) forwards}
.goldpop svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 14px rgba(120,240,200,.9))}
@keyframes gpop{0%{opacity:0;transform:scale(.3)}22%{opacity:1;transform:scale(1.2)}
  40%{transform:scale(1)}100%{opacity:0;transform:translateY(-88px) scale(.7)}}


/* ===== 물시계 ===== */
/* ③ 물시계 → 일반 시계 + 타이머 */
.clockwrap{display:flex;align-items:center;gap:5px;background:var(--paper-0);border:3px solid var(--ink);
  border-radius:999px;padding:3px 10px 3px 5px;box-shadow:0 3px 0 var(--ink);flex:1 1 auto;min-width:0}
.clkface{width:100%;height:100%;display:block}
.clock svg.clkburst{animation:cshake .5s}
/* 물시계는 세로로 긴 모래시계다 */
.clock{width:23px;height:30px;flex:0 0 auto}
.wdrip{animation:wdrip 1.1s linear infinite}
@keyframes wdrip{0%{transform:translateY(0);opacity:0}
  15%{opacity:1}85%{opacity:1}100%{transform:translateY(34px);opacity:0}}
body.nomotion .wdrip{animation:none}
.clock.shake{animation:cshake .4s}
@keyframes cshake{0%,100%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-4px) rotate(-8deg)}75%{transform:translateX(4px) rotate(8deg)}}
body.nomotion .clock.shake{animation:none}
.cnum{font-weight:900;font-size:calc(1.06rem);flex:1 1 auto;text-align:right;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}
.cnum.low{color:#E4374B;animation:cnumb .55s ease-in-out infinite}
@keyframes cnumb{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
body.nomotion .cnum.low{animation:none}
.clock svg.burst{animation:cburst .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes cburst{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-6deg)}
  100%{transform:scale(1.05) rotate(3deg)}}
.shards{animation:shard .7s ease-out forwards}
@keyframes shard{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.7)}}

/* ===== 인트로 ===== */
.banner{position:absolute;left:0;right:0;top:0;bottom:0;z-index:14;display:flex;
  align-items:center;justify-content:center;pointer-events:none;opacity:0;
  transform:scale(.72);transition:opacity calc(.22s * var(--dur)) ease,
    transform calc(.32s * var(--dur)) cubic-bezier(.2,1.8,.4,1)}
.banner.in{opacity:1;transform:scale(1)}
.banner.num.in{transform:scale(1.12)}
.banner.go.in{transform:scale(1.18)}
.tauntcard{display:flex;flex-direction:column;align-items:center;gap:6px;
  background:rgba(251,243,228,.95);border:5px solid var(--ink);border-radius:28px;
  box-shadow:0 8px 0 var(--ink);padding:14px 20px 18px;max-width:90%}
.tauntcard .kinbox{width:min(64vw,320px)}
.tauntcard .ipic{width:min(20vw,88px);height:min(20vw,88px)}
.tauntcard .ipic svg{width:100%;height:100%;display:block}
.kinbody{animation:taunt 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes taunt{0%,100%{transform:rotate(-5deg) translateY(0)}
  30%{transform:rotate(4deg) translateY(-10px)}60%{transform:rotate(-3deg) translateY(2px)}}
body.nomotion .kinbody{animation:none}
.tongue{animation:tongue .55s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes tongue{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(1.25)}}
body.nomotion .tongue{animation:none}
.aletter{animation:alet 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;
  animation-delay:calc(var(--i) * .17s)}
@keyframes alet{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
body.nomotion .aletter{animation:none}

/* ===== 배경 생물 (인트로 동안만) ===== */
.bugs{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
  transition:opacity calc(.5s * var(--dur)) ease}
.bugs.on{opacity:1}
.critter{position:absolute;left:0;animation:cross var(--dur2,8s) linear infinite;
  animation-duration:var(--dur)}
@keyframes cross{from{transform:translateX(var(--from)) scaleX(var(--flip))}
  to{transform:translateX(var(--to)) scaleX(var(--flip))}}
.critter .wing{animation:flap .32s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}
.critter .wing2{animation:flap .32s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:0% 100%}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
body.nomotion .critter,body.nomotion .critter .wing,body.nomotion .critter .wing2{animation:none}

/* ===== 반응 ===== */
.toast{position:absolute;left:50%;top:13%;transform:translate(-50%,0) scale(.7);z-index:15;
  pointer-events:none;opacity:0;animation:toast 1.1s cubic-bezier(.2,1.6,.4,1) forwards;
  filter:drop-shadow(0 4px 0 rgba(59,43,58,.18))}
@keyframes toast{14%{opacity:.72;transform:translate(-50%,0) scale(1.05)}
  26%{transform:translate(-50%,0) scale(1)}
  68%{opacity:.66}100%{opacity:0;transform:translate(-50%,-46px) scale(.94)}}
.slotfly{position:fixed;z-index:120;pointer-events:none;opacity:.98;
  transition:transform calc(.3s * var(--dur)) cubic-bezier(.4,0,.2,1),opacity .3s ease}
.backfly{position:fixed;z-index:118;pointer-events:none;opacity:1;
  transition:transform calc(.55s * var(--dur)) cubic-bezier(.3,0,.6,1),opacity calc(.55s * var(--dur)) ease}
.slots .slot.pop{animation:slotin .42s cubic-bezier(.2,1.9,.4,1)}
@keyframes slotin{0%{transform:translateY(-4px) scale(1.3)}100%{transform:translateY(-4px) scale(1)}}
body.nomotion .slots .slot.pop{animation:none}
.count{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);z-index:16;
  pointer-events:none;opacity:.75;animation:cnt .85s cubic-bezier(.2,1.6,.4,1) forwards;
  filter:drop-shadow(0 0 18px rgba(255,120,110,.9))}
@keyframes cnt{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}
  22%{opacity:.8;transform:translate(-50%,-50%) scale(1)}
  75%{opacity:.7}100%{opacity:0;transform:translate(-50%,-50%) scale(.86)}}
.sky.panic::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:11;
  box-shadow:inset 0 0 70px 30px rgba(255,60,74,.85);animation:panic .9s ease-in-out infinite}
@keyframes panic{0%,100%{opacity:.55}50%{opacity:1}}
body.nomotion .sky.panic::after{animation:none;opacity:.6}


/* ===== R4 ICE BREAK ===== */
.sky.ice .frost{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(to bottom,rgba(191,230,245,.34),rgba(191,230,245,0) 46%,rgba(191,230,245,.22));}
.icelayer{position:absolute;inset:0;z-index:4}
.iceb{position:absolute;cursor:pointer;animation:icebob 2.8s ease-in-out infinite;
  animation-delay:var(--d,0s)}
@keyframes icebob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
body.nomotion .iceb{animation:none}
.iceb svg{position:absolute;inset:0}
.iceb .icepic{position:absolute;inset:17%;display:flex;align-items:center;justify-content:center;
  filter:saturate(.72) brightness(1.04) blur(.4px);opacity:.95}
.iceb .icepic svg{width:100%;height:100%;position:static}
.iceb.hitp{animation:icehit .18s}
@keyframes icehit{50%{transform:scale(.93)}}
body.nomotion .iceb.hitp{animation:none}
.iceb.wrong{animation:icewrong .5s}
@keyframes icewrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-3deg)}
  70%{transform:translateX(7px) rotate(3deg)}}
body.nomotion .iceb.wrong{animation:none}
.iceb.gone{animation:icegone .38s ease-out forwards}
@keyframes icegone{to{opacity:0;transform:scale(1.35)}}
.gword{background:var(--paper-0);border:3px solid var(--ink);border-radius:12px;
  box-shadow:0 3px 0 var(--ink);padding:3px 10px 1px;display:flex;align-items:center}
.wdots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
/* ★ 단어 높이를 고정한다 — geoWord는 폭만 받으므로 글자 수에 따라 높이가 널뛰어
   대시보드 높이가(=필드 크기가) 단어마다 달라진다. 높이를 못 박고 폭이 따라오게 한다. */
.dashrow .gword svg{width:auto!important;height:46px!important}
@media (max-width:470px){.dashrow .gword svg{height:38px!important}}
.wdots i{width:15px;height:15px;border-radius:50%;background:var(--paper-2);
  border:3px solid var(--ink);display:block}
.wdots i.on{background:var(--butter)}
/* ① 단어색 순환 — 부드럽게 넘어가게 */
.cyc .gface{transition:fill .45s ease}
/* ③ 북극곰·바다사자 놀이 — 배치는 SVG transform 속성, 동작은 CSS(fill-box) */
.bear{animation:bearbop 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 92%}
@keyframes bearbop{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg) translateY(-5px)}}
.seal{animation:sealbop 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 96%}
@keyframes sealbop{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-3deg) translateY(-4px)}}
body.nomotion .bear,body.nomotion .seal{animation:none}
/* 눈덩이는 JS 상태기계가 transform 속성으로 움직인다(피격→낙하→줍기→재개) — CSS 애니메이션 없음 */
/* ===== 피격 기절·원망 — 모든 개체는 사용자 입력에 반응한다 ===== */
.critter.stunned{animation-play-state:paused}
.critter.stunned svg{animation:stunwob .32s ease-in-out 4}
@keyframes stunwob{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
.stunfx{position:absolute;width:56px;height:32px;margin:-42px 0 0 -28px;pointer-events:none;z-index:9}
.stunfx svg{width:100%;height:100%;display:block;animation:stunspin .9s ease-in-out infinite;
  transform-origin:50% 130%}
@keyframes stunspin{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
body.nomotion .stunfx svg,body.nomotion .critter.stunned svg{animation:none}
.ouchline{position:absolute;transform:translate(-50%,-100%);z-index:16;pointer-events:none;
  animation:toast 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.ouchline .shout{font-size:clamp(17px,4.6vw,30px);-webkit-text-stroke:5px var(--ink)}
/* 사슴 — 진행 방향을 보며 뛴다 */
.critter.deer svg{animation:gallop .5s ease-in-out infinite alternate}
@keyframes gallop{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(2deg)}}
body.nomotion .critter.deer svg{animation:none}
/* 곰·바다표범 — 환호(정면 보고 점프)·기절·기어가기 */
.bear.cheer,.seal.cheer{animation:cheerjump .4s ease-in-out 3!important}
@keyframes cheerjump{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.bear.stunned,.seal.stunned{animation:stunshake .38s ease-in-out 3!important}
@keyframes stunshake{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}70%{transform:rotate(7deg)}}
.bear.crawl,.seal.crawl{animation:crawlbob .34s ease-in-out infinite!important}
@keyframes crawlbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
body.nomotion .bear.cheer,body.nomotion .seal.cheer,body.nomotion .bear.stunned,
body.nomotion .seal.stunned,body.nomotion .bear.crawl,body.nomotion .seal.crawl{animation:none!important}
/* ===== R1 강물 — 왼→오로 끝없이 흐른다 ===== */
.riverflow{animation:river 7s linear infinite;transform-box:fill-box}
@keyframes river{from{transform:translateX(0)}to{transform:translateX(1000px)}}
body.nomotion .riverflow{animation:none}
/* ===== R2 PICK ONE — 풍선·해변 ===== */
.bloon{position:absolute;cursor:pointer;z-index:4;
  animation:bloonbob 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bloonbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-11px) rotate(2deg)}}
body.nomotion .bloon{animation:none}
.bloon>svg{display:block;margin:0 auto}
.bloon .bpic{position:absolute;left:13%;right:13%;bottom:0;height:34%;
  background:var(--paper-0);border:4px solid var(--ink);border-radius:14px;
  box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:3px}
.bloon .bpic svg{width:auto;height:100%;position:static}
.bloon.wrong{animation:icewrong .5s}
body.nomotion .bloon.wrong{animation:none}
.bloon.gone{animation:bloongone .3s ease-out forwards}
@keyframes bloongone{40%{opacity:1;transform:scale(1.16)}to{opacity:0;transform:scale(.4)}}
/* 새 단어 = 발음 없이 글자 상자 깜빡임(읽기 축) */
.gword.readpulse{animation:readpulse .5s ease-in-out 2}
@keyframes readpulse{50%{transform:scale(1.07);
  box-shadow:0 4px 0 var(--ink),0 0 0 7px rgba(255,206,92,.55)}}
body.nomotion .gword.readpulse{animation:none}
/* 게·거북·갈매기 — 배치는 JS transform 속성, 반복 동작은 CSS(fill-box) */
.crab2{animation:crabbop 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes crabbop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.turt2{animation:turtbop 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 92%}
@keyframes turtbop{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.6deg)}}
.crab2 .claw{transform-box:fill-box;transform-origin:70% 88%;transition:transform .25s ease}
.crab2.clawup .cl{transform:rotate(-36deg)}
.crab2.clawup .cr2{transform:rotate(36deg)}
.crab2.cheer,.turt2.cheer{animation:cheerjump .4s ease-in-out 3!important}
.crab2.stunned,.turt2.stunned{animation:stunshake .38s ease-in-out 3!important}
.gull2{transform-box:fill-box;transform-origin:50% 50%}
.gull2 .gwing{animation:gullflap .5s ease-in-out infinite alternate;
  transform-box:fill-box;transform-origin:50% 100%}
@keyframes gullflap{from{transform:scaleY(1)}to{transform:scaleY(.5)}}
/* v0.1 ③ 폭탄 — 전원 화면 밖으로 날아갔다가 뿅 복귀 */
.crab2.blast,.turt2.blast,.gull2.blast{animation:blastoff 1s ease-in forwards!important}
@keyframes blastoff{25%{transform:translate(calc(var(--bx,600px)*.15),-130px) rotate(170deg);opacity:1}
  100%{transform:translate(var(--bx,600px),var(--by,-400px)) rotate(720deg);opacity:0}}
.crab2.backin,.turt2.backin,.gull2.backin{animation:backin .5s cubic-bezier(.2,1.5,.4,1)!important}
@keyframes backin{from{transform:scale(0) rotate(-160deg)}to{transform:scale(1) rotate(0)}}
/* 폭탄 심지 불꽃 깜빡임 */
.bombspark{animation:sparkbl .34s steps(2) infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sparkbl{50%{opacity:.15}}
body.nomotion .crab2,body.nomotion .turt2,body.nomotion .gull2 .gwing,
body.nomotion .crab2.cheer,body.nomotion .turt2.cheer,body.nomotion .bombspark,
body.nomotion .crab2.blast,body.nomotion .turt2.blast,body.nomotion .gull2.blast,
body.nomotion .crab2.backin,body.nomotion .turt2.backin,body.nomotion .gull2.backin,
body.nomotion .crab2.stunned,body.nomotion .turt2.stunned{animation:none!important}
/* ===== v0.11/v0.8/v0.2 — 폭탄·숲·카드 뒤집기 공용 ===== */
/* R1 숲: 나무 흔들림(뿌리 고정) */
.tree{transform-box:fill-box;transform-origin:50% 100%}
.tree.treeshake{animation:treeshake .62s ease-in-out}
@keyframes treeshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}
  45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}}
body.nomotion .tree.treeshake{animation:none}
/* R1 오답 철자 — 숲으로 낙하 */
.fallfly{position:fixed;z-index:60;pointer-events:none;opacity:1;
  transition:transform .6s cubic-bezier(.55,0,1,.7),opacity .14s .5s}
/* R1 배경 생물 폭발 이탈 */
.critter.blastc{animation:blastoff 1s ease-in forwards!important}
body.nomotion .critter.blastc{animation:none!important;opacity:0}
/* R4 폭탄 얼음 + 전 개체 이탈 */
.iceb.bombice .icepic{filter:none;opacity:1}
.bear.blast,.seal.blast,.peng.blast,.seal2.blast{animation:blastoff 1s ease-in forwards!important;
  transform-box:fill-box;transform-origin:50% 50%}
.bear.backin,.seal.backin,.peng.backin,.seal2.backin{animation:backin .5s cubic-bezier(.2,1.5,.4,1)!important;
  transform-box:fill-box;transform-origin:50% 50%}
body.nomotion .bear.blast,body.nomotion .seal.blast,body.nomotion .peng.blast,
body.nomotion .seal2.blast,body.nomotion .bear.backin,body.nomotion .seal.backin,
body.nomotion .peng.backin,body.nomotion .seal2.backin{animation:none!important}
/* R2 그림카드 뒤집기 — 뒷면은 물음표 */
.bloon .bpic{transition:transform .18s ease}
.bloon .bpic .bback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border-radius:10px;background:repeating-linear-gradient(45deg,var(--paper-2) 0 8px,var(--paper-1) 8px 16px);
  color:var(--ink);font-weight:900;font-size:30px;opacity:0;pointer-events:none;
  transform:rotateY(180deg)}
.bloon .bpic.flipped{transform:rotateY(180deg)}
.bloon .bpic.flipped svg{opacity:0}
.bloon .bpic.flipped .bback{opacity:1}
body.nomotion .bloon .bpic{transition:none}
/* R2 오답 그림 — 바다로 낙하 + 물튀김.
   v0.3: CSS 전이 → JS rAF 구동으로 교체(§3.2 — 전이 시작값이 같은 프레임에 커밋되지 않아
   애니메이션이 통째로 생략되던 레이스 제거). 낙하·둥둥·가라앉기는 JS, 물보라만 CSS. */
.cardfall{position:absolute;z-index:44;pointer-events:none;opacity:1;will-change:transform}
.seasplash{animation:splashpop .55s ease-out forwards;transform-box:fill-box;transform-origin:50% 100%}
@keyframes splashpop{from{opacity:1;transform:scale(.5)}55%{opacity:1}to{opacity:0;transform:scale(1.2)}}
body.nomotion .seasplash{animation:none;opacity:0}
/* ③-A(v0.3) 착수 물보라 — 물기둥(sjet)·물방울(shardfly 재사용)·파문(ripplex)·꼬르륵 기포 */
.sjet{animation:sjet .62s ease-out forwards;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sjet{0%{transform:scaleY(.15);opacity:.95}42%{transform:scaleY(1);opacity:1}
  100%{transform:scaleY(.18) translateY(4px);opacity:0}}
.ripplex{animation:ripplex .95s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes ripplex{0%{transform:scale(.25);opacity:.9}70%{opacity:.45}100%{transform:scale(1.7);opacity:0}}
.bubbleup{animation:bubbleup .8s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes bubbleup{0%{transform:translateY(0) scale(.6);opacity:.9}
  100%{transform:translateY(-26px) scale(1.15);opacity:0}}
body.nomotion .sjet,body.nomotion .ripplex,body.nomotion .bubbleup{animation:none;opacity:0}
/* ===== ① 대문자 SHOUT 타이틀 ===== */
.gametitle .shout{font-size:clamp(46px,11vw,88px);-webkit-text-stroke:9px var(--ink);letter-spacing:2px}
/* 공용 표준 — 게임 전 화면도 3초 뒤 자동 시작. ⚙를 열면 멈춘다 */
.autobar{width:min(260px,62vw);height:14px;border-radius:99px;background:var(--paper-2);
  border:3px solid var(--ink);overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.autobar i{display:block;height:100%;width:100%;transform-origin:left center;
  background:linear-gradient(90deg,var(--mint),var(--butter));
  animation:gaugego var(--gms,3000ms) linear forwards}
.autobar.stop i{animation-play-state:paused}
body.nomotion .autobar i{animation-duration:900ms}
/* ===== ⑤ 타겟마크 ===== */
.reticle{animation:retpop .38s cubic-bezier(.2,1.7,.4,1) forwards;transform-box:fill-box;transform-origin:center}
@keyframes retpop{0%{transform:scale(1.7);opacity:0}30%{transform:scale(1);opacity:1}
  75%{opacity:1}100%{transform:scale(.92);opacity:0}}
/* ===== ⑥ 팝건 ===== */
/* 공용 표준 FPS — 내가 직접 들고 있는 총 */
.gun{position:absolute;bottom:-20px;width:min(50vw,300px);z-index:12;pointer-events:none;
  filter:drop-shadow(0 7px 0 rgba(59,43,58,.22))}
.gun.right{right:2%} .gun.left{left:2%;transform:scaleX(-1)}
.gunbob{animation:gunbreath calc(3.6s / var(--dur,1)) ease-in-out infinite;will-change:transform}
@keyframes gunbreath{0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(6px) rotate(-1deg)}}
body.nomotion .gunbob{animation:none}
.gunrot{transition:transform .09s ease;transform-origin:50% 92%}
.gun.fire .gunrot svg{animation:gunkick .16s ease-out}
@keyframes gunkick{22%{transform:translateY(20px) scale(.975) rotate(-1.6deg)}
  60%{transform:translateY(7px) scale(.995) rotate(.4deg)}}
/* 발사 = 화면이 함께 밀린다. .sky를 통째로 흔들어 화면과 입력 좌표가 같이 움직인다 → 조준 오차 0 */
.sky.kick{animation:skykick .17s ease-out}
@keyframes skykick{0%{transform:translateY(0) scale(1)}
  32%{transform:translateY(4px) scale(1.012)}100%{transform:translateY(0) scale(1)}}
body.nomotion .sky.kick{animation:none}
.gun .cork{transform-box:fill-box;transform-origin:50% 100%}
.gun.fire .cork{animation:corkpop .18s ease-out}
@keyframes corkpop{40%{transform:translateY(-14px) rotate(-10deg)}}
/* 총구 물보라 — 흰 연기가 아니라 푸른 미스트 */
.gunpuff{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:radial-gradient(circle,#EAF9FD 0%,rgba(143,216,240,.72) 52%,rgba(143,216,240,0) 76%);
  z-index:11;pointer-events:none;animation:puff .42s ease-out forwards}
@keyframes puff{from{transform:scale(.4);opacity:.95}to{transform:scale(1.9) translateY(-26px);opacity:0}}
body.nomotion .gun.fire .gunrot svg,body.nomotion .gun.fire .cork{animation:none}
.gun.reload svg{animation:gundip .34s ease}
.gun .grip{transform-box:fill-box;transform-origin:50% 100%}
@keyframes gundip{25%{transform:translateY(34px) rotate(9deg)}70%{transform:translateY(30px) rotate(7deg)}}
body.nomotion .gun.reload svg{animation:none}
.bullet{position:absolute;width:17px;height:13px;margin:-6px 0 0 -8px;z-index:11;pointer-events:none;
  transition:transform .11s linear;filter:drop-shadow(0 2px 0 rgba(59,43,58,.25))}
/* 명중 = 물 튀김 */
.bulhit{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;
  pointer-events:none;z-index:11;border:5px solid #BFE9F7;
  background:radial-gradient(circle,rgba(202,240,252,.95),rgba(202,240,252,0) 70%);
  animation:bulhit .26s ease-out forwards}
@keyframes bulhit{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
.reloadhint{position:absolute;transform:translate(-50%,-100%);z-index:16;pointer-events:none;
  background:var(--paper-0);border:3px solid var(--ink);border-radius:999px;padding:2px 10px;
  box-shadow:0 3px 0 var(--ink);animation:toast 0.9s cubic-bezier(.2,1.6,.4,1) forwards}
.reloadhint .shout{font-size:clamp(13px,3.4vw,20px);-webkit-text-stroke:0;color:var(--ink);
  letter-spacing:.5px}
.magbtn{position:absolute;bottom:10px;width:52px;border:none;background:none;cursor:pointer;
  z-index:13;padding:0;display:flex;flex-direction:column;align-items:center;gap:0;
  filter:drop-shadow(0 4px 0 rgba(59,43,58,.25))}
.magbtn.right{right:calc(10px + env(safe-area-inset-right))}
.magbtn.left{left:calc(64px + env(safe-area-inset-left))}   /* 개발 버튼과 겹침 방지 */
.magbtn svg{width:100%;height:auto;display:block}
.magbtn .magrow{display:flex;align-items:baseline;gap:2px;background:var(--paper-0);
  border:3px solid var(--ink);border-radius:999px;padding:1px 8px;box-shadow:0 3px 0 var(--ink);
  margin-top:2px}
.magbtn .num{font-weight:900;font-size:calc(.92rem);letter-spacing:-.5px}
.magbtn .magn{font-size:calc(.68rem);font-weight:900;color:var(--ink-soft)}
.magbtn.low .magrow{background:#FFD9D4}
.magbtn.pop{animation:ammopop .5s cubic-bezier(.2,1.8,.4,1)}
/* 기관총 중에는 장전이 없다 — 탄창 버튼을 흐리게 해 누를 필요가 없음을 알린다 */
.magbtn.mgon{opacity:.45;filter:grayscale(.6)}
/* 공용 표준 — 탄창이 떨어지면 화면 한가운데에 안내(언어 0, 입력은 통과) */
.reloadcue{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.8);
  z-index:60;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:rgba(251,243,228,.94);border:5px solid var(--ink);border-radius:26px;
  box-shadow:0 8px 0 var(--ink);padding:14px 22px 16px;
  transition:opacity .18s ease,transform .26s cubic-bezier(.2,1.8,.4,1)}
.reloadcue.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.reloadcue .cuemag{width:min(16vw,74px);height:auto;display:block}

/* 글자 하나 — 잉크 외곽 + 단색. 두 겹뿐이다. */
function geoGlyph(ch,color){
  const m=GEO[String(ch).toLowerCase()]; if(!m||!m.d)return null;
  const g=E("g");
  g.appendChild(E("path",{d:m.d,fill:color,stroke:INK,"stroke-width":GEO_OUT*2,
    "stroke-linejoin":"round","paint-order":"stroke",class:"gface"}));
  return g;
}
/* 떠다니는 알파벳·슬롯용 타일 — 모든 글자가 정확히 같은 크기다 */
function geoTile(ch,color,px){
  const s=E("svg",{viewBox:`-14 -6 ${GEO_BOX.w+28} ${GEO_BOX.h+16}`,xmlns:NS,
    style:`width:${px}px;height:${(px*(GEO_BOX.h+16)/(GEO_BOX.w+28)).toFixed(1)}px;display:block;overflow:visible`});
  const g=geoGlyph(ch,color); if(g)s.appendChild(g);
  return s;
}
/* 단어 — 글자별 시각 폭(adv)만큼만 띄운다 */
function geoWord(word,color,maxW){
  const chars=[...String(word).toLowerCase()];
  let x=0; const g=E("g");
  chars.forEach(ch=>{
    const m=GEO[ch]; if(!m)return;
    if(m.d){ const gl=geoGlyph(ch,color);
      g.appendChild(E("g",{transform:`translate(${(x-(50-m.adv/2)).toFixed(1)},0)`},[gl])); }
    x+=m.adv+GEO_GAP;
  });
  const W=Math.max(1,x-GEO_GAP);
  const s=E("svg",{viewBox:`-16 -6 ${W+32} ${GEO_BOX.h+14}`,xmlns:NS,
    style:`width:${Math.min(maxW||320,W*1.05)}px;max-width:100%;height:auto;display:block;margin:0 auto;overflow:visible`});
  s.appendChild(g); return s;
}

/* ---- 물시계 —— 작고 귀여운 모래시계형. 물이 아래로 빠진다 ---- */
let CLK_SEQ=0;
function simpleClock(){
  const uid="wc"+(++CLK_SEQ);
  const svg=E("svg",{viewBox:"0 0 120 152",xmlns:NS,class:"clkface",
    style:"width:100%;height:100%;display:block;overflow:visible"});
  const defs=E("defs");
  /* 위·아래 방을 각각 클립해 둔다 — 물이 유리 밖으로 새면 물시계로 안 보인다 */
  const TOPD="M28 14H92V52Q92 70 60 86Q28 70 28 52Z";
  const BOTD="M28 138V100Q28 82 60 66Q92 82 92 100V138Z";
  const cpT=E("clipPath",{id:uid+"t"}); cpT.appendChild(E("path",{d:TOPD}));
  const cpB=E("clipPath",{id:uid+"b"}); cpB.appendChild(E("path",{d:BOTD}));
  defs.appendChild(cpT); defs.appendChild(cpB); svg.appendChild(defs);
  const g=E("g");
  /* 나무 틀 — 위/아래 가로대 + 기둥 2. 기둥이 있어야 "세워 둔 물건"으로 읽힌다 */
  g.appendChild(E("rect",{x:18,y:120,width:6,height:20,fill:"#C89A6B",stroke:INK,"stroke-width":5}));
  g.appendChild(E("rect",{x:96,y:120,width:6,height:20,fill:"#C89A6B",stroke:INK,"stroke-width":5}));
  g.appendChild(E("rect",{x:14,y:2,width:92,height:14,rx:7,fill:"#C89A6B",stroke:INK,"stroke-width":6}));
  /* 유리 — 위아래 방이 잘록한 목으로 이어진다 */
  const GLASS="M28 14H92V52Q92 70 60 86Q92 102 92 138H28Q28 102 60 86Q28 70 28 52Z";
  g.appendChild(E("path",{d:GLASS,fill:"#EAF6FB",stroke:INK,"stroke-width":6,"stroke-linejoin":"round"}));
  /* 위 물 — 줄어든다 */
  const top=E("rect",{x:26,y:14,width:68,height:72,fill:"#5AC8E8","clip-path":`url(#${uid}t)`});
  g.appendChild(top);
  const topSurf=E("rect",{x:26,y:14,width:68,height:5,fill:"#A9E8F8","clip-path":`url(#${uid}t)`});
  g.appendChild(topSurf);
  /* 아래 물 — 차오른다 + 수면에 파문 */
  const bot=E("rect",{x:26,y:138,width:68,height:0,fill:"#3FA9D6","clip-path":`url(#${uid}b)`});
  g.appendChild(bot);
  const botSurf=E("rect",{x:26,y:138,width:68,height:5,fill:"#8FDDF4","clip-path":`url(#${uid}b)`});
  g.appendChild(botSurf);
  /* 목에서 **똑똑 떨어지는 물방울** — 물시계로 읽히게 하는 결정적 한 가지.
     선이 아니라 방울이어야 "떨어지는 중"이 보인다. CSS가 반복해서 내려보낸다. */
  const drip=E("g",{class:"wdrip"});
  drip.appendChild(E("path",{d:"M60 90q-5 7 -5 10a5 5 0 0 0 10 0q0-3 -5 -10Z",fill:"#3FA9D6"}));
  g.appendChild(drip);
  /* 유리 윤곽선을 물 위에 다시 긋고 하이라이트 */
  g.appendChild(E("path",{d:GLASS,fill:"none",stroke:INK,"stroke-width":6,"stroke-linejoin":"round"}));
  g.appendChild(E("path",{d:"M38 22V46",stroke:"#FFFFFF","stroke-width":6,"stroke-linecap":"round",opacity:.8}));
  g.appendChild(E("path",{d:"M38 116V132",stroke:"#FFFFFF","stroke-width":5,"stroke-linecap":"round",opacity:.55}));
  g.appendChild(E("rect",{x:14,y:136,width:92,height:14,rx:7,fill:"#C89A6B",stroke:INK,"stroke-width":6}));
  svg.appendChild(g);
  const TH=72, BH=52;
  return {svg,g,
    /* p = 남은 비율 1→0 */
    set(p){
      p=Math.max(0,Math.min(1,p));
      const th=TH*p;
      top.setAttribute("y",(14+(TH-th)).toFixed(1)); top.setAttribute("height",th.toFixed(1));
      topSurf.setAttribute("y",(14+(TH-th)).toFixed(1)); topSurf.setAttribute("height",p>0?5:0);
      const bh=BH*(1-p);
      bot.setAttribute("y",(138-bh).toFixed(1)); bot.setAttribute("height",bh.toFixed(1));
      botSurf.setAttribute("y",(138-bh).toFixed(1)); botSurf.setAttribute("height",bh>0?5:0);
      drip.setAttribute("opacity",p>0.02?1:0);
      /* 남은 시간이 적으면 물빛이 붉어진다 — 색만으로 급함을 알린다(언어 0) */
      const c=p<=.2?"#FF6B7A":(p<=.45?"#FFCE5C":"#5AC8E8");
      top.setAttribute("fill",c);
    },
    burst(){                       /* 시간 초과 — 물시계가 터진다 */
      svg.classList.add("burst");
      const sh=E("g",{class:"shards"});
      for(let i=0;i<9;i++){const a=rnd(0,Math.PI*2), d=rnd(20,52);
        sh.appendChild(E("path",{d:`M${60+Math.cos(a)*d} ${75+Math.sin(a)*d}l${rnd(6,15)} ${rnd(-9,9)}l${rnd(-9,9)} ${rnd(7,14)}Z`,
          fill:i%2?"#EAF6FB":"#5AC8E8",stroke:INK,"stroke-width":3.5,"stroke-linejoin":"round"}));}
      g.appendChild(sh);
    }};
}

/* ---- Wordkin —— 단어의 화신. 라운드 전에 나와서 까분다 ----

/* 이번 판에 넣을 아이템 종류 n개 — heart는 하트가 안 찼을 때만, 최대 1개(희귀) */
function rollItems(n){
  const out=[];
  /* ★ 기관총은 한 판에 최대 1개. 늘 나오면 피스톨을 쓸 일이 없어져 게임이 밋밋해진다 */
  if(n>0&&SAVE.mgAmmo<=0&&Math.random()<.30)out.push("mgun");
  if(SAVE.hearts<heartCap()&&out.length<n&&Math.random()<.34)out.push("heart");
  /* 같은 아이템만 3개 뜨면 심심하다 — 종류를 먼저 다 채우고 남으면 그때 중복 허용 */
  const bag=shuf(ITEM_KINDS.slice());
  while(out.length<n){ out.push(bag.length?bag.pop():pick(ITEM_KINDS)); }
  return shuf(out).slice(0,n);
}
/* 보상 지급 — 반환 {score, ink} 증분. 화면 갱신은 호출부(런 누적값을 쥐고 있다) */
function grantItem(kind){
  if(kind==="mag"){ gainMag(); Cue2.gold(); return {score:0,ink:0}; }
  /* ★ 100발 기관총 — 받는 즉시 바뀐다. 지금 끼워 둔 피스톨 잔탄은 **보관**했다가
     100발을 다 쓰면 그대로 돌려준다(아이템을 먹었다고 손해 보면 안 된다). */
  if(kind==="mgun"){
    if(SAVE.mgAmmo<=0)SAVE.bankAmmo=SAVE.ammo;
    SAVE.mgAmmo=MG_SIZE; persist(); updAmmoHUD();
    Cue2.gold(); Snd.t(180,.10,"square",.14); setTimeout(()=>Snd.t(240,.14,"square",.12),90);
    return {score:0,ink:0};
  }
  if(kind==="heart"){
    if(SAVE.hearts<heartCap()){ SAVE.hearts+=1; persist(); Cue2.gold(); return {score:0,ink:0}; }
    Cue2.gold(); return {score:80,ink:0};            /* 만렙이면 점수로 대체 */
  }
  if(kind==="ink"){ Cue2.gold(); return {score:0,ink:10}; }
  Cue2.gold(); return {score:50,ink:0};              /* score */
}

function winFX(sky,cx,cy,big){
  const flash=H("div",{class:"winflash"}); sky.appendChild(flash);
  setTimeout(()=>flash.remove(),320);
  const CFC=["#FF7A6B","#FFCE5C","#6FD9C0","#6FB8E8","#B49AE0","#F79FC4"];
  const n=big?20:12;
  for(let i=0;i<n;i++){
    const c=H("div",{class:"confetti"});
    c.style.left=(cx+rnd(-40,40))+"px"; c.style.top=(cy+rnd(-20,20))+"px";
    c.style.background=pick(CFC);
    c.style.width=(big?rnd(8,14):rnd(6,10))+"px"; c.style.height=(big?rnd(12,20):rnd(9,14))+"px";
    c.style.setProperty("--cx",rnd(-140,140).toFixed(0)+"px");
    c.style.setProperty("--cy",rnd(120,300).toFixed(0)+"px");
    c.style.setProperty("--cr",rnd(-540,540).toFixed(0)+"deg");
    c.style.animationDelay=(i%5*0.05)+"s";
    sky.appendChild(c); setTimeout(()=>c.remove(),1500);
  }
  const sb=E("svg",{class:"starburst",xmlns:NS,viewBox:"-100 -100 200 200"});
  for(let i=0;i<8;i++){const a=i*Math.PI/4;
    const st=E("g",{class:"sbfly",style:`--sx:${(Math.cos(a)*88).toFixed(0)}px;--sy:${(Math.sin(a)*88).toFixed(0)}px`});
    st.appendChild(sparkle(0,0,big?13:10,i%2?"#FFE9A8":"#FFCE5C"));
    sb.appendChild(st);}
  sb.style.left=cx+"px"; sb.style.top=cy+"px";
  sky.appendChild(sb); setTimeout(()=>sb.remove(),700);
}

  function onMotion(e){

  sky.addEventListener("pointermove",e=>{
    if(y0==null)return;

      pauseOv=H("div",{class:"pauseov"},[shoutNode("PAUSE","#FFD45C")]);

   물방울의 소망이 "세상과 우주를 보는 것"이었으므로, 실력은 자기 별자리로 자란다.

const AXES=[
 {k:"spell", ic:"s_spell", lab:"SPELLING"},
 {k:"read",  ic:"s_read",  lab:"READING"},
 {k:"mean",  ic:"s_mean",  lab:"MEANING"},
 {k:"mem",   ic:"s_mem",   lab:"MEMORY"},

 {k:"listen",ic:"s_listen",lab:"LISTENING"}];
const AXIS_FULL=70;                        /* 이 값이면 축이 가득. 초반 성장이 눈에 보여야 한다 */
const axisPct=v=>Math.min(1,Math.max(0,v/AXIS_FULL));
function radarSVG(stat,delta){
  const R=104, CX=150, CY=142;
  const svg=E("svg",{viewBox:"0 0 300 290",xmlns:NS,style:"width:100%;height:auto;display:block;overflow:visible"});
  const g=E("g");
  /* 밤하늘 */
  g.appendChild(E("circle",{cx:CX,cy:CY,r:R+34,fill:"#2E2846"}));
  for(let i=0;i<26;i++){const a=i*2.4, rr=30+((i*37)%(R+26));
    g.appendChild(E("circle",{cx:CX+Math.cos(a)*rr,cy:CY+Math.sin(a)*rr,r:1.2+((i*7)%3)*.6,
      fill:"#FBF3E4",opacity:.45}));}
  /* 눈금 고리 */
  [.34,.67,1].forEach(f=>{
    let d="";
    AXES.forEach((_,i)=>{const a=-Math.PI/2+i*Math.PI/3;
      d+=(i?"L":"M")+(CX+Math.cos(a)*R*f).toFixed(1)+" "+(CY+Math.sin(a)*R*f).toFixed(1);});
    g.appendChild(E("path",{d:d+"Z",fill:"none",stroke:"#8E86B8","stroke-width":2,opacity:.5}));});
  AXES.forEach((_,i)=>{const a=-Math.PI/2+i*Math.PI/3;
    g.appendChild(E("path",{d:`M${CX} ${CY}L${CX+Math.cos(a)*R} ${CY+Math.sin(a)*R}`,
      stroke:"#8E86B8","stroke-width":2,opacity:.42}));});
  /* 내 별자리 */
  const pt=[];
  AXES.forEach((ax,i)=>{const a=-Math.PI/2+i*Math.PI/3;
    const f=Math.max(.13,axisPct(stat[ax.k]||0));
    pt.push([CX+Math.cos(a)*R*f, CY+Math.sin(a)*R*f]);});
  let dd=""; pt.forEach((p,i)=>{dd+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);});
  g.appendChild(E("path",{d:dd+"Z",fill:"#FFCE5C","fill-opacity":.30,stroke:"#FFE9A8",
    "stroke-width":4,"stroke-linejoin":"round",class:"conste"}));
  pt.forEach((p,i)=>{
    const st=E("g",{class:"cstar",style:`--i:${i}`});
    st.appendChild(sparkle(p[0],p[1],9,"#FFE9A8"));
    g.appendChild(st);});
  /* 축 아이콘 + 터치 라벨(사용자 지시 2026-08-03: 심벌을 터치하면 영어 능력명 표시) */
  const tipLayer=E("g");
  let tipT=0;
  function showTip(i,x,y){
    tipLayer.innerHTML=""; clearTimeout(tipT);
    const lab=AXES[i].lab;
    const w2=lab.length*8.6+26;
    const tx=clamp(x,w2/2+4,296-w2/2);
    const below=y<CY;                          /* 중심 쪽으로 편다 — 위 축은 아래로, 아래 축은 위로 */
    const ry=below?y+24:y-52;
    tipLayer.appendChild(E("rect",{x:(tx-w2/2).toFixed(1),y:ry,width:w2.toFixed(1),height:28,rx:14,
      fill:"#FBF3E4",stroke:INK,"stroke-width":3.5}));
    tipLayer.appendChild(E("text",{x:tx.toFixed(1),y:ry+19,"text-anchor":"middle","font-size":13.5,
      "font-weight":800,fill:INK,"letter-spacing":".05em",
      "font-family":'"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif'},
      [document.createTextNode(lab)]));
    tipT=setTimeout(()=>{tipLayer.innerHTML="";},1500);
  }
  AXES.forEach((ax,i)=>{const a=-Math.PI/2+i*Math.PI/3;
    const x=CX+Math.cos(a)*(R+30), y=CY+Math.sin(a)*(R+30);
    const box=E("g",{transform:`translate(${(x-17).toFixed(1)},${(y-17).toFixed(1)})`});
    box.appendChild(E("circle",{cx:17,cy:17,r:19,fill:"#FBF3E4",stroke:INK,"stroke-width":4}));
    const ic=E("svg",{viewBox:"0 0 64 64",x:4,y:4,width:26,height:26});
    ic.innerHTML=MGICON[ax.ic]; box.appendChild(ic);
    if(delta&&delta[ax.k]>0){
      const bd=E("g",{class:"dpop"});
      bd.appendChild(E("circle",{cx:34,cy:2,r:13,fill:"#FF7A6B",stroke:INK,"stroke-width":3.5}));
      bd.appendChild(E("text",{x:34,y:7,"text-anchor":"middle","font-size":14,"font-weight":900,
        fill:"#FBF3E4","font-family":"inherit"},[document.createTextNode("+"+delta[ax.k])]));
      box.appendChild(bd);}
    /* 44px급 투명 히트 영역 — 모바일에서도 눌린다 */
    const hit=E("circle",{cx:17,cy:17,r:26,fill:"transparent",class:"axhit",
      style:"cursor:pointer;pointer-events:all"});
    hit.addEventListener("pointerdown",ev=>{ev.stopPropagation(); Snd.tap(); showTip(i,x,y);});
    box.appendChild(hit);
    g.appendChild(box);});
  g.appendChild(tipLayer);
  svg.appendChild(g); return svg;
}

function paintHearts(w,bump){
  if(!w)return;
  const n=Math.max(0,SAVE.hearts);
  const b=w.querySelector(".hx"), h=w.querySelector(".h");
  if(b)b.textContent="\u00d7"+n;
  if(h){h.innerHTML=""; h.appendChild(mgSVG(n>0?"heart":"heartOff")); h.classList.toggle("on",n>0);}
  w.classList.toggle("zero",n<=0);
  if(bump){w.classList.remove("bump"); void w.offsetWidth; w.classList.add("bump");}
}
/* ⑤ 천 단위 약자 — 1000부터 K, 100만부터 M, 10억부터 B.
   10 미만이면 소수 한 자리(3.6K), 그 이상이면 정수(36K)라 최대 5자다. */
function fmtNum(n){
  n=Math.max(0,Math.round(Number(n)||0));
  const U=[[1e9,"B"],[1e6,"M"],[1e3,"K"]];
  for(const u of U){
    if(n>=u[0]){ const x=n/u[0]; return (x<10?x.toFixed(1):String(Math.round(x)))+u[1]; }
  }
  return String(n);
}
/* ③ 시계는 **물시계**로 되돌렸다(사용자 지시 — 일반 시계 폐기). */
function counter(kind,n){
  const d=H("div",{class:"cnt"});
  d.appendChild(mgSVG(kind));
  d.appendChild(H("b",{text:fmtNum(n),class:"num"}));
  return d;
}

   설계(신뢰 모드 권장안):
   - 기본 틀 5단계의 예습(단어+그림+발음) → 게임 반복 → (복습·보상은 후속 모듈).
   - 스테이지제: READY·GO는 한 번만. 단어 3개가 랜덤 순서(직전 연속 금지,
     마지막 남은 단어만 예외), 단어당 3픽 = 총 9픽으로 클리어.
   - 게임 중에는 단어를 읽어주지 않는다 — 읽기 축이므로 소리 없이 글자만 보고
     판단해야 학습이 성립한다(R4는 듣기+읽기라 GO 직후 발음, R2는 침묵이 설계).
     예습에서는 그림+발음을 다 준다.
   - 오답 풍선 = 시간 -1.5초 + 0.8초 잠금(이중 벌 방지). 하트는 스테이지 실패에만.
   - 시간 초과 → 물시계 폭발 → 하트 -1 → TRY AGAIN(진행 유지·시간만 리필).
   - 스테이지 타이머 65초: 1픽 ≈ 읽기 2 + 훑기 2 + 조준·발사 1.5 = 5.5초 × 9회

   - 배경 = 해변: 게 1(옆걸음)·거북 1(느린 산책)·갈매기 3(비행)·물고기 2(점프 사이클)
     + 흐르는 파도(강물과 같은 이음새 루프). 게·거북은 피격 기절+원망 대사,
     단어 학습 완성 때 정면 환호 — 모든 개체는 입력에 반응한다(재미 최우선).
   - 총·탄약·장전·일시정지·레이더는 공용 시스템 그대로.
   Wordkin·CAP 폰트는 미확정/반려라 쓰지 않는다. SHOUT 서체는 승인(공용).
   ====================================================================== */
/* v0.5 ②(사용자 지시) — **단어당 1픽**. "3번은 지루하다."
   한 번 제대로 고르면 그 단어는 끝나고 바로 다음 단어로 넘어간다. */
const R2_TIME=80000, R2_NEED=1;
/* v0.5 ①(사용자 지시) — **풍선 12 → 10개**. "너무 어렵다."
   v0.5.1(사용자 지적으로 재수정): 총량만 10으로 줄였더니 **줄어든 것이 전부 아이템 풍선**이었다.
   `아이템 = 총량 − 정답 − 오답전부 − 폭탄`으로 남은 자리를 채우는 구조라, 총량을 깎으면
   맨 뒤 항목인 아이템부터 사라진다. 실측 구성:
     v0.4  12개 = 정답1 + **오답그림6** + 폭탄1~2 + 아이템3~4
     v0.5  10개 = 정답1 + **오답그림6** + 폭탄1~2 + 아이템1~2   ← 오답은 그대로, 보상만 감소
   **"어렵다"의 원인은 골라내야 할 오답 그림 수**인데 그건 하나도 줄지 않았다.
   → 오답 그림을 **6 → 4**로 직접 제한한다. 총 10 = 정답1 + 오답4 + 폭탄1~2 + 아이템3~4.
   WORDS가 7개라 `filter`가 항상 6개를 뱉던 것이 원인이므로, 뽑고 나서 잘라야 한다. */
const R2_BLOONS=10;
const R2_WRONG=4;                            /* 화면에 동시에 있는 오답 그림 상한 */

function scrPlay(){
  clearAll(); SCREEN="play";
  SAVE.hearts=Math.max(0,SAVE.hearts); persist();

  /* ---------- DOM ---------- */
  const wrap=H("div",{class:"game"});
  const hud=H("div",{class:"hud"});
  const hearts=heartsRow();
  const rowT=H("div",{class:"dashrow top"});
  const rowB=H("div",{class:"dashrow bot"});
  const clockBox=H("div",{class:"clock",id:"clock"});
  let clock=simpleClock(); clockBox.appendChild(clock.svg);
  const clockNum=H("b",{class:"cnum",id:"cnum",text:"0"});
  const clockWrap=H("div",{class:"clockwrap"},[clockBox,clockNum]);
  const scoreBox=H("div",{class:"score"},[H("b",{id:"scoreN",text:"0"})]);
  const inkBox=counter("ink",SAVE.ink); inkBox.id="inkBox";
  /* ★ 대시보드 2행 — 1행: ♥×N · 점수 · 먹물 · [여백] · ⚙ / 2행: 시계 · 철자판 */
  inkBox.classList.add("fixed");
  const spacer=H("div",{class:"spacer"});
  const gearBtn=mgBtn("gear",parentPanel); gearBtn.id="playGear";
  [hearts,scoreBox,inkBox,spacer,gearBtn].forEach(n=>rowT.appendChild(n));
  rowB.appendChild(H("div",{class:"timecell"},[clockWrap]));
  hud.appendChild(rowT); hud.appendChild(rowB);

  /* 목표 = 단어. 그림은 답이므로 여기엔 없다 */
  const goal=H("div",{class:"goal"});
  const wordBox=H("div",{class:"gword cyc",id:"gword"});
  const dots=H("div",{class:"wdots",id:"wdots"});
  goal.appendChild(wordBox); goal.appendChild(dots);

  const sky=H("div",{class:"sky beach",id:"field"});
  const BG=beachBG();                          /* v0.5.1 — 원래 해변 배경으로 복귀 */
  sky.appendChild(BG.node);
  const bugs=H("div",{class:"bugs",id:"bugs"}); sky.appendChild(bugs);
  const bloonLayer=H("div",{class:"icelayer",id:"bloonlayer"}); sky.appendChild(bloonLayer);
  const fxSVG=E("svg",{class:"fx",id:"fx",xmlns:NS}); sky.appendChild(fxSVG);
  const banner=H("div",{class:"banner",id:"banner"}); sky.appendChild(banner);
  /* ★ 철자판은 대시보드 2행에 — 시계 영역만큼 들여쓰고 오른쪽은 비워 둔다 */
  rowB.appendChild(goal);
  wrap.appendChild(hud); wrap.appendChild(sky);
  app.appendChild(wrap);

  /* ---------- 상태 ---------- */
  const pool=shuf(WORDS).slice(0,ROUND_LEN);   /* 이 스테이지의 단어 3개 */
  const matched={}; pool.forEach(w=>matched[w.k]=0);
  let cur=null;
  let score=0, streak=0, inkRun=0, seedRun=0, picks=0, learned=0;
  let roundLeft=0, running=false, over=false, lockFire=false;
  let lastCount=-1, last=performance.now();
  let ensureT=0;                               /* 정답 풍선 존재 감시 시계 */
  let FW=0, FH=0;
  const bloons=[];

  /* §3.2 수정(v0.4/v0.9) — 타겟마크가 탭보다 위에 찍히고 아래로 갈수록 벌어지던 버그.
     원인: measure()가 목표 단어(geoWord) 렌더 전에 한 번만 돌아 FH가 낡은 값(739)으로 남고,
     fx viewBox(0 0 FW 739)와 실제 높이(609)가 어긋나 SVG가 uniform 축소·중앙 정렬됐다.
     → 아래로 갈수록 오차가 커지는 전형적 스케일 불일치. ResizeObserver로 상시 동기화한다. */
  function measure(){const r=sky.getBoundingClientRect();
    const w2=Math.max(1,r.width), h2=Math.max(1,r.height);
    if(w2===FW&&h2===FH)return;
    FW=w2; FH=h2;
    fxSVG.setAttribute("viewBox",`0 0 ${FW} ${FH}`);}
  measure();
  const onRz=()=>{if(SCREEN==="play")measure();};
  window.addEventListener("resize",onRz); window.addEventListener("orientationchange",onRz);
  /* 레이아웃 확정(단어 박스 삽입·폰트 반영) 이후에도 따라간다 — 이게 없으면 다시 어긋난다 */
  let fieldRO=null;
  if(window.ResizeObserver){ fieldRO=new ResizeObserver(()=>{if(SCREEN==="play")measure();});
    fieldRO.observe(sky); }
  else later(()=>{if(SCREEN==="play")measure();},60);
  const wait=ms=>new Promise(r=>later(r,Math.max(1,ms*(SAVE.set.motion?1:.3))));
  const curWord=()=>cur;
  /* 검증 프로브(본편 이식 시 제거) — 범위를 벗어나도 절대 던지지 않게 한다 */
  window.__R2=()=>{ const q=cur||null;
    return {word:q?q.w:"", k:q?q.k:"", need:R2_NEED, matched:q?(matched[q.k]|0):0,
      learned:learned, picks:picks, running:running, lockFire:lockFire, over:over,
      bloons:bloons.length, layers:bloons.map(b=>b.l),
      wrong:bloons.filter(b=>b.t==="pic"&&q&&b.k!==q.k).length,
      items:bloons.filter(b=>b.t==="item").length,
      bombs:bloons.filter(b=>b.t==="bomb").length,
      left:Math.round(roundLeft), score:score, hearts:SAVE.hearts}; };

  /* 단어색 순환(승인 공용) — 잉크 외곽 2겹은 그대로라 읽기는 흔들리지 않는다 */
  const CYC=["--butter","--coral","--mint","--sky","--grape","--rose"].map(v=>CSSV(v));
  let cycStep=0;
  const cycT=setInterval(()=>{
    if(SCREEN!=="play"){clearInterval(cycT);return;}
    cycStep++;
    wrap.querySelectorAll(".cyc").forEach(box=>
      box.querySelectorAll(".gface").forEach((p2,i2)=>
        p2.setAttribute("stroke",CYC[(i2+cycStep)%CYC.length])));
  },620);

  /* 다음 단어 — 아직 3픽 못 채운 단어 중 랜덤. 가능하면 직전과 다른 단어 */
  function pickNext(){
    const rest=pool.filter(w=>matched[w.k]<R2_NEED);
    if(!rest.length)return null;
    const other=rest.filter(w=>!cur||w.k!==cur.k);
    return pick(other.length?other:rest);
  }
  function paintGoal(){
    const q=curWord(); if(!q)return;
    wordBox.innerHTML=""; wordBox.dataset.w=q.w; wordBox.dataset.n=String(picks);
    /* 목표 단어 20% 축소(사용자 지시 ②) — 상단 점유를 줄인다. 300→240 / .56→.448 */
    /* 대시보드에 들어가므로 세로를 줄인다 — 폭이 아니라 **높이**가 필드를 잡아먹는다 */
    wordBox.appendChild(geoWord(q.w,CSSV("--butter"),Math.min(150,window.innerWidth*.30)));
    /* 새 단어 = 글자 깜빡임 + 발음(④ 사용자 확정 — 발음은 호출부에서) */
    wordBox.classList.remove("readpulse"); void wordBox.offsetWidth; wordBox.classList.add("readpulse");
    /* §3.2(v0.5) — 단어당 1픽이 되면서 "이 단어 진행 별"이 **칸 하나짜리**가 됐다.
       0 아니면 1뿐이라 정보가 사라진 것이다. 별을 **스테이지 진행**(단어 3개 중 몇 개)으로
       승격한다 — 남은 목표가 몇 개인지가 오히려 더 중요한 정보다. */
    dots.innerHTML="";
    for(let i=0;i<pool.length;i++){
      const on=i<learned;
      const st=H("div",{class:"wstar"+(on?" on":"")});
      st.appendChild(starSVG(on));
      dots.appendChild(st);
    }
  }

  /* ---------- 풍선 ---------- */
  let B_SEQ=0;
  const BCOL=[["#FF8A80","#FFB3AC"],["#7BD8C2","#B2EBDD"],["#8FC7F2","#C0E2FA"],
    ["#FFC46B","#FFE0AC"],["#C9A8F0","#E2D2F8"],["#FF9ED0","#FFC8E4"]];
  /* 겹 풍선(②): layers겹을 뒤에 겹쳐 그린다 — 깊은 겹일수록 위로 살짝 올라가 개수가 보인다.
     glayers[마지막]=맨 앞 겹. 한 발마다 앞 겹을 제거한다. */
  function bloonSVG(size,ci,layers){
    const s=E("svg",{viewBox:"0 0 120 168",xmlns:NS,
      style:`width:${size}px;height:${size*1.4}px;display:block;overflow:visible`});
    const gl=[];
    for(let j=layers-1;j>=0;j--){                  /* 깊은 겹부터 그린다 */
      const [c1,c2]=BCOL[(ci+j)%BCOL.length];
      const g=E("g",{transform:`translate(0,${-j*11})`});
      g.appendChild(E("ellipse",{cx:60,cy:46,rx:41,ry:47,fill:c1,stroke:INK,"stroke-width":7}));
      g.appendChild(E("ellipse",{cx:46,cy:32,rx:13,ry:17,fill:c2,opacity:.9}));
      g.appendChild(E("path",{d:"M54 92L66 92L60 102Z",fill:c1,stroke:INK,"stroke-width":5,"stroke-linejoin":"round"}));
      gl.unshift(g);                               /* gl[0]=깊은 겹 … gl[len-1]=앞 겹 */
      s.appendChild(g);
    }
    s.appendChild(E("path",{d:"M60 102Q52 112 60 120Q68 128 60 136",fill:"none",
      stroke:INK,"stroke-width":4,"stroke-linecap":"round"}));
    s._glayers=gl;
    return s;
  }
  /* 폭탄 풍선(③) — 그림 대신 폭탄이 매달려 있다. 잘못 쏘면 대폭발 */
  function bombSVG(size){
    const s=E("svg",{viewBox:"0 0 120 168",xmlns:NS,
      style:`width:${size}px;height:${size*1.4}px;display:block;overflow:visible`});
    s.appendChild(E("ellipse",{cx:60,cy:46,rx:41,ry:47,fill:"#5A5266",stroke:INK,"stroke-width":7}));
    s.appendChild(E("path",{d:"M30 26Q60 6 90 26",fill:"none",stroke:"#FF8A80","stroke-width":8,"stroke-linecap":"round",opacity:.85}));
    s.appendChild(E("ellipse",{cx:46,cy:32,rx:12,ry:15,fill:"#847A92",opacity:.85}));
    s.appendChild(E("path",{d:"M54 92L66 92L60 102Z",fill:"#5A5266",stroke:INK,"stroke-width":5,"stroke-linejoin":"round"}));
    s.appendChild(E("path",{d:"M60 102Q52 110 60 116",fill:"none",stroke:INK,"stroke-width":4,"stroke-linecap":"round"}));
    /* 폭탄 본체 + 심지 + 불꽃 */
    s.appendChild(E("circle",{cx:60,cy:136,r:17,fill:"#3B2B3A",stroke:INK,"stroke-width":6}));
    s.appendChild(E("ellipse",{cx:54,cy:130,rx:5,ry:3.4,fill:"#6E5E70"}));
    s.appendChild(E("path",{d:"M60 119Q68 112 74 114",fill:"none",stroke:INK,"stroke-width":4,"stroke-linecap":"round"}));
    const sp=E("g",{class:"bombspark",transform:"translate(76,112)"});
    sp.appendChild(E("path",{d:"M0 -7L2 -2L7 0L2 2L0 7L-2 2L-7 0L-2 -2Z",fill:"#FFD45C",stroke:INK,"stroke-width":2.5}));
    s.appendChild(sp);
    return s;
  }
  /* ①④ 7개 풍선이 양쪽 사이드에서 진입해 좌우로 계속 비행.
     속도 7단 사다리 + 방향 최소 3:3 보장 — 빠른 놈·느린 놈이 섞여 겹친다. */
  /* v0.4 ⑦ 풍선 12개 — 크기 8% 축소로 화면 숨통을 확보한다 */
  const B_SIZE=()=>Math.max(59,Math.min(94,FW*0.156));
  /* v0.4 ⑦ 속도: 최고속을 2단 연장(.30 → .37 → .45 = 화면폭 45%/초).
     사다리는 웨이브 전체가 고루 퍼지게 하는 층화용이고, 개별 속도는 그 범위 안 연속 랜덤이다. */
  const SPD_LADDER=[.055,.085,.115,.15,.19,.24,.30,.37,.45];
  const SPD_MIN=.055, SPD_MAX=.45;
  const rndSpd=()=>rnd(SPD_MIN,SPD_MAX);
  /* 층화 랜덤 — n개를 최저~최고 구간에 고르게 흩되 각 칸 안에서는 랜덤 */
  function spdSpread(n){
    const out=[];
    for(let i=0;i<n;i++){
      const lo=SPD_MIN+(SPD_MAX-SPD_MIN)*(i/n), hi=SPD_MIN+(SPD_MAX-SPD_MIN)*((i+1)/n);
      out.push(rnd(lo,hi));
    }
    return shuf(out);
  }
  /* ①-c(v0.3) 대각선 풍선 — 아래 구석에서 비스듬히 날아올라 화면 밖으로 사라진다.
     사라진 풍선 자리는 무작위 새 풍선이 보충(정답 최우선 규칙 공유). 상시 2~3개 유지. */
  const DIAG_MIN=2, DIAG_MAX=3;
  const DIAG_VY=[.10,.125,.15,.17];                 /* 화면높이/초 — 5.9~10초에 종단 */
  const diagCount=()=>bloons.reduce((n,b)=>n+(!b.dead&&b.mode==="diag"?1:0),0);
  function pickMode(){
    const n=diagCount();
    if(n<DIAG_MIN)return "diag";
    if(n>=DIAG_MAX)return "h";
    return Math.random()<.35?"diag":"h";
  }
  /* 풍선 1개 생성 — 웨이브·개별 보충(2-A) 공용. it.mode="h"|"diag"(없으면 자동 배정)
     it.t = "pic"(그림) | "bomb"(폭탄) | "item"(아이템, it.item=mag|heart|ink|score) */
  function spawnOne(it,i,stag){
    const size=B_SIZE();
    const bh=size*1.4+size*.52;                     /* 풍선+그림카드 전체 높이 */
    const mode=it.mode||pickMode();
    const cyMin=bh*.40, cyMax=FH*.64-bh*.32;
    const lane=i%4;                                 /* v0.4 12개 — 레인 4줄로 늘려 밀도 분산 */
    const dir=it.dir!==undefined?it.dir:(Math.random()<.5?1:-1);
    const v=(it.v!==undefined?it.v:rndSpd())*FW/1000;
    let x0,cy,vy=0;
    if(mode==="diag"){
      /* 왼아래→오른위(dir 1) / 오른아래→왼위(dir -1). 화면 아래 밖에서 출발 */
      x0=dir>0 ? rnd(size*.5,FW*.30) : FW-rnd(size*.5,FW*.30);
      cy=FH+bh*.55+(stag||0);
      vy=pick(DIAG_VY)*FH/1000;
    }else{
      cy=Math.max(cyMin,Math.min(cyMax,cyMin+lane*(cyMax-cyMin)/3+rnd(-10,10)));
      /* 진행 방향 반대편 사이드 밖에서 진입 */
      x0=dir>0 ? -size*.6-(stag||0) : FW+size*.6+(stag||0);
    }
    /* v0.5 ② — **모든 풍선 1겹**(겹 폐기).
       ⚠️ 설계상 불가피한 연쇄다: "한 단어당 한 번"을 지키려고 **정답 풍선만** 1겹으로 만들면,
       겹은 눈에 보이기 때문에(깊은 겹일수록 위로 올라가 개수가 드러난다) **1겹짜리를 찾으면
       읽지 않고도 정답을 안다** — 확정 규칙 "난이도 신호를 메커니즘에 흘리지 말 것" 위반이다.
       그래서 전부 1겹으로 통일한다(MG4의 "전 유형 5연타 동일"과 같은 논리). */
    const layers=1;
    const el=H("div",{class:"bloon"});
    el.dataset.k=it.t==="bomb"?"bomb":(it.t==="item"?"item":it.w.k);
    el.dataset.t=it.t;
    if(it.t==="item")el.dataset.item=it.item;
    el.dataset.id=String(++B_SEQ);
    el.dataset.l=String(layers);
    el.dataset.mode=mode;
    el.dataset.v=(v*1000/FW).toFixed(4); el.dataset.dir=String(dir);
    el.style.width=size+"px"; el.style.height=bh+"px";
    el.style.left=(x0-size/2)+"px"; el.style.top=(cy-bh/2)+"px";
    el.style.zIndex=String(4+((i*3)%R2_BLOONS));
    el.style.setProperty("--d",(rnd(0,2.2)).toFixed(2)+"s");
    let glayers=null;
    if(it.t==="bomb"){ el.appendChild(bombSVG(size)); }
    else{
      const sv=bloonSVG(size,(i+B_SEQ)%BCOL.length,layers);
      glayers=sv._glayers; el.appendChild(sv);
      const pic=H("div",{class:"bpic"});
      pic.appendChild(it.t==="item"?itemSVG(it.item):partIcon(it.w.k));
      pic.appendChild(H("b",{class:"bback",text:"?"}));     /* ①-b 뒤집힌 카드의 뒷면 */
      el.appendChild(pic);
    }
    bloonLayer.appendChild(el);
    bloons.push({el,k:el.dataset.k,t:it.t,item:it.item||null,l:layers,glayers,locked:0,
      size,w:size,h:bh,x:x0,y:cy,vx:v,vy,dir,mode,z:4+((i*3)%R2_BLOONS),dead:false});
  }
  /* 전체 웨이브 — GO 직후와 폭탄 대참사 뒤에만 쓴다(③). 속도 사다리·방향 3:5 보장 셔플 */
  /* v0.4 ⑦ 12개 구성(5-A): 정답 1 + 오답 6(단어 7종 전부) + 폭탄 1~2 + 아이템 나머지(3~4).
     단어가 12개에 모자라니 남는 자리를 폭탄·아이템으로 채운다(사용자 지시). */
  function makeSet(q){
    /* v0.5.1 — 오답 그림은 R2_WRONG개까지만. 이게 실제 난이도 손잡이다 */
    const others=shuf(WORDS.filter(w=>w.k!==q.k)).slice(0,R2_WRONG).map(w=>({t:"pic",w}));
    const bombN=Math.random()<.35?2:1;
    const itemN=Math.max(0,R2_BLOONS-1-others.length-bombN);
    return shuf([{t:"pic",w:q}].concat(others)
      .concat(Array.from({length:bombN},()=>({t:"bomb"})))
      .concat(rollItems(itemN).map(k=>({t:"item",item:k}))));
  }
  function spawnWave(){
    bloons.slice().forEach(b=>removeBloon(b,false));
    const q=curWord(); if(!q)return;
    const set=makeSet(q);
    const SPD=spdSpread(set.length);               /* 최저~최고 구간 층화 랜덤 */
    const DIRS=shuf(set.map((_,i)=>i%2?1:-1));
    /* ①-c 웨이브에서 2~3개를 대각선으로 배정 */
    const diagN=Math.random()<.5?2:3;
    const diagIdx=shuf(set.map((_,i)=>i)).slice(0,diagN);
    set.forEach((it,i)=>{
      it.v=SPD[i]; it.dir=DIRS[i];
      it.mode=diagIdx.indexOf(i)>=0?"diag":"h";
      spawnOne(it,i,(i%4)*rnd(20,50));
    });
  }
  /* ②③ 개별 보충 — 터진 자리를 잠시 후 새 풍선 1개가 채운다.
     현재 단어 그림이 화면에 없으면 그 그림을 최우선 배정(정답 풍선 항상 존재).
     폭탄이 다 떨어졌으면 폭탄을, 아니면 화면에 없는 그림을 넣는다. */
  function replaceBloon(delay){
    later(()=>{
      if(over||SCREEN!=="play")return;
      const q=curWord(); if(!q)return;
      /* 정원이 차 있어도 "현재 단어의 그림"이 없으면 반드시 넣는다 — 보충 경합 교착 방지 */
      if(bloons.length>=R2_BLOONS&&bloons.some(b=>b.k===q.k))return;
      let it;
      if(!bloons.some(b=>b.k===q.k))it={t:"pic",w:q};
      else if(!bloons.some(b=>b.k==="bomb"))it={t:"bomb"};
      else{
        /* v0.5.1 — 보충도 오답 상한을 지킨다. 지키지 않으면 시간이 지나며 다시 6개로 불어나
           makeSet에서 줄인 의미가 사라진다(실제로 이 경로로 새어나간다). */
        const wrongN=bloons.filter(b=>b.t==="pic"&&b.k!==q.k).length;
        const absent=WORDS.filter(w=>w.k!==q.k&&!bloons.some(b=>b.k===w.k));
        if(wrongN<R2_WRONG&&absent.length)it={t:"pic",w:pick(absent)};
        else it={t:"item",item:rollItems(1)[0]};
      }
      spawnOne(it,Math.floor(rnd(0,R2_BLOONS)),rnd(0,40));
    },delay||1200);
  }
  /* ① 비행 — 수평 풍선은 반대편으로 나가면 다시 그쪽 사이드에서 진입(계속 왔다갔다).
     ①-c 대각선 풍선은 위·옆으로 완전히 벗어나면 소멸 → 무작위 새 풍선 보충. */
  function moveBloons(dt){
    for(const b of bloons.slice()){ if(b.dead)continue;
      b.x+=b.vx*dt*b.dir;
      if(b.mode==="diag"){
        b.y-=b.vy*dt;
        if(b.y<-b.h*.6||b.x<-b.w*.8||b.x>FW+b.w*.8){
          removeBloon(b,false);
          replaceBloon(rnd(250,900));               /* ①-c 소멸 자리 무작위 보충 */
          continue;
        }
        b.el.style.top=(b.y-b.h/2)+"px";
      }else{
        if(b.dir>0&&b.x>FW+b.w*.7)b.x=-b.w*.7;
        else if(b.dir<0&&b.x<-b.w*.7)b.x=FW+b.w*.7;
      }
      b.el.style.left=(b.x-b.size/2)+"px";
    }
  }
  function removeBloon(b,anim){
    b.dead=true;
    const el=b.el;
    if(anim){el.classList.add("gone"); later(()=>el.remove(),340);}
    else el.remove();
    const i=bloons.indexOf(b); if(i>=0)bloons.splice(i,1);
  }
  /* ①-a 히트존 분리: 풍선 몸통(위쪽) / 그림카드(아래쪽) — 줄 부분은 빈 공간.
     겹친 순간엔 맨 위(z 높은) 풍선이 맞는다. 반환 {b, part:"body"|"card"} */
  function bloonAt(x,y){
    let best=null, part=null;
    for(const b of bloons){ if(b.dead)continue;
      const localY=y-(b.y-b.h/2);
      let p=null;
      if(Math.abs(x-b.x)<=b.size*.55&&localY>=-8&&localY<=b.size*.98)p="body";
      else if(b.k!=="bomb"&&Math.abs(x-b.x)<=b.size*.46&&localY>=b.h-b.size*.7&&localY<=b.h+6)p="card";
      else if(b.k==="bomb"&&Math.abs(x-b.x)<=b.size*.4&&localY>=b.h-b.size*.7&&localY<=b.h+6)p="body"; /* 매달린 폭탄도 폭탄 */
      if(p&&(!best||b.z>best.z)){best=b; part=p;} }
    return best?{b:best,part}:null;
  }

  /* ③ 폭탄 풍선을 잘못 터뜨렸다 — 하트 -1(남은 시간 무관, 사용자 지정 예외) + 시간 -1.5초.
     게·거북·갈매기는 화면 밖으로 날아가고(잠시 후 복귀) 남은 풍선은 전부 산산조각.
     그 뒤 양쪽 사이드에서 새 풍선들이 진입(단어·진행 유지). */
  function bombBlast(bb,x,y){
    if(over)return;
    lockFire=true; streak=0;
    removeBloon(bb,false);
    bombFX(bb.x,bb.y);
    Cue2.smashBig(); Snd.t(90,.5,"sawtooth",.2); Snd.t(60,.7,"triangle",.16);

    if(roundLeft<=0){ later(()=>stageFail(true),1100); return; }  /* 하트는 이미 차감 — 중복 금지 */
    later(()=>{ if(over)return; spawnWave(); lockFire=false; },1600);
  }

  /* ---------- 판정 ---------- */
  function updHUD(){

  function paintClock(){

  function onTap(x,y){
    if(over||lockFire||!running||PAUSED)return;
    if(!GUN.tryFire(x,y))return;                   /* 총알 소모 — 없으면 장전부터 */
    Cue2.shot();
    reticleFX(fxSVG,x,y);
    const got=bloonAt(x,y);
    if(!got){                                      /* 빈 곳 — 벌 없음. 게·거북을 치면 기절+원망 */
      const who=BG.hit(x,y);
      if(who){ const pt=BG.stun(who);
        if(pt){ const line=pick(OUCH);
          const d=H("div",{class:"ouchline"}); d.appendChild(shoutNode(line,"#FF9A8A"));
          d.style.left=pt.x+"px"; d.style.top=pt.y+"px"; sky.appendChild(d);
          say(line); Snd.t(300,.16,"square",.09);
          later(()=>d.remove(),1500); } }
      else Snd.tap();
      return; }
    const b=got.b;
    if(b.k==="bomb"){ bombBlast(b,x,y); return; }  /* ③ 폭탄 — 대참사 */
    if(got.part==="card"){
      /* ①-b 그림카드 명중 = 오발 — 카드가 뒤집혀 그림이 가려진다(다시 맞히면 복귀). 벌 없음(3-A) */
      const pic2=b.el.querySelector(".bpic");
      if(pic2){ pic2.classList.toggle("flipped");
        Snd.t(pic2.classList.contains("flipped")?300:430,.07,"triangle",.1); }
      mark(x,y,false);
      return; }
    /* v0.4 ⑦ 아이템 풍선(5-A) — 겹을 다 벗기면 보상. 벌은 없다(빈 자리 채우기용 선물) */
    if(b.t==="item"){
      if(b.l>1){
        b.l--; b.el.dataset.l=String(b.l);
        const g=b.glayers&&b.glayers.length>1?b.glayers.pop():null;
        if(g)g.remove();
        popFX(b.x,b.y-b.size*.2,b.size*.7);
        Snd.t(520+b.l*45,.06,"square",.11); Cue2.impact();
        mark(x,y,true);
        return;
      }
      const gain=grantItem(b.item);
      score+=gain.score; inkRun+=gain.ink;
      popFX(b.x,b.y,b.size);
      itemPop(sky,b.x,b.y,b.item);
      mark(x,y,true);
      removeBloon(b,true);
      replaceBloon(1400);
      updHUD(); updAmmoHUD();
      return;
    }
    const q=curWord(); if(!q)return;
    if(b.k===q.k){
      if(b.l>1){                                   /* ② 겹 풍선 — 한 꺼풀씩 */
        b.l--; b.el.dataset.l=String(b.l);
        const g=b.glayers&&b.glayers.length>1?b.glayers.pop():null;
        if(g)g.remove();
        popFX(b.x,b.y-b.size*.2,b.size*.7);
        Snd.t(500+b.l*45,.06,"square",.11); Cue2.impact();
        score+=6; updHUD(); mark(x,y,true);
        return;
      }
      /* 마지막 겹 — 픽 성공 */
      picks++; streak++; matched[q.k]++; SAVE.stat.read+=1; persist();
      Cue2.impact();
      const bonus=30+Math.min(streak,8)*5;
      score+=bonus; inkRun+=4;
      if(matched[q.k]>=R2_NEED){                   /* 이 단어 학습 성공 */
        learned++; SAVE.seen[q.w]=(SAVE.seen[q.w]||0)+1;
        score+=60; inkRun+=8;
      }
      if(Math.random()<.10){seedRun++; Cue2.gold();
        const p=H("div",{class:"goldpop"}); p.appendChild(mgSVG("seed"));
        sky.appendChild(p); later(()=>p.remove(),1400);}
      popFX(b.x,b.y,b.size);
      Snd.t(560,.07,"square",.13); Snd.t(180,.12,"triangle",.10);   /* 뻥! 팝 블립 */
      mark(x,y,true);
      toast(pick(PRAISE),true); Cue2.clap();
      if(matched[q.k]>=R2_NEED){ Cue2.fanfare(); winFX(sky,b.x,b.y,true); gainMag(); }
      removeBloon(b,true);
      replaceBloon(1400);                          /* ②③ 터진 자리는 새 풍선이 보충 */
      paintGoal();
      updHUD();
      const nx=pickNext();
      if(!nx){stageClear();}
      else{
        /* ③ 연속 진행 — 풍선은 리셋하지 않는다. 짧은 환호 뒤 새 단어 표시 + 발음(④) */
        lockFire=true;
        BG.cheer(900);
        cur=nx;
        later(()=>{ if(over)return;
          paintGoal(); say(cur.w);                 /* ④ 새 단어는 반드시 읽어준다 */
          lockFire=false;
        },SAVE.set.motion?900:120);
      }
    }else{
      /* ②(v0.3) 오답 풍선도 겹수만큼 — 겹이 남았으면 한 꺼풀만 벗겨진다(점수·벌 없음).
         시간 -1.5초는 마지막 겹이 터져 그림이 떨어질 때 1회만(2-A 승인 — 겹 오답은
         탄약·시간 낭비가 이미 벌이라 겹마다 깎으면 이중 벌). */
      streak=0;

        b.l--; b.el.dataset.l=String(b.l);

        if(g)g.remove();
        popFX(b.x,b.y-b.size*.2,b.size*.7);

        mark(x,y,false);
        return;

      roundLeft=Math.max(0,roundLeft-1500);
      Cue2.wrong(); mark(x,y,false);
      popFX(b.x,b.y,b.size);
      Snd.t(480,.07,"square",.12);
      dropCardToSea(b);
      removeBloon(b,true);
      replaceBloon(1400);                          /* 터진 자리 보충(2-A) */
      toast(pick(SCOLD),false);
      clockBox.classList.remove("shake"); void clockBox.offsetWidth; clockBox.classList.add("shake");
      sky.classList.remove("hurt"); void sky.offsetWidth; sky.classList.add("hurt");
      updHUD();
      if(roundLeft<=0)stageFail();
    }
  }
  /* ②③-A(v0.3) 매칭되지 않은 그림이 바다에 떨어진다 —

  function dropCardToSea(b){
    const cs=b.size*.74;
    const x0=b.x, y0=b.y+b.h*.14;
    const seaY=BG.seaPy();
    if(!SAVE.set.motion){                            /* 저모션 — 즉시 물튀김만 */
      BG.splashAt(x0); Snd.t(210,.14,"triangle",.1); return; }
    const d=H("div",{class:"cardfall"});
    const pc=H("div",{class:"bpic",style:`position:static;width:${cs}px;height:${cs*.62}px`});
    pc.appendChild(partIcon(b.k)); d.appendChild(pc);
    d.style.left=(x0-cs/2)+"px"; d.style.top=y0+"px";
    sky.appendChild(d);
    const fallH=Math.max(60,seaY-y0-6);
    const fallMs=Math.max(600,Math.min(1250,Math.sqrt(fallH)*47));  /* 낙하 높이 비례 */
    const drift=rnd(-42,42), spin=rnd(170,330)*(Math.random()<.5?-1:1);
    const FLOAT_MS=980, SINK_MS=640, bob=3.6;
    let phase="fall", el2=0, lastN=performance.now(), endRot=0, endX=0;
    function put(dx,dy,rot,sc,op){
      d.style.transform=`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)})`;

     누르는 동안 좌표를 계속 갱신하므로 손가락을 끌면 그쪽으로 쏜다. */

  function __autoStart(){ __autoStop();

  sky.addEventListener("pointerdown",e=>{const q=pos(e);__hx=q.x;__hy=q.y; if(SAVE.mgAmmo>0)__autoStart();});

     MG2는 스테이지 시작 전에 단어 3개를 하나씩 보여주므로 카드가 세 장 이어진다. */
  const PRESTUDY_MS=3000;

      const go=mgBtn("play",done,"big"); go.id="preGoBtn"; go.classList.add("goBtn");

  async function stageIntro(retry){
