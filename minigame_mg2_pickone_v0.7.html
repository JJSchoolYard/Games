    inner.appendChild(E("path",{class:"gwing",d:"M4 -2Q18 -22 34 -18",fill:"none",
      stroke:INK,"stroke-width":5,"stroke-linecap":"round"}));
    inner.appendChild(E("path",{d:"M16 0l8 2l-8 3Z",fill:"#FFC46B",stroke:INK,"stroke-width":3}));
    inner.appendChild(E("circle",{cx:9,cy:-2,r:1.8,fill:INK}));
    hold.appendChild(inner); play.appendChild(hold);
    gullHolds.push({hold,gd});});
  /* ---- 물고기 2마리 — 결정적 점프 사이클 ---- */
  const FISH=[{sx:470,peak:120,off:0,dir:1},{sx:872,peak:130,off:2100,dir:-1}];
  const fishHolds=[], fishSplashes=[];
  FISH.forEach(fd=>{
    const hold=E("g",{opacity:0});
    const inner=E("g");
    inner.appendChild(E("path",{d:"M-20 0Q-2 -14 14 0Q-2 14 -20 0Z",
      fill:"#FFB27E",stroke:INK,"stroke-width":5,"stroke-linejoin":"round"}));
    inner.appendChild(E("path",{d:"M-20 0L-30 -9L-27 0L-30 9Z",fill:"#FFC9A0",stroke:INK,"stroke-width":4,"stroke-linejoin":"round"}));
    inner.appendChild(E("circle",{cx:6,cy:-3,r:2,fill:INK}));
    hold.appendChild(inner); play.appendChild(hold);
    const sp=E("g",{opacity:0,transform:`translate(${fd.sx},432)`});
    sp.appendChild(E("path",{d:"M-14 0Q-8 -12 -2 0M2 0Q8 -14 14 0",fill:"none",
      stroke:"#EAF9FD","stroke-width":5,"stroke-linecap":"round"}));
    play.appendChild(sp);
    fishHolds.push({hold,fd}); fishSplashes.push(sp);});
  /* ⑤ 돌고래 — 가끔 한 번씩 크게 뛰어오른다(긴 사이클, 큰 포물선+큰 물튀김) */
  const dolHold=E("g",{opacity:0});
  const dol=E("g");
  dol.appendChild(E("path",{d:"M-44 2Q-20 -26 14 -18Q40 -12 46 4Q28 16 -2 14Q-30 12 -44 2Z",
    fill:"#8FB8CF",stroke:INK,"stroke-width":6,"stroke-linejoin":"round"}));
  dol.appendChild(E("path",{d:"M-2 -18Q0 -34 14 -34Q10 -22 8 -17Z",
    fill:"#8FB8CF",stroke:INK,"stroke-width":5,"stroke-linejoin":"round"}));
  dol.appendChild(E("path",{d:"M-44 2L-58 -8L-52 4L-58 14Z",
    fill:"#A9CBDD",stroke:INK,"stroke-width":5,"stroke-linejoin":"round"}));
  dol.appendChild(E("path",{d:"M30 -6Q40 -2 44 4",fill:"none",stroke:"#EAF7FD","stroke-width":4,"stroke-linecap":"round",opacity:.8}));
  dol.appendChild(E("circle",{cx:30,cy:-6,r:2.6,fill:INK}));
  dol.appendChild(E("path",{d:"M40 2q5 2 8 0",fill:"none",stroke:INK,"stroke-width":3,"stroke-linecap":"round"}));
  dolHold.appendChild(dol); play.appendChild(dolHold);
  const dolSplash=E("g",{opacity:0,transform:"translate(640,432)"});
  dolSplash.appendChild(E("path",{d:"M-24 0Q-14 -20 -4 0M4 0Q14 -24 24 0M-30 2Q-32 -8 -36 -2M30 2Q32 -10 36 -2",
    fill:"none",stroke:"#EAF7FD","stroke-width":6,"stroke-linecap":"round"}));
  play.appendChild(dolSplash);
  const DCYC=10500, D_WAIT=8000, D_JUMP=1500;
  v.appendChild(play);
  w.appendChild(v);

  /* ---- 상태기계 — 카운트다운형 시계. 일시정지 완전 정지(공용 규칙) ----
     gT = 갈매기·물고기(공중 정지가 부자연이라 환호 중에도 흐른다)
     bgT = 게·거북(환호 동안 정지하고 정면 환호) */
  let gT=0, bgT=0, lastT=performance.now();
  let cheerLeft=0, blastLeft=0; const stunLeft={crab:0,turtle:0};
  const off={crab:0,turtle:0};
  const FCYC=3400, F_WAIT=1600, F_JUMP=1050;
  function setCrab(){crabHold.setAttribute("transform",
    `translate(${(HOME.crab.x+off.crab).toFixed(1)},${HOME.crab.y})`);}
  function setTurt(dir){turtHold.setAttribute("transform",
    `translate(${(HOME.turtle.x+off.turtle).toFixed(1)},${HOME.turtle.y}) scale(${dir},1)`);}
  function tick(now){
    if(!w.isConnected)return;
    requestAnimationFrame(tick);
    const dt=Math.min(48,now-lastT); lastT=now;
    if(typeof PAUSED!=="undefined"&&PAUSED)return;
    if(!SAVE.set.motion)return;
    cheerLeft=Math.max(0,cheerLeft-dt); blastLeft=Math.max(0,blastLeft-dt);
    stunLeft.crab=Math.max(0,stunLeft.crab-dt); stunLeft.turtle=Math.max(0,stunLeft.turtle-dt);
    gT+=dt;
    /* ③ 폭발 직후 — 전부 날아가 있다: 물고기는 숨고 갈매기·게·거북 갱신은 멈춘다(CSS가 날린다) */
    if(blastLeft>0){
      fishHolds.forEach(({hold},i)=>{hold.setAttribute("opacity",0);
        fishSplashes[i].setAttribute("opacity",0);});
      return;
    }
    /* 갈매기 — 진행 방향을 본다 */
    gullHolds.forEach(({hold,gd})=>{
      const x=gd.cx+Math.sin(gT/gd.spd+gd.ph)*gd.amp;
      const y=gd.cy+Math.sin(gT/740+gd.ph)*9;
      const dir=Math.cos(gT/gd.spd+gd.ph)>=0?1:-1;
      hold.setAttribute("transform",`translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${dir},1)`);});
    /* 물고기 — 점프 사이클(솟았다가 뒤집혀 떨어진다) */
    fishHolds.forEach(({hold,fd},i)=>{
      const t=(gT+fd.off)%FCYC;
      if(t<F_WAIT){hold.setAttribute("opacity",0);}
      else if(t<F_WAIT+F_JUMP){
        const k=(t-F_WAIT)/F_JUMP;
        const x=fd.sx+fd.dir*k*66;
        const y=432-Math.sin(Math.PI*k)*fd.peak;
        const rot=fd.dir*(k*180-90);
        hold.setAttribute("opacity",1);
        hold.setAttribute("transform",`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${fd.dir},1)`);
      }else hold.setAttribute("opacity",0);
      const st2=t-(F_WAIT+F_JUMP);
      fishSplashes[i].setAttribute("opacity",(st2>=0&&st2<300)?(1-st2/300).toFixed(2):0);});
    /* ⑤ 돌고래 — 왼쪽 바다에서 크게 솟아 오른쪽으로 아치를 그리며 입수 */
    { const t=gT%DCYC;
      if(t<D_WAIT){dolHold.setAttribute("opacity",0);}
      else if(t<D_WAIT+D_JUMP){
        const k=(t-D_WAIT)/D_JUMP;
        const x=470+k*230, y=436-Math.sin(Math.PI*k)*185;
        const rot=k*150-75;
        dolHold.setAttribute("opacity",1);
        dolHold.setAttribute("transform",`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)})`);
      }else dolHold.setAttribute("opacity",0);
      const sd=t-(D_WAIT+D_JUMP);
      dolSplash.setAttribute("transform","translate(700,436)");
      dolSplash.setAttribute("opacity",(sd>=0&&sd<420)?(1-sd/420).toFixed(2):0); }
    if(cheerLeft>0)return;
    bgT+=dt;
    /* 게 — 옆걸음 왕복(원화가 정면이라 반전 불필요 — 게는 원래 옆으로 걷는다) */
    if(stunLeft.crab<=0){ off.crab=Math.sin(bgT/1900)*64; setCrab(); }
    /* 거북 — 아주 느린 산책, 진행 방향을 본다 */
    if(stunLeft.turtle<=0){
      off.turtle=Math.sin(bgT/4300)*40;
      setTurt(Math.cos(bgT/4300)>=0?1:-1); }
  }
  requestAnimationFrame(tick);

  /* ---- 게임 계층 API ---- */
  function mapPx(){ const r=w.getBoundingClientRect();
    const s2=Math.max(r.width/1000,r.height/700);
    return {s:s2, ox:(r.width-1000*s2)/2, oy:r.height-700*s2}; }
  function hit(px,py){ if(blastLeft>0)return null;   /* 날아간 동안은 맞을 몸이 없다 */
    const m=mapPx();
    const vx=(px-m.ox)/m.s, vy=(py-m.oy)/m.s;
    if(Math.hypot(vx-(HOME.crab.x+off.crab),vy-568)<74)return "crab";
    if(Math.hypot(vx-(HOME.turtle.x+off.turtle),vy-576)<84)return "turtle";
    return null; }
  function stun(who){
    if(stunLeft[who]>0)return null;
    stunLeft[who]=1300;
    const inner=who==="crab"?crab:turt;
    inner.classList.remove("stunned"); inner.classList.add("stunned");
    setTimeout(()=>inner.classList.remove("stunned"),1300);
    const m=mapPx();
    return {x:(HOME[who].x+off[who])*m.s+m.ox, y:(HOME[who].y-92)*m.s+m.oy};
  }
  /* 환호 — 게는 집게 만세+점프, 거북은 정면 얼굴로 전환+점프 */
  function cheer(ms){
    cheerLeft=ms;
    if(blastLeft>0)return;                       /* 날아가 있는 동안은 환호할 몸이 없다 */
    [crab,turt].forEach(n=>{n.classList.remove("cheer"); n.classList.add("cheer");});
    crab.classList.add("clawup");
    turtSide.setAttribute("opacity",0); turtFront.setAttribute("opacity",1);
    setTurt(1);
    setTimeout(()=>{ [crab,turt].forEach(n=>n.classList.remove("cheer"));
      crab.classList.remove("clawup");
      turtSide.setAttribute("opacity",1); turtFront.setAttribute("opacity",0); },ms);
  }
  /* ③ 대폭발 — 게·거북·갈매기가 화면 밖으로 날아갔다가 ms 뒤 뿅 하고 복귀 */
  function blast(ms){
    blastLeft=ms;
    crab.style.setProperty("--bx","-760px"); crab.style.setProperty("--by","-460px");
    turt.style.setProperty("--bx","780px");  turt.style.setProperty("--by","-420px");
    [crab,turt].forEach(n=>{n.classList.remove("cheer","clawup","stunned","backin");
      n.classList.add("blast");});
    gullHolds.forEach(({hold},i)=>{const inner=hold.querySelector(".gull2");
      if(!inner)return;
      inner.style.setProperty("--bx",(i%2?860:-860)+"px");
      inner.style.setProperty("--by","-340px");
      inner.classList.remove("backin"); inner.classList.add("blast");});
    setTimeout(()=>{
      [crab,turt].forEach(n=>{n.classList.remove("blast"); n.classList.add("backin");
        setTimeout(()=>n.classList.remove("backin"),520);});
      gullHolds.forEach(({hold})=>{const inner=hold.querySelector(".gull2");
        if(inner){inner.classList.remove("blast"); inner.classList.add("backin");
          setTimeout(()=>inner.classList.remove("backin"),520);}});
    },ms);
  }
  /* ② 오답 그림 낙하용 — 바다 수면의 화면 y / 낙하 지점 물튀김 */
  function seaPy(){ const m=mapPx(); return 434*m.s+m.oy; }
  function splashAt(px){
    const m=mapPx();
    const vx=Math.max(30,Math.min(970,(px-m.ox)/m.s));
    const g=E("g",{class:"seasplash",transform:`translate(${vx.toFixed(1)},436)`});
    g.appendChild(E("path",{d:"M-18 0Q-10 -18 -2 0M4 0Q12 -20 20 0M-24 2Q-27 -7 -30 -1M24 2Q27 -8 30 -1",
      fill:"none",stroke:"#EAF7FD","stroke-width":6,"stroke-linecap":"round"}));
    g.appendChild(E("circle",{cx:-6,cy:-16,r:3.4,fill:"#EAF7FD"}));
    g.appendChild(E("circle",{cx:10,cy:-20,r:2.8,fill:"#EAF7FD"}));
    play.appendChild(g);
    setTimeout(()=>g.remove(),600);
  }
  return {node:w, hit, stun, cheer, blast, seaPy, splashAt};
}


/* ======================================================================
   결과 — 언어 0. 별자리가 자란 만큼 보여준다
   ====================================================================== */
function scrResult(r){
  clearAll(); SCREEN="result";
  const c=H("div",{class:"pageC result"});
  /* 랭크 별 */
  const st=H("div",{class:"stars"});
  const rank=r.score>=520?3:r.score>=280?2:1;
  for(let i=0;i<3;i++){const s=E("svg",{viewBox:"-34 -34 68 68",xmlns:NS,class:"rk"+(i<rank?" on":"")});
    let d="";for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,rr=j%2?11:27;
      d+=(j?"L":"M")+(Math.cos(a)*rr).toFixed(1)+" "+(Math.sin(a)*rr).toFixed(1);}
    s.appendChild(E("path",{d:d+"Z",fill:i<rank?CSSV("--butter"):CSSV("--paper-2"),
      stroke:INK,"stroke-width":6,"stroke-linejoin":"round"}));
    st.appendChild(s);}
  c.appendChild(st);
  c.appendChild(H("div",{class:"bigscore",id:"bigscore",text:String(r.score)}));
  const purse=H("div",{class:"purse"});
  const inkC=counter("ink",r.inkRun); inkC.classList.add("gain"); purse.appendChild(inkC);
  if(r.seedRun>0){const sd=counter("seed",r.seedRun); sd.classList.add("gain","seedgain"); purse.appendChild(sd);}
  purse.appendChild(heartsRow());
  c.appendChild(purse);
  /* 별자리 — 이번 판에 자란 축에 +N */
  const rw=H("div",{class:"radarBig",id:"radarBig"});
  rw.appendChild(radarSVG(SAVE.stat,{read:r.lettersHit}));
  c.appendChild(rw);
  const row=H("div",{class:"btnrow"});
  row.appendChild(mgBtn("replay",()=>{ if(SAVE.hearts<=0){Snd.no();return;} scrPlay(); },"big"));
  row.appendChild(mgBtn("play",()=>scrTitle(),"big"));
  c.appendChild(row);
  const gear=mgBtn("gear",parentPanel); gear.className="ib corner"; c.appendChild(gear);
  app.appendChild(c);
  Snd.win();
  later(()=>{const rb=document.getElementById("radarBig"); if(rb)rb.classList.add("in");},260);
}

/* ④ 개발용 — 아케이드 허브(index.html) 복귀 버튼(사용자 지시 v0.1).
   테스트 전용. 출시 빌드에서는 이 블록을 통째로 뺀다. */
/* ② 버그 수정: 오디오·음성은 사용자 제스처가 있어야 풀린다 — 첫 포인터에서 예열.
   (시작 버튼 클릭이 곧 제스처라 이후 인트로 발음·카운트다운 비프가 안정적으로 난다) */
document.addEventListener("pointerdown",function warmup(){
  Snd.init(); try{if(Snd.ctx&&Snd.ctx.state==="suspended")Snd.ctx.resume();}catch(e){}
  try{ if(window.speechSynthesis){ speechSynthesis.getVoices();
    const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
  document.removeEventListener("pointerdown",warmup);
},{capture:true});
/* 개발용 홈버튼(사용자 지시 2026-08-03 ⑦): 누르면 하트 5·탄창 10개(25발 장전+예비 9) 리필 후 허브로.
   테스트 반복을 위한 개발 환경 전용 편의 — 본편 이식 시 제거 대상 */
/* ② 필드의 홈 버튼 폐기 — 제어판(⚙) 안 "게임 목록으로"가 유일한 출구다 */
document.addEventListener("touchstart",function once(){Snd.init();
  document.removeEventListener("touchstart",once);},{passive:true});
