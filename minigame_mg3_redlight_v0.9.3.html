<!-- ======================================================================
  minigame_mg3_redlight_v0.4.html · 2026-08-14 · 상태: 검토중
  MG3 Red Light — 철자 SPELLING + 순발력 REFLEX (다축)
  "무궁화 꽃이 피었습니다" 계보 · 무너진 도시 내리막길 · 사용자가 술래다.

  v0.4 변경
   ★ **버그 수정(치명)** — v0.3에서 배경 개체가 허수아비→생존자로 바뀌며 함수명이
     `cheerBg`→`cheerSurvs`로 변했는데 `wordClear()`가 옛 이름을 계속 불렀다.
     동기 호출이라 여기서 ReferenceError가 나면서 **점수·별·persist·다음 단계 예약이
     통째로 날아가 한 판을 깨면 게임이 멈췄다.** 회귀 검사 신설(버그 사본으로 재현 확인).
   ① 총을 **Spellshot과 동일**하게 — 각도 전이 `.09s`(스냅하지 않고 스르륵 따라온다),
      하드 오프셋 그림자, 강한 반동/코르크 회전/장전 딥, 조준경형 타겟마크
   ② 좀비가 **배경 맨 끝(지평선)에서 출발**해 다가올수록 커진다 — 스폰 깊이 0.80→**0.97**,
      크기식 (0.46+1.00p) → **(0.30+1.24p)**로 약 4배 성장. 처음엔 작아서 읽기 어렵다
   ③ 사람 크기를 **좀비의 60%**로(118 → 71 기준폭)

  유지: 위험선(넘으면 즉시 하트 -1) · 고정 사격 창 · 오답=넉백 방어 · 정답 서지 ·
  심장박동/붉은 화면/램프 크레센도 · 나는 좀비 · 사방 등장 · 생존자와 물림 연출 ·
  던져주는 아이템과 **이로운 폭탄**(사용자 지정 예외) · 예습 3초 자동 · 스와이프 장전 ·
  Spellshot 동일 SHOUT 서체 · 실루엣이 글자 모양을 흘림 · i/l 구분 글리프 · z 우선 판정.
====================================================================== -->
<style>
:root{
  --ink:#3B2B3A; --ink-soft:#6B5560;
  --paper-0:#FBF3E4; --paper-1:#F2E4CC; --paper-2:#E4D0AE; --paper-3:#CDB489; --paper-4:#A9906A;
  --coral:#FF7A6B; --butter:#FFCE5C; --mint:#6FD9C0; --sky:#6FB8E8; --grape:#B49AE0; --rose:#F79FC4;
  --drop:#8FD8F0; --drop-deep:#5AAECF; --blush:#FF8E86;
  --ui:1; --dur:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper-0);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:calc(16px * var(--ui));user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
/* ⑧ SHOUT 서체 — Spellshot과 동일(둥근 볼드 대문자 + 두꺼운 잉크 외곽, paint-order로 획이 뒤로) */
.shout{font-family:"Arial Rounded MT Bold","Baloo 2","Pretendard",system-ui,sans-serif;
  font-weight:900;letter-spacing:1px;color:var(--sc,#FFD45C);
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
  font-size:clamp(30px,8vw,58px);line-height:1.05;text-align:center;white-space:nowrap;
  filter:drop-shadow(0 4px 0 rgba(59,43,58,.22))}
.callout .shout{font-size:clamp(30px,7.4vw,56px)}   /* v0.9.1 ③ — 가리는 면적을 줄인다 */
.readyov .shout{font-size:clamp(52px,14vw,104px)}
.toast .shout{font-size:clamp(20px,5.4vw,38px)}     /* v0.9.1 ③ */
.reloadhint .shout{font-size:clamp(15px,3.6vw,22px);-webkit-text-stroke:4px var(--ink)}
.pauseov .shout{font-size:clamp(44px,12vw,88px)}
.ib{flex:0 0 auto;width:46px;height:46px;border-radius:14px;border:2.5px solid var(--ink);
  background:var(--paper-1);box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:7px;display:grid;place-items:center}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib svg{width:100%;height:100%;display:block}

/* ---------- 상단 HUD ---------- */
/* ★ 대시보드 = 상단 두 줄. **철자판까지가 대시보드다.**
   철자판을 필드 위에 띄우면 배경·연출·표적과 영원히 싸운다 — 겹침을 하나씩 피해 다니는 것보다
   처음부터 안 겹치는 자리에 두는 것이 옳다(사용자 판단, MG1·MG2·MG4와 동일 표준).
   1행: ♥×N · 점수 · 먹물 · [여백] · ⚙
   2행: 시계+타이머(고정폭) · 여백 · 철자판(왼쪽 정렬, 오른쪽은 비워 둔다) */
.bar{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;z-index:40;
  padding:calc(6px + env(safe-area-inset-top)) 10px 6px;
  background:linear-gradient(var(--paper-0) 88%,transparent)}
.dashrow{display:flex;align-items:center;gap:8px;min-width:0}
/* v0.9 ②(사용자 지시) — 하트를 개수만큼 그리지 않고 **(♥ × 숫자)** 한 덩어리로.
   상한이 올라가도 1행 폭이 흔들리지 않는다(MG1 공용 표준과 동일 표기). */
.hearts{display:flex;gap:4px;align-items:center;flex:0 0 auto;background:var(--paper-1);
  border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:3px 9px}
.hearts svg{width:22px;height:22px;display:block}
.hearts .hx{font-weight:900;font-size:calc(1.02rem);letter-spacing:-.5px;min-width:22px;text-align:left}
.hearts.zero .hx{color:#E4374B}
.cnt{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--paper-1);
  border:2.5px solid var(--ink);border-radius:99px;padding:3px 10px 3px 6px;font-weight:900}
.cnt svg{width:20px;height:20px}
.cnt .num{font-size:calc(.92rem)}
/* ④ 고정폭 — 6자 공간. 점수가 올라가도 폭이 변하지 않아 레이아웃이 흔들리지 않는다 */
/* v0.9 ③(사용자 지시) — 점수·먹물 창을 **같은 폭으로 늘려 1행을 꽉 채운다**(여백 spacer 폐지).
   flex:1 1 0 이면 둘이 남는 폭을 정확히 반씩 나눠 가지므로 화면 폭이 달라도 두 창은 항상 같다. */
.cnt.fixed{flex:1 1 0;min-width:0;width:auto;justify-content:flex-start}
.cnt.fixed .num{flex:1 1 auto;text-align:right;font-variant-numeric:tabular-nums}
.spacer{flex:1 1 auto;min-width:0}
.bar .ib{width:40px;height:40px;border-radius:12px}
/* 라운드 별 — 철자판 안 왼쪽으로 옮겼다(1행 폭을 비워 준다. MG1의 단어 별과 같은 자리) */
.stars{display:flex;gap:3px;flex:0 0 auto}
.stars svg{width:22px;height:22px}
/* ③ 시계 + 타이머 — 하트 바로 아랫줄. 이 칸의 폭이 곧 철자판의 들여쓰기 기준이다 */
.timecell{flex:0 0 auto;width:min(22vw,86px);display:flex;align-items:center}   /* v0.9 ④ — 한 칸 축소 */
.clockwrap{display:flex;align-items:center;gap:5px;background:var(--paper-0);border:3px solid var(--ink);
  border-radius:999px;padding:3px 10px 3px 5px;box-shadow:0 3px 0 var(--ink);flex:1 1 auto;min-width:0}
.clock{width:27px;height:27px;flex:0 0 auto}
.clkface{width:100%;height:100%;display:block}
.clock svg.clkburst{animation:cshake .5s}
@keyframes cshake{25%{transform:translateX(-3px) rotate(-6deg)}75%{transform:translateX(3px) rotate(6deg)}}
.cnum{font-weight:900;font-size:calc(1.02rem);flex:1 1 auto;text-align:right;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}
/* 실패 경고등 3칸 — 언어 0 */
.warns{display:flex;gap:4px;align-items:center}
.warns i{width:17px;height:17px;border-radius:50%;border:2.5px solid var(--ink);
  background:#3A2E3A;box-shadow:inset 0 2px 3px rgba(0,0,0,.45);display:block}
.warns i.on{background:radial-gradient(circle at 35% 32%,#FFE0A0,#FF5A4A 62%);
  box-shadow:0 0 9px #FF5A4A;animation:warnpop .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes warnpop{45%{transform:scale(1.45)}}

/* ---------- 목표 단어 슬롯 ---------- */
/* ★ 철자판 — 대시보드 2행. **왼쪽 정렬 + 오른쪽 개방**(긴 단어가 오른쪽으로 자란다).
   시계 영역만큼 들여쓴 자리에서 시작한다. 필드 위에 띄우지 않으므로
   배경·연출·표적을 가리는 문제 자체가 생기지 않는다. */
.goal{flex:1 1 auto;min-width:0;margin-left:4px;   /* v0.9 ④ — 철자판을 왼쪽으로 더 당긴다 */
  display:flex;align-items:center;justify-content:flex-start;gap:8px;
  background:var(--paper-1);border:3px solid var(--ink);border-radius:16px;
  padding:4px 12px 4px 8px;box-shadow:0 3px 0 rgba(59,43,58,.28);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.goal::-webkit-scrollbar{display:none}
.goal .pic{width:34px;height:34px;flex:0 0 auto}
.goal .pic svg{width:100%;height:100%;display:block}
.slotrow{display:flex;gap:4px;align-items:flex-end;flex:0 0 auto}
.slot{width:26px;height:36px;position:relative;border-bottom:4px solid var(--ink);border-radius:3px}
.slot svg{position:absolute;inset:2px 1px 3px;width:auto;height:auto;max-width:100%;max-height:100%;margin:auto}
.slot.ghost svg{opacity:.20;filter:grayscale(.45)}
.slot.need{background:#FFF3CE}
.slot.need svg{animation:slotpulse 1s ease-in-out infinite}
@keyframes slotpulse{50%{opacity:.55;transform:scale(1.08)}}
.slot.fill svg{opacity:1;animation:slotin .4s cubic-bezier(.2,1.7,.4,1)}
@keyframes slotin{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1)}}

/* ---------- 필드(황혼의 들판) ---------- */
.sky{position:relative;flex:1;overflow:hidden;
  background:linear-gradient(#2A2038 0%,#46283E 4%,#75384A 8%,#B0504A 12%,#D97148 15%,#F0A257 17%,#6A5C66 19%,#5A4E5C 100%)}
.fx{position:absolute;inset:0;z-index:60;pointer-events:none}
.bgsvg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
.worldg{position:absolute;inset:0;z-index:2}
.ent{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.ent svg{display:block;overflow:visible}

/* ---------- 좀비 (v0.1 — 절뚝이는 흐느적) ---------- */
.zombie .bodyg{transform-box:fill-box;transform-origin:50% 94%}
.zombie .legL,.zombie .legR{transform-box:fill-box;transform-origin:50% 4%}
.zombie .armF,.zombie .armB{transform-box:fill-box;transform-origin:14% 12%}
.zombie .armB{transform-origin:86% 12%}
.zombie .limbs{transition:opacity .3s}
.zombie.walk .bodyg{animation:shamble var(--sd,1.15s) ease-in-out infinite var(--ad,0s)}
/* 좌우 기울기와 상하 흔들림의 주기를 어긋나게 해 '절뚝'이 만들어진다 */
@keyframes shamble{
  0%{transform:rotate(-7deg) translateY(0)}
  18%{transform:rotate(-4deg) translateY(-8px)}
  40%{transform:rotate(3deg) translateY(-1px)}
  58%{transform:rotate(7deg) translateY(-6px)}
  78%{transform:rotate(2deg) translateY(0)}
  100%{transform:rotate(-7deg) translateY(0)}}
.zombie.walk .legL{animation:legswing var(--sd,1.15s) ease-in-out infinite var(--ad,0s)}
.zombie.walk .legR{animation:legdrag var(--sd,1.15s) ease-in-out infinite var(--ad,0s)}
@keyframes legswing{0%,100%{transform:rotate(21deg)}50%{transform:rotate(-17deg)}}
@keyframes legdrag{0%,100%{transform:rotate(-8deg)}62%{transform:rotate(7deg)}}
.zombie.walk .armF{animation:armlimp var(--sd,1.15s) ease-in-out infinite var(--ad,0s)}
.zombie.walk .armB{animation:armdangle calc(var(--sd,1.15s) * 1.6) ease-in-out infinite var(--ad,0s)}
@keyframes armlimp{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}}
@keyframes armdangle{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-9deg)}}
.zombie .drool{transform-box:fill-box;transform-origin:50% 0%}
.zombie.walk .drool{animation:drooldrip 3.4s ease-in infinite var(--ad,0s)}
@keyframes drooldrip{0%,55%{transform:scaleY(.25);opacity:.65}
  78%{transform:scaleY(1.7);opacity:.9}
  88%{transform:translateY(26px) scaleY(1.1);opacity:0}100%{opacity:0}}
.zombie.frozen .bodyg,.zombie.frozen .legL,.zombie.frozen .legR,
.zombie.frozen .armF,.zombie.frozen .armB,.zombie.frozen .drool{animation-play-state:paused}
/* 실루엣 — 젖빛 유리 뒤. 몸통(글자)만 새까맣게 남고 얼굴은 숨어 글자꼴이 읽힌다 */
.zombie.sil{filter:brightness(0) blur(.9px) drop-shadow(0 0 4px rgba(255,255,255,.85))
  drop-shadow(0 0 9px rgba(255,255,255,.5));opacity:.93}
.zombie.sil .limbs{opacity:.26}
.zombie.sil .face{opacity:0}
/* 코믹 회피 5종 */
.zombie.dg1 .bodyg{animation:dgMatrix .62s cubic-bezier(.3,1.5,.4,1)}
@keyframes dgMatrix{35%{transform:rotate(-58deg) translateY(16px)}70%{transform:rotate(-58deg) translateY(16px)}}
.zombie.dg2 .bodyg{animation:dgJump .62s cubic-bezier(.3,1.4,.4,1)}
@keyframes dgJump{40%{transform:translateY(-64px) rotate(-8deg)}70%{transform:translateY(-14px)}}
.zombie.dg3 .bodyg{animation:dgSpin .62s ease-in-out}
@keyframes dgSpin{100%{transform:rotate(360deg)}}
.zombie.dg4 .bodyg{animation:dgDuck .62s ease-out}
@keyframes dgDuck{35%,65%{transform:translateY(30px) scaleY(.52) scaleX(1.2)}}
.zombie.dg5 .bodyg{animation:dgBite .62s ease-out}
@keyframes dgBite{25%{transform:translateX(-11px) rotate(-9deg)}55%{transform:translateX(9px) rotate(11deg)}}
.zombie.dg5 .chomp{opacity:1;animation:chompin .5s ease-out}
.zombie .chomp{opacity:0}
@keyframes chompin{0%{transform:translateX(40px) scale(.4)}60%{transform:none}100%{opacity:0}}
/* 쓰러짐 — 위치는 .ent가 쥐고 있으니 안쪽 svg만 넘어뜨린다 */
.zombie.down svg{animation:zdown .6s ease-in forwards;transform-origin:50% 94%}
@keyframes zdown{55%{transform:rotate(48deg) translateY(6px)}100%{transform:rotate(84deg) translateY(16px);opacity:0}}
/* 습격 1단계 — 그 자리에서 확 달려든다 */
.zombie.lunge{z-index:900!important}
.zombie.lunge svg{animation:zlunge .46s cubic-bezier(.4,0,.9,.6) forwards;transform-origin:50% 92%}
@keyframes zlunge{100%{transform:scale(3.6) rotate(6deg)}}
/* 습격 2단계 — 화면 한가운데를 얼굴이 꽉 채운다 */
.lungeov{position:absolute;inset:0;z-index:940;pointer-events:none;display:grid;place-items:center}
.lungeov svg{width:min(96vw,96vh);height:auto;
  animation:lungein 1.05s cubic-bezier(.3,0,.7,.6) forwards;transform-origin:50% 46%;
  filter:drop-shadow(0 12px 26px rgba(20,10,20,.55))}
@keyframes lungein{0%{transform:scale(.30);opacity:0}
  14%{opacity:1}
  62%{transform:scale(1.35)}
  100%{transform:scale(2.6);opacity:1}}

/* ① 나는 좀비 — 지면 평면에서 해방돼 위쪽 공간을 쓴다 */
/* ② 나는 좀비 — 다리를 **뒤로 쭉 뻗은** 자세. 정면 원근에서 뒤로 뻗은 다리는
   짧게 눌려 보이는 게 맞다(foreshortening). 그래서 세로로 납작하게 눌러 위로 붙이고
   투명도를 낮춰 거의 안 보이게 한다. 걷기 애니메이션도 끈다 — 나는데 걸으면 안 된다.
   ★ 그림만 바뀐다. 판정 상자(viewBox 150×240, 발끝 y=222)는 그대로라 조준은 불변. */
.zombie.fly .legL,.zombie.fly .legR{opacity:.26;
  transform:translateY(-9%) scaleY(.20) rotate(3deg) !important;animation:none!important}
.zombie.fly .legR{transform:translateY(-9%) scaleY(.20) rotate(-3deg) !important}
.zombie.fly .foot{opacity:0}
.zombie .wing{transform-box:fill-box;transform-origin:92% 40%;display:none}
.zombie .wingR{transform-origin:8% 40%}
.zombie.fly .wing{display:block}
.zombie.fly.walk .wingL{animation:flapL .34s ease-in-out infinite}
.zombie.fly.walk .wingR{animation:flapR .34s ease-in-out infinite}
@keyframes flapL{50%{transform:rotate(-34deg) scaleY(.72)}}
@keyframes flapR{50%{transform:rotate(34deg) scaleY(.72)}}
.zombie.fly.walk .bodyg{animation:hover 1.6s ease-in-out infinite var(--ad,0s)!important}
@keyframes hover{50%{transform:translateY(-12px) rotate(3deg)}}
body.nomotion .zombie.fly .wing{animation:none}

/* ⑦ 오답 = 아파하며 뒤로 물러남(방어 수단). 반응은 5종이지만 결과는 항상 넉백이라
   유형별로 난이도 신호가 새지 않는다 */
.zombie.hb1 .bodyg{animation:hbStagger .6s ease-out}
@keyframes hbStagger{20%{transform:translateY(-9px) rotate(-18deg) scale(.94)}
  55%{transform:rotate(13deg)}100%{transform:none}}
.zombie.hb2 .bodyg{animation:hbSpin .6s ease-out}
@keyframes hbSpin{100%{transform:rotate(-360deg)}}
.zombie.hb3 .bodyg{animation:hbFlip .6s cubic-bezier(.3,1.3,.4,1)}
@keyframes hbFlip{45%{transform:translateY(-52px) rotate(-160deg)}100%{transform:none}}
.zombie.hb4 .bodyg{animation:hbHop .6s ease-out}
@keyframes hbHop{30%{transform:translateY(-34px) scaleY(1.12)}
  60%{transform:translateY(0) scaleY(.82) scaleX(1.14)}100%{transform:none}}
.zombie.hb5 .bodyg{animation:hbTumble .6s ease-in-out}
@keyframes hbTumble{35%{transform:translateY(14px) rotate(-72deg) scaleY(.8)}
  70%{transform:rotate(-14deg)}100%{transform:none}}
.zombie .ouch{opacity:0}
.zombie.hb1 .ouch,.zombie.hb2 .ouch,.zombie.hb3 .ouch,.zombie.hb4 .ouch,.zombie.hb5 .ouch{
  opacity:1;animation:ouchpop .6s ease-out}
@keyframes ouchpop{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.15);opacity:1}100%{opacity:0}}

/* 격노한 좀비 — 붉은 아지랑이를 두르고 두 배 속도로 달려온다 */
.zombie.rage{filter:drop-shadow(0 0 10px #FF3A2A) drop-shadow(0 0 20px rgba(255,58,42,.6))}
.zombie.rage.sil{filter:brightness(0) blur(.9px) drop-shadow(0 0 6px #FF6A50)
  drop-shadow(0 0 14px rgba(255,90,74,.75));opacity:.95}
.zombie.rage .bodyg{animation-duration:calc(var(--sd,1.15s) * .45)!important}
.zombie.rage .legL,.zombie.rage .legR{animation-duration:calc(var(--sd,1.15s) * .45)!important}

/* 위험 화면 — 가까울수록 가장자리가 붉게 번진다 */
.dangerov{position:absolute;inset:0;z-index:44;pointer-events:none;opacity:0;
  transition:opacity .18s linear;
  background:radial-gradient(ellipse at 50% 60%,rgba(255,60,40,0) 46%,rgba(255,38,24,.55) 82%,rgba(140,8,8,.90) 100%)}
/* 위험선 — 넘으면 물린다 */
.dline{animation:dlinepulse 1.25s ease-in-out infinite}
@keyframes dlinepulse{50%{opacity:.55}}
body.nomotion .dline{animation:none}

/* ③⑨ 도망다니는 생존자 */
.surv .sv{transform-box:fill-box;transform-origin:50% 96%}
.surv.run .sv{animation:svrun .38s ease-in-out infinite}
@keyframes svrun{50%{transform:translateY(-7px) rotate(-4deg)}}
.surv.caught .sv{animation:svshake .12s linear infinite}
@keyframes svshake{25%{transform:translate(-4px,-2px) rotate(-7deg)}75%{transform:translate(4px,2px) rotate(7deg)}}
.surv.cheer .sv{animation:svcheer .4s ease-in-out infinite}
@keyframes svcheer{50%{transform:translateY(-18px) scale(1.06)}}
.surv .svfront{display:none}
.surv.cheer .svfront{display:block}
.surv.cheer .svside{display:none}
body.nomotion .surv .sv{animation:none}
/* 물어뜯기는 순간 — 만화식 먼지구름(5세 기준: 유혈 표현 없음) */
.scuffle{position:absolute;z-index:600;pointer-events:none;margin:-40px 0 0 -40px;width:80px;height:80px}
.scuffle svg{width:100%;height:100%;display:block;animation:scuf .12s linear infinite}
@keyframes scuf{50%{transform:rotate(18deg) scale(1.1)}}

/* ⑨ 생존자가 던져주는 아이템 — 공중에서 쏴 맞히면 내 것.
   ★ z를 유리문(50) **아래**로 내렸다. 그래야 문이 닫혀 있을 때 물건이 문에 부딪혀 깨지는 것이
   그림으로도 맞는다(물건이 유리 앞을 지나가면 문이 없는 것처럼 보인다).
   좀비·생존자는 .worldg(z:2) 안에서 자기들끼리 쌓이므로 물건은 여전히 그들보다 앞이다. */
.thrown{position:absolute;z-index:46;pointer-events:none;will-change:transform}
.thrown .tin{width:100%;height:100%;border-radius:16px;border:4px solid var(--ink);
  background:linear-gradient(#F2E4CC,#D8BE93);box-shadow:0 4px 0 rgba(59,43,58,.35);
  display:grid;place-items:center;animation:tspin 1.1s linear infinite}
.thrown.bomb .tin{background:radial-gradient(circle at 34% 30%,#6B5F72,#2E2733);border-color:#1E1822}
@keyframes tspin{100%{transform:rotate(360deg)}}
.thrown .tin svg{width:66%;height:66%}
.thrown.bomb .tin svg{width:78%;height:78%}
body.nomotion .thrown .tin{animation:none}
/* 폭탄 폭발 = 이 게임에선 이롭다(사용자 지정 예외) */
.blastring{position:absolute;z-index:560;pointer-events:none;border-radius:50%;
  border:10px solid #FFE0A0;margin:-30px 0 0 -30px;width:60px;height:60px;
  animation:blastr .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes blastr{100%{width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;
  border-width:3px;opacity:0}}
.blastflash{position:absolute;inset:0;z-index:555;pointer-events:none;background:#FFF3D0;
  animation:cflash .5s ease-out forwards}

/* ---------- 젖빛 유리 자동문 ---------- */
.glass{position:absolute;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.gpane{position:absolute;top:0;bottom:0;width:50.6%;
  background:linear-gradient(105deg,rgba(214,234,246,.52),rgba(178,208,230,.44) 40%,rgba(220,238,248,.56));
  border-top:0;transition:transform .42s cubic-bezier(.5,0,.2,1)}
.gpane.l{left:0;border-right:5px solid rgba(120,150,170,.75);
  box-shadow:inset -14px 0 22px rgba(120,155,178,.40)}
.gpane.r{right:0;border-left:5px solid rgba(120,150,170,.75);
  box-shadow:inset 14px 0 22px rgba(120,155,178,.40)}
.glass.open .gpane.l{transform:translateX(-101%)}
.glass.open .gpane.r{transform:translateX(101%)}
.gpane::after{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,.5) 0 3px,rgba(255,255,255,0) 3px 9px)}
.gpane b{position:absolute;top:0;bottom:0;width:13px;background:rgba(255,255,255,.55);
  box-shadow:0 0 14px rgba(255,255,255,.7)}
/* ① 닫힌 문에 물건이 부딪힌 순간 — 유리 위(문 앞)에 튐 자국과 파편이 뜬다.
   유리는 안 깨진다(문이 뚫리면 게임 규칙이 무너진다). 깨지는 건 던진 물건 쪽이다. */
.gsplat{position:absolute;z-index:53;pointer-events:none;width:96px;height:96px;
  margin:-48px 0 0 -48px;animation:gsplat .52s ease-out forwards}
.gsplat svg{width:100%;height:100%;display:block}
@keyframes gsplat{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.25);opacity:0}}
.gshard{position:absolute;z-index:54;pointer-events:none;width:14px;height:14px;margin:-7px 0 0 -7px}
.gshard svg{width:100%;height:100%;display:block}
body.nomotion .gsplat{animation-duration:.001s}
.gpane.l b{right:16px} .gpane.r b{left:16px}

/* ---------- 신호등(언어 0 타이머) ---------- */
.tl{position:absolute;z-index:52;pointer-events:none;width:64px}
.tl svg{width:100%;height:auto;display:block}
.tl .bulbR{transition:fill .16s,filter .16s}
.tl .bulbG{transition:fill .16s,filter .16s}
.tl.red .bulbR{fill:#FF4A3D;filter:drop-shadow(0 0 12px #FF5A4A)}
.tl.red .bulbG{fill:#2E4030}
.tl.green .bulbG{fill:#59E07A;filter:drop-shadow(0 0 12px #59E07A)}
.tl.green .bulbR{fill:#472826}
.tlring{transition:none}

/* ---------- 총·탄창(공용 승계) ---------- */
.gun{position:absolute;bottom:-6px;width:min(13vw,66px);z-index:70;pointer-events:none;
  filter:drop-shadow(0 6px 0 rgba(59,43,58,.2))}
/* v0.9 ⑤(사용자 지시) — 총을 **탄창 바로 옆**으로. 탄창은 right:6px·폭 64px이므로
   그 왼쪽에 붙는다(좁은 화면은 아래 미디어쿼리에서 함께 조정). */
.gun{width:min(17vw,86px)}
.gun.right{right:76px} .gun.left{left:76px}
/* 각도가 스냅하지 않고 스르륵 따라와야 총이 입체로 읽힌다(Spellshot 동일) */
.gunrot{transition:transform .09s ease;transform-origin:50% 92%}
.gun.fire .gunrot svg{animation:gunkick .16s ease-out}
@keyframes gunkick{30%{transform:translateY(13px) scale(.98)}}
.gun .cork{transform-box:fill-box;transform-origin:50% 100%}
.gun.fire .cork{animation:corkpop .18s ease-out}
@keyframes corkpop{40%{transform:translateY(-14px) rotate(-10deg)}}
.gun.reload svg{animation:gundip .34s ease}
@keyframes gundip{25%{transform:translateY(34px) rotate(9deg)}70%{transform:translateY(30px) rotate(7deg)}}
body.nomotion .gun.fire .gunrot svg,body.nomotion .gun.fire .cork{animation:none}
/* ⑤ 물총 — 화약 연기가 아니라 **물보라**다 */
.gunpuff{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  z-index:69;pointer-events:none;
  background:radial-gradient(circle,#EAF9FF 0%,rgba(140,215,240,.62) 52%,rgba(140,215,240,0) 76%);
  animation:puff .42s ease-out forwards}
@keyframes puff{from{transform:scale(.4);opacity:.95}to{transform:scale(1.9) translateY(-26px);opacity:0}}
@keyframes puffout{0%{opacity:.95;scale:.5}100%{opacity:0;scale:1.7}}
.bullet{position:absolute;width:18px;height:14px;z-index:71;pointer-events:none;margin:-7px 0 0 -9px;
  transition:transform .115s linear}
.bulhit{position:absolute;width:22px;height:22px;border-radius:50%;z-index:71;pointer-events:none;
  background:radial-gradient(circle,#EAF9FF,rgba(122,205,235,.55) 46%,rgba(122,205,235,0) 72%);
  transform:translate(-50%,-50%);animation:puffout .26s ease-out forwards}
.reticle{animation:retpop .38s cubic-bezier(.2,1.7,.4,1) forwards;transform-box:fill-box;transform-origin:center}
@keyframes retpop{0%{transform:scale(1.7);opacity:0}30%{transform:scale(1);opacity:1}
  75%{opacity:1}100%{transform:scale(.92);opacity:0}}
.magbtn{position:absolute;bottom:10px;width:64px;height:86px;z-index:71;border:none;background:none;
  cursor:pointer;padding:0;filter:drop-shadow(0 3px 2px rgba(59,43,58,.3))}
.magbtn.right{right:6px} .magbtn.left{left:6px}
.magbtn svg{width:100%;height:auto;display:block}
.magrow{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);display:flex;gap:2px;
  align-items:baseline;background:var(--paper-0);border:2px solid var(--ink);border-radius:9px;padding:1px 6px}
.magrow .num{font-size:.8rem;font-weight:900}
.magrow .magn{font-size:.62rem;font-weight:900;color:var(--ink-soft)}
.magbtn.pop{animation:ammopop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes ammopop{40%{transform:scale(1.16)}}
.magbtn.need .magarrow{opacity:1;animation:arrowbob .7s ease-in-out infinite}
.magarrow{position:absolute;left:50%;top:-104px;width:78px;height:96px;margin-left:-39px;opacity:0}
.magbtn.teach .magarrow{opacity:1;animation:arrowbob .7s ease-in-out 2}
/* v0.6 ④ — 스와이프 장전 연출 */
.swfx{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:120;pointer-events:none;
  width:min(36vw,175px);opacity:.95;filter:drop-shadow(0 6px 0 rgba(59,43,58,.25))}
.swfx svg{width:100%;height:auto;display:block}
.swfx.snap{animation:swsnap .26s ease-out}
@keyframes swsnap{0%{transform:translate(-50%,-50%) translateY(48px) scale(1.35)}
  55%{transform:translate(-50%,-50%) translateY(-16px) scale(1.12)}
  100%{transform:translate(-50%,-50%) scale(1)}}
body.nomotion .swfx.snap{animation:none}
.magarrow .fing{transform-box:fill-box;transform-origin:50% 20%;animation:swipehint 1.5s ease-in-out infinite}
@keyframes swipehint{0%,100%{transform:translateY(0)}30%{transform:translateY(26px)}
  60%{transform:translateY(-6px)}80%{transform:translateY(0)}}
body.nomotion .magarrow .fing{animation:none}
@keyframes arrowbob{50%{transform:translateY(5px)}}

/* ---------- 연출 ---------- */
.toast.top{z-index:960}
/* v0.9.1 ①② — top(높이)과 opacity는 JS가 좀비 배치를 보고 정한다. 고정 22%는 폐기 */
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:80;pointer-events:none;
  animation:toastup .82s ease-out forwards}
/* v0.9.2 §6.2 — 적응형 반투명이 무효였다: placeFX의 **인라인 opacity를 애니메이션이 덮어썼다**.
   최고 불투명도를 --fxop 변수로 뽑아 키프레임이 읽게 한다. */
@keyframes toastup{0%{transform:translate(-50%,14px) scale(.6);opacity:0}
  22%{transform:translate(-50%,0) scale(1.06);opacity:var(--fxop,1)}
  80%{opacity:var(--fxop,1)}100%{transform:translate(-50%,-26px);opacity:0}}
.reloadhint{position:absolute;transform:translate(-50%,-100%);z-index:80;pointer-events:none;
  animation:toastup .9s ease-out forwards}
.callout{position:absolute;left:50%;top:15%;transform:translate(-50%,-50%);z-index:82;pointer-events:none}

.callout.in{animation:callin .66s cubic-bezier(.2,1.6,.4,1) forwards}   /* v0.9.1 ③ — 가리는 시간 단축 */
@keyframes callin{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
  20%{transform:translate(-50%,-50%) scale(1.1);opacity:var(--fxop,1)}
  72%{transform:translate(-50%,-50%) scale(1);opacity:var(--fxop,1)}
  100%{transform:translate(-50%,-64%) scale(.94);opacity:0}}
.itempop{position:absolute;width:52px;height:52px;z-index:78;margin:-26px 0 0 -26px;pointer-events:none;
  animation:itempop 1.15s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes itempop{0%{transform:translateY(0) scale(.5);opacity:0}
  25%{transform:translateY(-22px) scale(1.25);opacity:1}
  75%{transform:translateY(-52px) scale(1);opacity:1}
  100%{transform:translateY(-74px) scale(.8);opacity:0}}
.winflash{position:absolute;inset:0;background:radial-gradient(circle,#FFF6D8 0%,rgba(255,246,216,0) 62%);
  z-index:76;pointer-events:none;animation:cflash .32s ease-out}
@keyframes cflash{0%{opacity:.85}100%{opacity:0}}
.confetti{position:absolute;width:12px;height:9px;z-index:77;pointer-events:none;
  animation:confall 1.45s ease-in forwards}
@keyframes confall{0%{transform:translate(0,0) rotate(0);opacity:1}
  100%{transform:translate(var(--cx),var(--cy)) rotate(var(--cr));opacity:0}}
.starburst{position:absolute;width:200px;height:200px;margin:-100px 0 0 -100px;z-index:77;pointer-events:none}
.sbfly{animation:sbfly .65s ease-out forwards;transform-box:fill-box}
@keyframes sbfly{0%{transform:translate(0,0) scale(.4);opacity:1}
  100%{transform:translate(var(--sx),var(--sy)) scale(1);opacity:0}}
/* 습격 — 화면 흔들림 + 초록 번쩍 + 큰 얼굴 */
.sky.hit .worldg,.sky.hit .bgsvg{animation:jolt .7s ease-out}
@keyframes jolt{0%{transform:none}12%{transform:translate(-26px,7px) rotate(-2.2deg)}
  32%{transform:translate(28px,-5px) rotate(2.4deg)}54%{transform:translate(-13px,4px)}
  76%{transform:translate(9px,-3px)}100%{transform:none}}
.gulp{position:absolute;inset:0;z-index:95;pointer-events:none;
  background:radial-gradient(circle at 50% 52%,rgba(120,220,140,.18),rgba(46,74,54,.72) 82%);
  animation:cflash .8s ease-out forwards}

/* ---------- 화면 공통 ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
.card{background:var(--paper-1);border:3.5px solid var(--ink);border-radius:26px;
  box-shadow:0 7px 0 rgba(59,43,58,.4);padding:22px 26px;display:flex;flex-direction:column;
  align-items:center;gap:12px;max-width:min(92vw,460px)}
.bigbtn{display:flex;align-items:center;gap:9px;font-weight:900;font-size:1.15rem;
  background:var(--butter);border:3.5px solid var(--ink);border-radius:20px;padding:13px 30px;
  box-shadow:0 6px 0 var(--ink);cursor:pointer}
.bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.bigbtn svg{width:30px;height:30px}
/* ④ 예습 3초 자동 진행 게이지 */
.autobar{width:min(60vw,240px);height:9px;border-radius:99px;background:var(--paper-2);
  border:2.5px solid var(--ink);overflow:hidden}
.autobar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--butter),var(--coral));
  transform-origin:left;animation:autoshrink 3s linear forwards}
@keyframes autoshrink{to{transform:scaleX(0)}}
.prept{width:min(52vw,220px)}
.prept svg{width:100%;height:auto;display:block}
.readyov{position:absolute;inset:0;display:grid;place-items:center;z-index:88;pointer-events:none}

.pauseov{position:fixed;inset:0;background:rgba(59,43,58,.55);z-index:200;display:grid;place-items:center}

.modal{position:fixed;inset:0;background:rgba(59,43,58,.45);z-index:150;display:grid;place-items:center}
.mbox{background:var(--paper-0);border:3.5px solid var(--ink);border-radius:22px;padding:20px 22px;
  width:min(88vw,420px);max-height:82vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:1.05rem}
.psub{font-weight:900;font-size:.8rem;color:var(--ink-soft);margin:10px 0 2px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:2px dashed var(--paper-3);font-size:calc(.84rem);font-weight:800}
.prow>span{flex:0 0 66px}
.pbar{flex:1;height:14px;border-radius:99px;background:var(--paper-2);border:2.5px solid var(--ink);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--butter),var(--coral))}
.pseg{display:flex;gap:5px}
.pseg button{font:inherit;font-size:calc(.74rem);font-weight:800;padding:7px 10px;border-radius:11px;
  border:2.5px solid var(--ink);background:var(--paper-1);cursor:pointer;min-height:38px}
.pseg button.on{background:var(--butter)}
.pnote{font-size:calc(.76rem);line-height:1.7;color:var(--ink-soft);margin:14px 0 12px;padding:12px;
  background:var(--paper-1);border-radius:14px}
.prow2{display:flex;gap:9px;justify-content:center}
.pbtn{font:inherit;font-weight:800;padding:10px 18px;border-radius:14px;border:2.5px solid var(--ink);
  background:var(--butter);box-shadow:0 4px 0 var(--ink);cursor:pointer}
/* 좁은 화면 HUD 압축 — 하트 5개 + 카운터가 밀려 잘리던 문제 */
@media (max-width:470px){
  .bar{gap:4px;padding:calc(5px + env(safe-area-inset-top)) 6px 5px}
  .dashrow{gap:5px}
  .ib{width:38px;height:38px;border-radius:11px;padding:5px}
  .bar .ib{width:34px;height:34px;border-radius:10px;padding:4px}
  .hearts{gap:1px} .hearts svg{width:18px;height:18px}
  .cnt{padding:2px 7px 2px 4px;gap:3px} .cnt svg{width:15px;height:15px}
  .cnt .num{font-size:calc(.76rem)}
  .cnt.fixed{width:min(27vw,98px)}
  .timecell{width:min(20vw,74px)}
  .clockwrap{padding:2px 7px 2px 3px;gap:3px} .clock{width:22px;height:22px}
  .cnum{font-size:calc(.84rem)}
  .stars svg{width:18px;height:18px}
  .goal{padding:3px 8px 3px 5px;gap:5px;margin-left:3px} .goal .pic{width:28px;height:28px}
  .slot{width:22px;height:30px}
  .magbtn{width:52px;height:70px}
  .gun.right{right:62px} .gun.left{left:62px}   /* v0.9 ⑤ — 좁은 화면에서도 탄창 옆 유지 */
}
@media (prefers-reduced-motion:reduce){:root{--dur:.001}}
body.nomotion .zombie.walk .bodyg,body.nomotion .zombie.walk .legL,body.nomotion .zombie.walk .legR,
body.nomotion .zombie.walk .armF,body.nomotion .zombie.walk .armB,body.nomotion .zombie.walk .drool{animation:none}

/* ---------- v0.18계 ⑥⑨⑩ — 단어 통계·캐스케이드·진행 점 ---------- */
.wstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:390px;width:94%}
.wcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;
  border:3px solid #3B2B3A;border-radius:14px;background:#FBF3E4;box-shadow:0 4px 0 #3B2B3A}
.wcard.no{opacity:.85;background:#F3E0DC}
.wcard .wic{width:62%}.wcard .wic svg{width:100%;height:auto;display:block}
.wcard .wname{font-weight:900;font-size:13px;color:#3B2B3A}
.wbadge{position:absolute;right:-8px;top:-10px;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;
  border:3px solid #3B2B3A;color:#FBF3E4}
.wbadge.ok{background:#57BE8B}.wbadge.no{background:#E4374B}
.wperf{font-size:9px;font-weight:900;letter-spacing:.4px;color:#7A5A00;background:#FFCE5C;
  border:2px solid #3B2B3A;border-radius:999px;padding:1px 6px;margin-top:1px}
.stPct{font-weight:900;font-size:20px;color:#3B2B3A}
.stBonus{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

<div id="app"></div>
<script>
"use strict";
/* ====================== 저장(전 게임 공유 키) ====================== */
const KEY="wordborn_mg_r1_v0";
const HEART_MAX_BASE=5, HEART_CAP=8, REGEN_MS=20*60*1000;
const MAG_SIZE=25;
const blankSave=()=>({v:1,
  hearts:HEART_MAX_BASE, bonusHearts:0, lastRegen:0,
  ink:0, seeds:0, seen:{},
  stat:{spell:0,read:0,mean:0,mem:0,ref:0,listen:0},
  best:0,

let storageOK=true;
function load(){let s=null;
  try{const r=localStorage.getItem(KEY); if(r)s=JSON.parse(r);}catch(e){storageOK=false;}
  if(!s||s.v!==1)s=blankSave();
  const b=blankSave(); for(const k in b) if(s[k]==null) s[k]=b[k];
  s.set=Object.assign(b.set,s.set||{}); s.stat=Object.assign(b.stat,s.stat||{});
  return s;}
/* v테스트 ①(사용자 지시, 8/18) — 테스트 버전: 새로 로드할 때마다 저장을 지우고 초기화한다 */
try{localStorage.removeItem(KEY);}catch(e){}
let SAVE=load();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){storageOK=false;}};
const heartCap=()=>Math.min(HEART_CAP,HEART_MAX_BASE+SAVE.bonusHearts);
function regen(now){
  const cap=heartCap();
  if(SAVE.hearts>=cap){SAVE.lastRegen=now;return;}
  if(!SAVE.lastRegen){SAVE.lastRegen=now;return;}
  const n=Math.floor((now-SAVE.lastRegen)/REGEN_MS);
  if(n>0){SAVE.hearts=Math.min(cap,SAVE.hearts+n); SAVE.lastRegen+=n*REGEN_MS; persist();}
}
function applySet(){
  document.documentElement.style.setProperty("--ui",[.92,1,1.14][SAVE.set.ui]||1);
  document.documentElement.style.setProperty("--dur",SAVE.set.motion?1:.001);
  document.body.classList.toggle("nomotion",!SAVE.set.motion);
}
const NS="http://www.w3.org/2000/svg";
const INK="#3B2B3A", PAPER="#FBF3E4";
const CSSV=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function E(t,a,k){const n=document.createElementNS(NS,t);
  if(a)for(const x in a){if(a[x]!=null)n.setAttribute(x,a[x]);}
  if(k)k.forEach(c=>c&&n.appendChild(c));return n;}
function H(t,a,k){const n=document.createElement(t);
  if(a)for(const x in a){ if(x==="html")n.innerHTML=a[x]; else if(x==="text")n.textContent=a[x];
    else if(x==="on")for(const e in a[x])n.addEventListener(e,a[x][e]); else if(a[x]!=null)n.setAttribute(x,a[x]); }
  if(k)k.forEach(c=>c&&n.appendChild(c));return n;}
const hx=c=>{c=c.replace("#","");return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];};
const rgbs=a=>"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const shade=(c,f)=>rgbs(hx(c).map(v=>v*(1-f)));
const tint =(c,f)=>rgbs(hx(c).map(v=>v+(255-v)*f));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];}return a;};

/* ====================== 소리(공용 승계) ====================== */
const Snd={ctx:null,
  init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C();}catch(e){}},
  t(f,d,ty,v){if(!SAVE.set.sfx)return;this.init();const c=this.ctx;if(!c)return;
    try{if(c.state==="suspended")c.resume();
      const o=c.createOscillator(),g=c.createGain();o.type=ty||"sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(v||.15,c.currentTime+.012);
      g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(d||.18));
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.18)+.02);}catch(e){}},
  tap(){this.t(660,.1,"triangle",.11)},
  no(){this.t(190,.2,"square",.1)},
  soft(){this.t(392,.16,"sine",.08)}};
const Cue2={
  wrong(){Snd.t(160,.26,"square",.10); setTimeout(()=>Snd.t(110,.3,"sawtooth",.08),110);},
  word(){[659,784,988,1319].forEach((f,i)=>setTimeout(()=>Snd.t(f,.28,"triangle",.13),i*90));},
  gold(){[784,1046,1319,1568,2093].forEach((f,i)=>setTimeout(()=>Snd.t(f,.34,"sine",.12),i*70));},
  combo(n){Snd.t(500+Math.min(n,10)*90,.12,"triangle",.10);},
  ready(){Snd.t(392,.3,"sine",.09); setTimeout(()=>Snd.t(523,.34,"sine",.09),260);},
  beat(){Snd.t(660,.09,"square",.09); setTimeout(()=>Snd.t(440,.12,"sine",.07),70);},

  snap(){Snd.t(1568,.06,"triangle",.11); setTimeout(()=>Snd.t(2093,.09,"sine",.08),50);},
  doorno(){Snd.t(233,.14,"square",.09); setTimeout(()=>Snd.t(175,.22,"square",.08),120);},
  boing(){Snd.t(180,.07,"sine",.13); setTimeout(()=>Snd.t(320,.16,"sine",.11),60);},
  shot(){ if(!SAVE.set.sfx)return; Snd.init(); const c=Snd.ctx; if(!c)return;
    try{ if(c.state==="suspended")c.resume();
      const t=c.currentTime;
      const dur=.12, buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);
      const d=buf.getChannelData(0);
      for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,1.6);
      const src=c.createBufferSource(); src.buffer=buf;
      const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600;
      const gn=c.createGain(); gn.gain.setValueAtTime(.55,t);
      gn.gain.exponentialRampToValueAtTime(.001,t+dur);
      src.connect(lp); lp.connect(gn); gn.connect(c.destination);
      src.start(t); src.stop(t+dur+.02); }catch(e){}
    /* ⑤ 물총 — 화약의 저역 쿵을 빼고 물이 뿜어지는 높은 소리로 바꾼다(로직 불변) */
    Snd.t(760,.07,"sine",.12); Snd.t(1240,.05,"sine",.07); },
  impact(){ if(!SAVE.set.sfx)return; Snd.init(); const c=Snd.ctx;
    if(c){try{ const t=c.currentTime;
      const dur=.06, buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);
      const d=buf.getChannelData(0);
      for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2.5);
      const src=c.createBufferSource(); src.buffer=buf;
      const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=3200; bp.Q.value=1;
      const gn=c.createGain(); gn.gain.setValueAtTime(.5,t);
      gn.gain.exponentialRampToValueAtTime(.001,t+dur);
      src.connect(bp); bp.connect(gn); gn.connect(c.destination);
      src.start(t); src.stop(t+dur+.02); }catch(e){}}
    Snd.t(120,.18,"sine",.22); setTimeout(()=>Snd.t(1500,.08,"triangle",.1),20); },
  fanfare(){[392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>Snd.t(f,.16,"triangle",.14),i*55));
    setTimeout(()=>{Snd.t(1046,.5,"sine",.12);Snd.t(1319,.5,"sine",.10);Snd.t(1568,.6,"sine",.09);},300);
    [2093,2637,3136].forEach((f,i)=>setTimeout(()=>Snd.t(f,.4,"sine",.06),430+i*70));},
  smash(){Snd.t(180,.5,"sawtooth",.16); setTimeout(()=>Snd.t(90,.7,"square",.12),60);
    [1400,1100,800].forEach((f,i)=>setTimeout(()=>Snd.t(f,.18,"triangle",.07),120+i*70));},
  clap(){ if(!SAVE.set.sfx)return; Snd.init(); const c=Snd.ctx; if(!c)return;
    try{ if(c.state==="suspended")c.resume();
      for(let i=0;i<4;i++){ const t=c.currentTime+.04+i*.12+Math.random()*.03;
        const dur=.085, buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);
        const d=buf.getChannelData(0);
        for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2.2);

        const gn=c.createGain(); gn.gain.setValueAtTime(.0001,t);
        gn.gain.linearRampToValueAtTime(.5,t+.006);
        gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
        src.connect(bp); bp.connect(gn); gn.connect(c.destination);
        src.start(t); src.stop(t+dur+.02); } }catch(e){} },
  pop(){Snd.t(1180,.05,"sine",.13); setTimeout(()=>Snd.t(1660,.09,"triangle",.09),40);},
  /* ===== Red Light 전용 큐 ===== */
  alarm(){Snd.t(880,.13,"square",.09); setTimeout(()=>Snd.t(1174,.18,"square",.08),140);},
  taunt(){[523,466,523,587].forEach((f,i)=>setTimeout(()=>Snd.t(f,.12,"square",.07),i*105));},
  /* 신호등 전환 — 기계식 딸깍 */
  gate(){Snd.t(300,.05,"square",.10); setTimeout(()=>Snd.t(210,.09,"square",.08),55);},
  /* 유리문 슬라이드 — 노이즈 스윕 */
  open(){ if(!SAVE.set.sfx)return; Snd.init(); const c=Snd.ctx; if(!c)return;
    try{ if(c.state==="suspended")c.resume();
      const t=c.currentTime, dur=.42;
      const bl=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,bl,c.sampleRate);

      const src=c.createBufferSource(); src.buffer=buf;
      const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.4;

      const gn=c.createGain(); gn.gain.setValueAtTime(.001,t);
      gn.gain.linearRampToValueAtTime(.22,t+.10); gn.gain.exponentialRampToValueAtTime(.001,t+dur);

  /* 회피 — 코믹 휙 */
  dodge(){Snd.t(420,.09,"sine",.10); setTimeout(()=>Snd.t(980,.13,"sine",.09),60);
    setTimeout(()=>Snd.t(1500,.10,"triangle",.07),140);},
  /* 유리에 총알이 튕김 */
  tink(){Snd.t(2100,.05,"triangle",.10); setTimeout(()=>Snd.t(2900,.08,"sine",.06),40);},
  /* 습격 직전 으르렁(코믹 — 저음 흔들림) */
  growl(){ if(!SAVE.set.sfx)return; Snd.init(); const c=Snd.ctx; if(!c)return;

      lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.20,t+.05);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); lfo.start(t); o.stop(t+dur+.02); lfo.stop(t+dur+.02); }catch(e){} },
  /* 덥석 — 코믹 마무리 */

/* ⑤ 천 단위 약자 — 1000부터 K, 100만부터 M, 10억부터 B.
   10 미만이면 소수 한 자리(3.6K), 그 이상이면 정수(36K)라 최대 5자다. */
function fmtNum(n){
  n=Math.max(0,Math.round(Number(n)||0));
  const U=[[1e9,"B"],[1e6,"M"],[1e3,"K"]];
  for(const u of U){
    if(n>=u[0]){ const x=n/u[0]; return (x<10?x.toFixed(1):String(Math.round(x)))+u[1]; }
  }
  return String(n);
}

  function reload(){
    if(reloading)return;
    if(SAVE.ammo>=MAG_SIZE){hint("FULL!","#7BE3B6");return;}
    if(SAVE.mags<=0&&SAVE.ammo<=0)SAVE.mags=1;            /* 완전 고갈 안전망 */

  function onMotion(e){
    const a=e.accelerationIncludingGravity; if(!a||a.x==null)return;
    if(lastAcc){ const d=Math.abs(a.x-lastAcc.x)+Math.abs(a.y-lastAcc.y)+Math.abs(a.z-lastAcc.z);

      if(d>24&&now-shakeT>1200){ shakeT=now; reload(); } }

  }
  try{ if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=="function")
    window.addEventListener("deviceorientation",onOrient); }catch(e){}
  try{
    if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==="function"){

      if(SAVE.ammo===0)hint("RELOAD!");

    }};

/* ======================================================================

   · 걸음: 절뚝이는 흐느적 — 몸통이 불규칙하게 기울고, 한 다리는 끌린다
   · 얼굴: 움푹 팬 눈두덩 + 짝짝이 눈(한쪽은 튀어나오고 한쪽은 처짐) + 벌린 입 + 침
   · 팔: 앞팔은 앞으로 쭉(발톱 손), 뒷팔은 부러져 덜렁 + 붕대
   · 톤은 Plants vs Zombies 계열(무섭지 않고 웃긴 쪽) — 5세 대상
   · 색은 랜덤(글자 고정색 금지 규칙). 좀비다움은 색이 아니라 형태·자세·움직임으로 낸다
   · 실루엣에서는 .face를 통째로 숨겨 글자꼴이 가려지지 않게 한다
   ====================================================================== */
function clawHand(x,y,col,dir,r){
  const g=E("g");
  g.appendChild(E("circle",{cx:x,cy:y,r,fill:tint(col,.34),stroke:INK,"stroke-width":5}));
  [-.62,0,.62].forEach(a=>{
    const ax=x+dir*Math.cos(a)*r*1.05, ay=y+Math.sin(a)*r*1.05;
    g.appendChild(E("path",{d:`M${ax} ${ay}l${dir*r*.72} ${Math.sin(a)*r*.5}`,
      stroke:INK,"stroke-width":4.5,"stroke-linecap":"round",fill:"none"}));
  });
  return g;
}

  g.appendChild(E("path",{d:`M${cx-6} ${cy+r*.72}v${r*.5}h12v${-r*.5}Z`,fill:shade(col,.12),stroke:INK,"stroke-width":5}));
  g.appendChild(E("circle",{cx,cy,r,fill:col,stroke:INK,"stroke-width":6}));
  /* 꿰맨 자국 */
  g.appendChild(E("path",{d:`M${cx-r*.75} ${cy-r*.30}h${r*.5}`,stroke:INK,"stroke-width":3,"stroke-linecap":"round",opacity:.55}));
  g.appendChild(E("path",{d:`M${cx-r*.62} ${cy-r*.42}v${r*.24}M${cx-r*.42} ${cy-r*.42}v${r*.24}M${cx-r*.22} ${cy-r*.42}v${r*.24}`,
    stroke:INK,"stroke-width":2.6,"stroke-linecap":"round",opacity:.5}));
  /* 움푹 팬 눈두덩 + 짝짝이 눈 */
  g.appendChild(E("ellipse",{cx:cx-r*.36,cy:cy-r*.10,rx:r*.40,ry:r*.36,fill:"#2A1F2C",opacity:.40}));
  g.appendChild(E("ellipse",{cx:cx+r*.40,cy:cy-r*.18,rx:r*.30,ry:r*.27,fill:"#2A1F2C",opacity:.40}));
  g.appendChild(E("circle",{cx:cx-r*.36,cy:cy-r*.10,r:r*.34,fill:"#F6F0DE",stroke:INK,"stroke-width":4}));
  g.appendChild(E("path",{d:`M${cx-r*.62} ${cy-r*.22}q${r*.16} ${r*.12} ${r*.10} ${r*.24}`,
    stroke:"#E06A6A","stroke-width":2,fill:"none","stroke-linecap":"round",opacity:.9}));
  g.appendChild(E("circle",{cx:cx-r*.46,cy:cy-r*.18,r:r*.15,fill:INK}));
  g.appendChild(E("circle",{cx:cx-r*.52,cy:cy-r*.25,r:r*.055,fill:"#FFF"}));
  g.appendChild(E("ellipse",{cx:cx+r*.40,cy:cy-r*.16,rx:r*.20,ry:r*.18,fill:"#F6F0DE",stroke:INK,"stroke-width":4}));
  g.appendChild(E("circle",{cx:cx+r*.45,cy:cy-r*.10,r:r*.085,fill:INK}));
  g.appendChild(E("path",{d:`M${cx+r*.14} ${cy-r*.36}q${r*.26} ${-r*.16} ${r*.52} ${r*.02}`,
    stroke:INK,"stroke-width":r*.15,fill:"none","stroke-linecap":"round"}));
  /* 벌린 입 + 삐뚤 이빨 */
  g.appendChild(E("path",{d:`M${cx-r*.52} ${cy+r*.30}Q${cx} ${cy+r*.14} ${cx+r*.52} ${cy+r*.30}Q${cx+r*.46} ${cy+r*.86} ${cx} ${cy+r*.94}Q${cx-r*.46} ${cy+r*.86} ${cx-r*.52} ${cy+r*.30}Z`,
    fill:"#3A1B28",stroke:INK,"stroke-width":4.5,"stroke-linejoin":"round"}));
  g.appendChild(E("path",{d:`M${cx-r*.38} ${cy+r*.32}l${r*.10} ${r*.26}l${r*.12} ${-r*.28}M${cx-r*.04} ${cy+r*.30}l${r*.08} ${r*.30}l${r*.12} ${-r*.30}M${cx+r*.28} ${cy+r*.34}l${r*.08} ${r*.22}l${r*.10} ${-r*.24}`,
    fill:"#F6F0DE",stroke:INK,"stroke-width":2.6,"stroke-linejoin":"round"}));
  g.appendChild(E("path",{d:`M${cx-r*.24} ${cy+r*.78}q${r*.24} ${-r*.16} ${r*.48} 0q${-r*.08} ${r*.16} ${-r*.24} ${r*.16}q${-r*.16} 0 ${-r*.24} ${-r*.16}Z`,
    fill:CSSV("--rose"),stroke:INK,"stroke-width":3,"stroke-linejoin":"round"}));
  const drool=E("g",{class:"drool"});
  drool.appendChild(E("ellipse",{cx:cx+r*.44,cy:cy+r*.86,rx:r*.13,ry:r*.24,fill:"#BFE8D6",stroke:INK,"stroke-width":2.6}));
  g.appendChild(drool);
}

/* v4차 ②③ — 진행 트랙 렌더러(4게임 동일). log=[{ok:…}] · total=스테이지 단어 수 */

/* v0.8 ① — 별자리 미리보기(MG1 이식). 탭 라벨·반짝임은 뺀 경량판 — 타이틀에서는 모양만 읽히면 된다 */
const AXES=[
 {k:"spell", ic:"s_spell"},{k:"read", ic:"s_read"},{k:"mean", ic:"s_mean"},
 {k:"mem", ic:"s_mem"},{k:"ref", ic:"s_ref"},{k:"listen", ic:"s_listen"}];
const RAD_FULL=70;
const radPct=v=>Math.min(1,Math.max(0,v/RAD_FULL));
function radarSVG(stat){
  const R=104, CX=150, CY=142;
  const svg=E("svg",{viewBox:"0 0 300 290",xmlns:NS,style:"width:100%;height:auto;display:block;overflow:visible"});
  const g=E("g");
  g.appendChild(E("circle",{cx:CX,cy:CY,r:R+34,fill:"#2E2846"}));
  for(let i=0;i<26;i++){const a=i*2.4, rr=30+((i*37)%(R+26));
    g.appendChild(E("circle",{cx:CX+Math.cos(a)*rr,cy:CY+Math.sin(a)*rr,r:1.2+((i*7)%3)*.6,
      fill:"#FBF3E4",opacity:.45}));}
  [.34,.67,1].forEach(f=>{
    let d="";
    AXES.forEach((_,i)=>{const a=-Math.PI/2+i*Math.PI/3;
      d+=(i?"L":"M")+(CX+Math.cos(a)*R*f).toFixed(1)+" "+(CY+Math.sin(a)*R*f).toFixed(1);});
    g.appendChild(E("path",{d:d+"Z",fill:"none",stroke:"#8E86B8","stroke-width":2,opacity:.5}));});
  AXES.forEach((_,i)=>{const a=-Math.PI/2+i*Math.PI/3;
    g.appendChild(E("path",{d:"M"+CX+" "+CY+"L"+(CX+Math.cos(a)*R)+" "+(CY+Math.sin(a)*R),
      stroke:"#8E86B8","stroke-width":2,opacity:.42}));});
  const pt=[];
  AXES.forEach((ax,i)=>{const a=-Math.PI/2+i*Math.PI/3;
    const f=Math.max(.13,radPct((stat&&stat[ax.k])||0));
    pt.push([CX+Math.cos(a)*R*f, CY+Math.sin(a)*R*f]);});
  let dd=""; pt.forEach((p,i)=>{dd+=(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);});
  /* 좀비 테마 — 별자리를 독초록으로 채운다(MG1은 버터색) */
  g.appendChild(E("path",{d:dd+"Z",fill:"#8BE36B","fill-opacity":.30,stroke:"#B6F29B",
    "stroke-width":4,"stroke-linejoin":"round"}));
  pt.forEach(p=>g.appendChild(E("circle",{cx:p[0].toFixed(1),cy:p[1].toFixed(1),r:5,
    fill:"#B6F29B",stroke:INK,"stroke-width":3})));
  AXES.forEach((ax,i)=>{const a=-Math.PI/2+i*Math.PI/3;
    const x=CX+Math.cos(a)*(R+30), y=CY+Math.sin(a)*(R+30);
    const box=E("g",{transform:"translate("+(x-17).toFixed(1)+","+(y-17).toFixed(1)+")"});
    box.appendChild(E("circle",{cx:17,cy:17,r:19,fill:"#FBF3E4",stroke:INK,"stroke-width":4}));
    const ic=E("svg",{viewBox:"0 0 64 64",x:4,y:4,width:26,height:26});
    ic.innerHTML=ICON[ax.ic]||""; box.appendChild(ic);
    g.appendChild(box);});
  svg.appendChild(g); return svg;
}

function zombieSVG(ch,col){
  const meta=G[ch]||G.o;
  const s=E("svg",{viewBox:"0 0 150 240",xmlns:NS,style:"width:100%;height:auto;display:block;overflow:visible"});
  s.appendChild(E("ellipse",{cx:75,cy:228,rx:36,ry:8,fill:"#241A24",opacity:.26}));
  const body=E("g",{class:"bodyg"});
  const limbs=E("g",{class:"limbs"});

  /* 글자는 베이스라인(y=100)을 172에 맞춰 세운다 — 다리와 항상 붙는다 */
  /* 글자가 주인공이라 크게, 머리는 작게 얹는다 — 판독 속도가 곧 게임성 */
  const sc=Math.min(1.28,116/meta.w);
  const ty=168-100*sc;
  const letterTop=ty+glyphTop(ch,meta)*sc;
  const HR=20;                                  /* 머리 반지름 */
  /* i·j는 위쪽 점이 글자의 일부라 머리로 덮으면 안 된다 — 점 바로 위에 얹는다(점이 목처럼 보인다) */
  const headCy=letterTop-HR+((ch==="i"||ch==="j")?-4:7);

  /* 뒷팔: 부러져 덜렁 + 붕대 */
  const armB=E("g",{class:"armB"});
  const bd="M48 132Q28 142 32 164";
  armB.appendChild(E("path",{d:bd,fill:"none",stroke:INK,"stroke-width":16,"stroke-linecap":"round"}));
  armB.appendChild(E("path",{d:bd,fill:"none",stroke:shade(col,.16),"stroke-width":8,"stroke-linecap":"round"}));
  armB.appendChild(E("path",{d:"M33 146l14 6M31 156l14 6",stroke:"#F0E6D2","stroke-width":5,"stroke-linecap":"round"}));
  armB.appendChild(clawHand(31,174,col,-1,9));
  limbs.appendChild(armB);
  /* 앞팔: 앞으로 쭉 */
  const armF=E("g",{class:"armF"});
  const fd="M104 128Q130 134 146 122";
  armF.appendChild(E("path",{d:fd,fill:"none",stroke:INK,"stroke-width":16,"stroke-linecap":"round"}));
  armF.appendChild(E("path",{d:fd,fill:"none",stroke:tint(col,.14),"stroke-width":8,"stroke-linecap":"round"}));
  armF.appendChild(clawHand(150,120,col,1,9.5));
  limbs.appendChild(armF);
  /* 다리: 한쪽은 성큼, 한쪽은 질질 끌린다 */
  const leg=(cls,x,drag)=>{
    const g=E("g",{class:cls});
    const d=drag?`M${x} 172Q${x+11} 196 ${x+5} 214`:`M${x} 172Q${x-7} 196 ${x-2} 214`;
    g.appendChild(E("path",{d,fill:"none",stroke:INK,"stroke-width":16,"stroke-linecap":"round"}));
    g.appendChild(E("path",{d,fill:"none",stroke:shade(col,.30),"stroke-width":8,"stroke-linecap":"round"}));
    g.appendChild(drag
      ? E("ellipse",{cx:x+12,cy:218,rx:17,ry:6,fill:shade(col,.24),stroke:INK,"stroke-width":5,transform:`rotate(9 ${x+12} 218)`})
      : E("ellipse",{cx:x-6,cy:219,rx:14,ry:7,fill:shade(col,.24),stroke:INK,"stroke-width":5}));
    return g;
  };
  limbs.appendChild(leg("legL",60,false));
  limbs.appendChild(leg("legR",92,true));
  body.appendChild(limbs);

  /* 몸통 = 글자. 얼굴이 덮지 않으므로 항상 읽힌다. 실루엣에 남는 것도 이것뿐 */
  const gw=E("g",{transform:`translate(${(150-meta.w*sc)/2},${ty.toFixed(1)}) scale(${sc})`});
  const gl=glyph(ch,col); if(gl)gw.appendChild(gl);
  body.appendChild(gw);

  /* 머리(실루엣에서 숨김) */
  const face=E("g",{class:"face"});
  zombieHead(face,75,headCy,HR,col);
  body.appendChild(face);

  /* 나는 놈만 보이는 넝마 박쥐 날개 — 지면 평면에서 해방된다 */
  const wing=(cls,x,dir)=>{
    const g=E("g",{class:"wing "+cls});
    const d=`M${x} ${headCy+34}q${dir*46} ${-30} ${dir*74} ${-6}q${dir*-16} ${16} ${dir*-6} ${30}`+
            `q${dir*-22} ${-8} ${dir*-30} ${10}q${dir*-8} ${-16} ${dir*-38} ${-34}Z`;
    g.appendChild(E("path",{d,fill:shade(col,.34),stroke:INK,"stroke-width":6,"stroke-linejoin":"round"}));
    g.appendChild(E("path",{d:`M${x+dir*10} ${headCy+30}l${dir*34} ${-2}M${x+dir*8} ${headCy+42}l${dir*28} ${8}`,
      stroke:INK,"stroke-width":3.5,fill:"none",opacity:.5}));
    return g;
  };
  body.insertBefore(wing("wingL",44,-1),body.firstChild);
  body.insertBefore(wing("wingR",106,1),body.firstChild);

  /* 아파할 때 뜨는 별 */
  const ouch=E("g",{class:"ouch"});
  [[46,headCy-6,10],[104,headCy-14,8],[75,headCy-30,11]].forEach(([x,y,r])=>
    ouch.appendChild(sparkle(x,y,r,"#FFE47A")));
  body.appendChild(ouch);

  const chomp=E("g",{class:"chomp"});
  chomp.appendChild(E("ellipse",{cx:112,cy:headCy+6,rx:11,ry:8,fill:"#E8B983",stroke:INK,"stroke-width":5}));
  body.appendChild(chomp);
  s.appendChild(body);
  return s;
}

  let W=0,Hp=0,hy=0,by=0,cx=0,fieldHalf=0,vf=1,spreadK=1,fieldRO=null;

    const r=sky.getBoundingClientRect();

    moon.setAttribute("r",Math.min(W,Hp)*.035);

    /* 지면 — 깊이별 띠. 먼 쪽은 연기에 묻히고 가까운 쪽은 아스팔트 */
    GROUND.forEach(([d,col])=>{
      let dd=`M0 ${ridgeY(d,0).toFixed(1)}`;
      for(let k=1;k<=44;k++){ const x=W*k/44; dd+=`L${x.toFixed(1)} ${ridgeY(d,x).toFixed(1)}`; }

    /* 내리막 도로 — 가운데를 따라 아래로 흘러내린다 */
    let rl="",rr="";

      const d=.98-(.98-.02)*k/26, pp=clamp(1-d,0,1);
      const hw=ROAD_W*fieldHalf*(.16+.84*pp);
      const xl=cx-hw, xr=cx+hw;
      rl+=(k?"L":"M")+xl.toFixed(1)+" "+ridgeY(d,xl).toFixed(1);
      rr=(k?"L":"M")+xr.toFixed(1)+" "+ridgeY(d,xr).toFixed(1)+rr;

    hillG.appendChild(E("path",{d:rl+rr.replace(/^M/,"L")+"Z",fill:"#A2939A"}));
    /* 중앙선 — 부서진 점선 */
    for(let k=0;k<14;k++){
      const d1=.92-k*.066, d2=d1-.030;
      if(d2<.03)break;
      const w1=Math.max(1.5,7*(1-d1)*vf), w2=Math.max(2,7*(1-d2)*vf);
      hillG.appendChild(E("path",{d:`M${cx-w1} ${ridgeY(d1,cx).toFixed(1)}L${cx+w1} ${ridgeY(d1,cx).toFixed(1)}`+
        `L${cx+w2} ${ridgeY(d2,cx).toFixed(1)}L${cx-w2} ${ridgeY(d2,cx).toFixed(1)}Z`,
        fill:"#F0DC9A",opacity:.75}));

    /* 갈라진 틈 */
    [[-.30,.62],[.24,.40],[-.16,.20]].forEach(([o,d])=>{
      const a=proj(d,o), b=proj(d-.10,o+.18);
      hillG.appendChild(E("path",{d:`M${a.x} ${a.y}Q${(a.x+b.x)/2+18} ${(a.y+b.y)/2} ${b.x} ${b.y}`,
        fill:"none",stroke:"#4A4048","stroke-width":Math.max(2,4*a.s),"stroke-linecap":"round",opacity:.55}));
    });
    /* 스카이라인 — 무너진 건물 실루엣 */
    let sk="",sx=0;
    while(sx<W){
      const bw=W*rnd2(sx,.04,.10), bh=Hp*rnd2(sx+7,.03,.115), br=rnd2(sx+3,0,1);
      const top=hy-bh;
      sk+=`M${sx.toFixed(1)} ${hy.toFixed(1)}V${top.toFixed(1)}`;
      if(br<.34)sk+=`l${(bw*.34).toFixed(1)} ${(bh*.22).toFixed(1)}l${(bw*.3).toFixed(1)} ${(-bh*.16).toFixed(1)}L${(sx+bw).toFixed(1)} ${(top+bh*.1).toFixed(1)}`;
      else sk+=`H${(sx+bw).toFixed(1)}`;

    }
    hillG.appendChild(E("path",{d:sk,fill:"#2A2333",opacity:.95}));
    /* 연기 기둥 */
    [[.22,.9],[.52,.6],[.86,.75]].forEach(([px,sc2])=>{
      const x=W*px;
      treeG.appendChild(E("path",{d:`M${x} ${hy}q${-18*sc2} ${-Hp*.05} ${4*sc2} ${-Hp*.09}q${22*sc2} ${-Hp*.04} ${2*sc2} ${-Hp*.08}`,
        fill:"none",stroke:"#5A5060","stroke-width":26*sc2,"stroke-linecap":"round",opacity:.34}));
    });
    /* 길 양옆 무너진 건물 — 원근에 맞춰 선다 */
    [[-1.55,.86],[1.62,.80],[-1.35,.60],[1.40,.52],[-1.30,.34],[1.34,.28],[-1.5,.14],[1.55,.10]]
    .forEach(([o,d],i2)=>{
      const q=proj(d,o), bw=170*q.s, bh=(230+((i2*57)%120))*q.s;
      const g2=E("g");
      g2.appendChild(E("path",{d:`M${q.x-bw/2} ${q.y}V${q.y-bh}l${bw*.30} ${bh*.10}l${bw*.24} ${-bh*.13}l${bw*.46} ${bh*.06}V${q.y}Z`,
        fill:i2%2?"#3E3648":"#372F40",stroke:"#241E2C","stroke-width":Math.max(2,4*q.s),"stroke-linejoin":"round"}));
      for(let r2=0;r2<4;r2++)for(let c2=0;c2<3;c2++){
        const wx=q.x-bw*.34+c2*bw*.30, wy=q.y-bh*.80+r2*bh*.19;
        if(wy>q.y-bh*.06)continue;
        const lit=((i2*13+r2*7+c2*5)%11)<2;
        g2.appendChild(E("rect",{x:wx,y:wy,width:bw*.17,height:bh*.11,
          fill:lit?"#E8A34C":"#221D28",opacity:lit?.95:.85}));
      }
      hillG.appendChild(g2);
    });
    /* 잔해 더미 */
    [[-.75,.70],[.62,.55],[-.55,.30],[.80,.22],[-.90,.12]].forEach(([o,d])=>{
      const q=proj(d,o), r3=34*q.s;
      hillG.appendChild(E("path",{d:`M${q.x-r3} ${q.y}l${r3*.5} ${-r3*.72}l${r3*.6} ${r3*.3}l${r3*.5} ${-r3*.5}l${r3*.4} ${r3*.92}Z`,
        fill:"#6A5D66",stroke:"#3A3240","stroke-width":Math.max(1.5,3*q.s),"stroke-linejoin":"round"}));
    });
    /* 꺾인 가로등 */
    [[-.86,.74],[.92,.44],[-.94,.18]].forEach(([o,d])=>{
      const q=proj(d,o), hh=150*q.s;
      hillG.appendChild(E("path",{d:`M${q.x} ${q.y}V${q.y-hh}q0 ${-hh*.2} ${28*q.s} ${-hh*.16}`,
        fill:"none",stroke:"#3A3340","stroke-width":Math.max(2.5,6*q.s),"stroke-linecap":"round"}));
      hillG.appendChild(E("ellipse",{cx:q.x+28*q.s,cy:q.y-hh*1.16,rx:11*q.s,ry:6*q.s,fill:"#6E6470"}));

  const onRz=()=>{if(SCREEN==="play")measure();};

  /* 원근 투영 + 언덕 지형. 능선과 좀비가 같은 함수를 써서 "언덕 위에 서 있다"가 성립한다 */
  const rnd2=(seed,a,b)=>{const t=Math.sin(seed*12.9898)*43758.5453; return a+(t-Math.floor(t))*(b-a);};
  /* 내리막길 — 지평선을 위로 올리고(하늘 축소) 원근 지수를 완만하게 해
     같은 깊이가 더 많은 세로 픽셀로 펼쳐지게 한다(공간 효율의 핵심) */
  const hillWave=u=>Math.sin(u*4.6+.7)*.42+Math.sin(u*11.8+2.3)*.20+Math.sin(u*22.5+4.1)*.10;
  const terrAmp=d=>Hp*(.008+.026*(1-d));

    const x=cx+off*fieldHalf*(.16+.84*p);
    let y=ridgeY(d,x);
    if(fly)y-=Hp*.30*(.35+.65*p);          /* 나는 놈은 지면에서 떠오른다 */
    /* ② 멀면 아주 작고 다가올수록 4배 가까이 커진다 — 처음이 어렵고 점점 커지는 압박 */
    return {x, y, s:(.30+1.24*p)*vf, z:100+Math.round(p*800)+(fly?40:0), p}; };

  /* ---------- 좀비 배치 ---------- */
  function slotSpread(n){
    if(n<=1)return [0];
    /* v0.6 ⑩(사용자 지시) — 뭉치지 말고 화면 전폭으로: ±0.80 → ±0.96 */
    return Array.from({length:n},(_,i)=>-0.96+1.92*i/(n-1));
  }
  function spawnZombies(){
    R.zombies.forEach(z=>z.el.remove());
    const letters=R.letters.slice();
    const pool=ALPHA.filter(c=>letters.indexOf(c)<0);
    const decoys=shuf(pool).slice(0,DECOYS[Math.min(R.round,DECOYS.length-1)]);   /* v0.7 — 7라운드 클램프 */
    const list=shuf(letters.map(ch=>({ch,decoy:false})).concat(decoys.map(ch=>({ch,decoy:true}))));
    const n=list.length;
    const sp=SPD[Math.min(R.round,SPD.length-1)];
    /* ⑥ 사방에서 나온다 — 길 끝(far) · 왼쪽 골목 · 오른쪽 골목 */
    const sides=shuf(Array.from({length:n},(_,i)=>i%5===1?"L":(i%5===3?"R":"F")));
    /* ① 나는 좀비 — 지면 평면에서 해방돼 위쪽 공간을 쓴다 */
    const flyIdx=shuf(Array.from({length:n},(_,i)=>i)).slice(0,FLY_N[Math.min(R.round,2)]);
    const slots=shuf(slotSpread(n));
    const dstag=shuf(Array.from({length:n},(_,i)=>(n<2?0:(i/(n-1)-.5))*.34*spreadK));
    R.zombies=list.map((it,i)=>{

      el.style.setProperty("--sd",rnd(.95,1.55).toFixed(2)+"s");   /* 개체마다 절뚝이는 박자가 다르다 */
      el.style.setProperty("--ad",(-rnd(0,1.5)).toFixed(2)+"s");
      el.appendChild(zombieSVG(it.ch,col));
      worldg.appendChild(el);
      const side=sides[i], fly=flyIdx.indexOf(i)>=0;

      if(side==="F"){ off=slots[i]+rnd(-.05,.05); d0=clamp(SPAWN_D+dstag[i]*.5+rnd(-.02,.02),.80,.99); }
      else { off=(side==="L"?-1:1)*rnd(1.35,1.7); d0=rnd(.74,.94); }
      return {id:i,ch:it.ch,decoy:it.decoy,el,col,off,off0:off,toff:off,fly,side,
        d:d0, v:rnd(sp[0],sp[1]), knock:0, back:0,
        alive:true,dead:false,dodging:false};
    });

  }
  /* 매 GREEN마다 좌우 자리를 새로 섞는다 — 위치 기억이 통하지 않게.
     깊이는 등속 전진이 담당한다(다가오는 것 자체가 위협이므로 되돌리지 않는다). */
  function assignLanes(){
    const alive=R.zombies.filter(z=>z.alive);
    const slots=shuf(slotSpread(alive.length));
    alive.forEach((z,i)=>{
      z.toff=slots[i]+rnd(-.07,.07);
      /* 좀비라서 어떤 놈은 잠깐 뒤로 물러섰다 뒤늦게 달려온다 */
      z.back=Math.random()<.20?rnd(.28,.45):0;
    });
  }

  /* 정지 직전 겹침 완화 — 완전히 가려진 좀비가 있으면 그 글자가 필요할 때 쏠 수가 없다.
     깊이가 다르면 덜 가려지므로 요구 간격을 완화한다(원근 자체가 분리 장치). */
  function spreadOut(){
    const a=R.zombies.filter(z=>!z.dead);
    for(let it=0;it<48;it++){
      let moved=false;
      for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
        const A=a[i],B=a[j];
        const pa=proj(A.d,A.off), pb=proj(B.d,B.off);
        const base=(118*pa.s+118*pb.s)*.5*.78;
        const req=base*(Math.abs(A.d-B.d)>.10?.60:1);
        const gap=Math.abs(pa.x-pb.x);
        if(gap<req-.5){
          const px=fieldHalf*(.16+.84*Math.max(pa.p,pb.p));
          const push=(req-gap)/2/Math.max(1,px);
          const dir=pa.x<=pb.x?-1:1;
          A.off=clamp(A.off+dir*push,-.96,.96);
          B.off=clamp(B.off-dir*push,-.96,.96);
          moved=true;
        }
      }
      if(!moved)break;
    }
    R.zombies.forEach(z=>{ z.toff=z.off; });
  }
