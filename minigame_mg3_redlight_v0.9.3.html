      const sl=H("div",{class:"slot ghost"});
      const m=G[ch]||G.o;
      const sv=E("svg",{viewBox:`-8 -10 ${m.w+16} 150`,xmlns:NS});
      const gl=glyph(ch,LCOLS[(start+i)%LCOLS.length],{shadow:false});
      if(gl)sv.appendChild(gl);
      sl.appendChild(sv); row.appendChild(sl);
    });
    goal.appendChild(row); updSlots(); updStars();
  }
  function updSlots(){
    renderTrack(wtrack,wordLog,stageWords.length);   /* v0.8 ②③ */
    const row=document.getElementById("slotrow"); if(!row)return;
    [...row.children].forEach((sl,i)=>{
      sl.classList.toggle("fill",i<R.nextIdx);
      sl.classList.toggle("ghost",i>=R.nextIdx);
      sl.classList.toggle("need",i===R.nextIdx&&R.phase==="red");
    });
  }
  /* 신호등 기둥의 램프 3칸을 '가장 가까운 좀비까지의 거리' 미터로 쓴다(언어 0) */
  function updProx(){
    for(let i=0;i<3;i++){
      const w=tlSVG.querySelector(".w"+i);
      if(w)w.classList.toggle("on",R.near>(i+1)*.24);
    }
    if(dangerOv)dangerOv.style.opacity=(Math.pow(R.near,1.55)*.78).toFixed(3);
  }
  /* ── v0.9.1 ①②(사용자 지시: "감탄사 글자가 타겟을 너무 자주 가려") ──
     연출 문구가 좀비를 덮지 않게 **띄울 자리를 매번 계산**한다.
     ① 후보 띠(화면 높이 비율) 중 **살아 있는 좀비들과 가장 멀리 떨어진 띠**를 고른다.
        MG3는 좀비가 원근으로 몰려 다니므로 비는 띠가 거의 항상 존재한다.
     ② 그래도 가까우면(좀비가 화면 전체로 퍼진 경우) **가까울수록 더 투명하게** — 표적이 비쳐 보인다.
     ③ 크기·시간은 CSS에서 함께 줄였다(가리는 면적과 시간 자체를 줄이는 것이 근본).
     ※ 문구를 없애지 않는 이유: 국면 전환(RED/GREEN)은 소리와 함께 오는 핵심 신호다. */
  const FX_BANDS=[0.10,0.24,0.40,0.56,0.72];   /* 0.72 아래는 총·탄창 자리(4게임 공통값) */
  function fxSpot(){
    const sr=sky.getBoundingClientRect();
    if(!sr.height)return {top:0.15,op:.95};
    const ys=[];
    R.zombies.forEach(z=>{ if(z.dead)return;
      const r=z.el.getBoundingClientRect();
      if(r.height<=0)return;
      ys.push({c:(r.top+r.height*.5-sr.top)/sr.height, h:r.height/sr.height});});
    let best=FX_BANDS[0], bd=-1;
    for(const b of FX_BANDS){
      /* 좀비 중심까지의 거리에서 그 좀비의 반높이를 빼면 '실제 여백'이 된다 */
      const d=ys.length?Math.min(...ys.map(z=>Math.abs(z.c-b)-z.h*.5)):1;
      if(d>bd){bd=d; best=b;}
    }
    /* 여백이 0.12(화면 높이의 12%) 이상이면 또렷하게, 0이면 많이 투명하게 */
    const op=Math.max(.42,Math.min(.95,.42+(bd/0.12)*.53));
    return {top:best, op:op};
  }
  function placeFX(el){
    const p=fxSpot();
    el.style.top=(p.top*100).toFixed(1)+"%";
    el.style.setProperty("--fxop",p.op.toFixed(2));   /* v0.9.2 — 인라인 opacity는 애니메이션에 덮인다 */
  }
  function toast(txt,good){
    const t=H("div",{class:"toast"});
    t.appendChild(shoutNode(txt,good?"#7BE3B6":"#FFB37A"));
    sky.appendChild(t); placeFX(t); later(()=>t.remove(),820);
  }
  function callout(txt,col){
    const c=H("div",{class:"callout in"});
    c.appendChild(shoutNode(txt,col));
    sky.appendChild(c); placeFX(c); later(()=>c.remove(),680);
  }
  /* 검증 프로브 — 연출 자리 계산을 단독으로 확인한다(본편 이식 시 제거) */
  try{window.__MG3FX=fxSpot; window.__MG3CO=callout; window.__MG3TO=toast;}catch(e){}

  /* ---------- 국면 전환 ---------- */
  function goGreen(quiet,punish){
    R.phase="green";
    glass.classList.remove("open");
    tl.classList.remove("red"); tl.classList.add("green");
    ring.setAttribute("opacity","0");
    R.zombies.forEach(z=>{ if(z.dead)return;
      z.el.classList.add("sil"); z.el.classList.remove("frozen"); });
    assignLanes();
    R.greenTotal=(punish?PUNISH_MS:GREEN_MS[Math.min(R.round,GREEN_MS.length-1)])/1000;
    R.greenLeft=R.greenTotal;
    updSlots();
    if(!quiet){ Cue2.gate(); if(!punish){say("Green light!"); callout("GREEN LIGHT","#8BE39B");} }
  }
  function goRed(){
    R.phase="opening";
    spreadOut();
    tl.classList.remove("green"); tl.classList.add("red");
    glass.classList.add("open");
    Cue2.gate(); Cue2.open();
    say("Red light!"); callout("RED LIGHT!","#FF8A7A");
    R.zombies.forEach(z=>{ if(z.dead)return;
      z.el.classList.remove("sil"); z.el.classList.add("frozen"); });
    later(()=>{
      if(R.phase!=="opening")return;
      R.phase="red";
      R.redTotal=RED_MS[Math.min(R.round,RED_MS.length-1)]/1000;
      R.redLeft=R.redTotal; R.hurry=0;
      ring.setAttribute("opacity","1");
      updSlots();
    },430);
  }

  /* ---------- 사격 결과 ---------- */
  function hitCorrect(z){
    z.alive=false; z.dead=true; z.el.classList.add("down");
    z.el.classList.remove("walk");
    Cue2.impact(); Cue2.snap();
    const p=proj(z.d,z.off);
    R.nextIdx+=1; updSlots();
    score+=30; SAVE.ink+=1; persist(); updScore();
    toast(pick(PRAISE),true);
    /* v0.6 ⑨(사용자 지시) — 정답 명중 시 나머지가 밀고 들어오던 SURGE 폐지.
       "맞췄는데 penalty를 주는 건 옳지 않아" — 잘한 행동에 벌이 따라오면 안 된다. */
    /* 좀비가 쓰러지며 아이템을 떨어뜨린다(벌 없음) */
    if(Math.random()<.22){
      const kind=rollDropItem();
      const g=grantItem(kind);
      score+=g.score; if(g.ink){SAVE.ink+=g.ink; persist();}
      itemPop(sky,p.x,p.y-40*p.s,kind); updScore();
    }
    later(()=>{ if(z.el.parentNode)z.el.remove(); },620);
    if(R.nextIdx>=R.letters.length) wordClear();
  }
  function hitWrong(z){
    if(z.dodging)return;
    z.dodging=true; R.fails+=1;
    /* ⑦ 방어 수단 — 아파하며 뒤로 물러선다. 같은 놈을 반복해 밀면 점점 덜 밀린다(무한 스톨 방지).
       대신 사격 창을 잃는다 = "지금 밀어낼까, 계속 읽을까"라는 진짜 선택이 생긴다 */
    const k=KNOCK[Math.min(z.knock||0,KNOCK.length-1)];
    z.knock=(z.knock||0)+1;
    z.d=Math.min(.97,z.d+k);
    const hb="hb"+(1+Math.floor(Math.random()*5));  /* 비틀·팽이·공중제비·깡충·구르기 */
    z.el.classList.add("hurt",hb);
    Cue2.hurt(); Cue2.taunt();
    later(()=>{ z.el.classList.remove("hurt",hb); z.dodging=false; },620);
    R.phase="closing";
    ring.setAttribute("opacity","0");
    later(()=>{ if(R.phase==="closing"){ Cue2.wrong(); goGreen(false,true); } },420);
  }

  /* ---------- 위험선 돌파 = 그 순간 물린다(실패 카운터 폐기) ---------- */
  function breach(z){
    if(R.phase==="attack"||R.phase==="clear")return;
    R.phase="attack"; R.inv=2.4;
    ring.setAttribute("opacity","0");
    glass.classList.add("open");
    z.el.classList.remove("sil"); z.el.classList.add("lunge");
    Cue2.growl();
    later(()=>{
      /* 화면 한가운데를 얼굴이 꽉 채운다 */
      const ov=H("div",{class:"lungeov"});
      ov.appendChild(zombieFaceSVG(z.ch,z.col));
      sky.appendChild(ov); later(()=>ov.remove(),1300);
      sky.classList.add("hit");
      const g=H("div",{class:"gulp"}); sky.appendChild(g); later(()=>g.remove(),1000);
      Cue2.chomp(); Snd.t(70,.7,"sine",.2);
      const t=H("div",{class:"toast top"}); t.appendChild(shoutNode("BOO!","#FFB37A"));
      sky.appendChild(t); later(()=>t.remove(),1100);
      SAVE.hearts=Math.max(0,SAVE.hearts-1); persist(); updHearts();
      later(()=>sky.classList.remove("hit"),700);
    },380);
    /* v0.7 ⑥(사용자 지시) — 물리면 그 단어는 **틀린 것**. 재도전 없이 다음 단어로 */
    wordLog.push({k:R.word.k,w:R.word.w,ok:false});
    renderTrack(wtrack,wordLog,stageWords.length);                   /* v0.8 ②③ — 즉시 ✗ */
    later(()=>{
      if(SCREEN!=="play")return;
      z.el.classList.remove("lunge");
      if(SAVE.hearts<=0){ finishStage(); return; }
      R.round+=1;
      if(R.round>=ROUNDS){ finishStage(); return; }
      prestudy(R.round);
    },1900);
  }

  /* ---------- 단어 완성 ---------- */
  function wordClear(){
    R.phase="clear";
    ring.setAttribute("opacity","0");
    winFX(sky,cx,Hp*.42,true);
    Cue2.fanfare(); Cue2.clap(); cheerSurvs(2.2);   /* 클리어 = 사람들이 정면으로 환호 */
    gainMag();                                   /* 학습 완성 = 탄창 +1(공용 규칙) */
    SAVE.stat.spell+=1; SAVE.stat.ref+=1;        /* 다축: SPELLING + REFLEX */
    SAVE.seen[R.word.w]=(SAVE.seen[R.word.w]||0)+1;
    persist();
    const pf=(R.fails===0);                                          /* v0.7 ⑨ — 오발 없이 한 번에 */
    wordLog.push({k:R.word.k,w:R.word.w,ok:true,perfect:pf,ms:performance.now()-wordT0});
    renderTrack(wtrack,wordLog,stageWords.length);                   /* v0.8 ②③ — 즉시 ✓ */
    if(pf){ score+=80; cascadeFX(sky,W||360,Hp||520); }
    score+=140; updScore();
    say(R.word.w);
    later(()=>{
      R.round+=1;
      if(R.round>=ROUNDS) finishStage();
      else prestudy(R.round);
    },2300);
  }

  /* ---------- 판정: 시각 중심 + z 우선(맨 위가 맞는다) ---------- */
  function shootAt(x,y){
    reticleFX(fx,x,y);
    if(R.phase!=="red"){                       /* 유리에 맞고 튕긴다 — 벌 없음, 탄약만 소모 */
      Cue2.tink(); return;
    }
    /* ⑨ 던져진 아이템이 가장 앞 레이어 — 공중에서 맞히면 내 것(폭탄이면 대폭발 = 이롭다) */
    for(const tw of R.throws.slice()){
      const r=(tw.sz||40)*.62;
      if(Math.abs(x-(tw.cx||0))<r&&Math.abs(y-(tw.cy||0))<r){ popThrow(tw); return; }
    }
    let best=null,bz=-1;
    R.zombies.forEach(z=>{
      if(z.dead)return;
      const q=proj(z.d,z.off,z.fly);
      const w=118*q.s, k=w/150;              /* viewBox 150×240, 발끝 y=222 */
      if(x>q.x-w*.5&&x<q.x+w*.5&&y>q.y-222*k&&y<q.y+16*k&&q.z>bz){best={t:"z",o:z};bz=q.z;}
    });
    if(!best){
      R.survs.forEach(o=>{
        const q=proj(o.d,o.off);
        const w=71*q.s, k2=w/110;
        if(x>q.x-w*.5&&x<q.x+w*.5&&y>q.y-166*k2&&y<q.y+10*k2&&q.z>bz){best={t:"s",o};bz=q.z;}
      });
    }
    if(!best)return;
    if(best.t==="s"){       /* 생존자 — 무벌. 놀라서 반대 방향으로 도망간다(재미 최우선) */
      best.o.dir*=-1; say(pick(OUCHES)); Snd.no();
      const q=proj(best.o.d,best.o.off); scuffleAt(q.x,q.y-52*q.s*.6,q.s*.45);
      return;
    }
    const z=best.o;
    const need=R.letters[R.nextIdx];
    if(!z.decoy && z.ch===need) hitCorrect(z);
    else hitWrong(z);
  }
  /* ④ 아래로 쓸었다가 다시 위로 = 즉시 장전. 탄창 버튼보다 빠른 손동작 경로.
     사격은 pointerdown 즉발이라 스와이프 첫 접점에서 한 발이 나가지만,
     빈 탄창일 때는 발사가 막혀 손실이 없다(장전이 필요한 바로 그 상황). */
  let swY0=null,swMax=0,swArmed=false,swT=0,swFx=null;
  /* v0.6 ④ — 끌어내리는 동안 물통이 화면 가운데 **크게** 따라온다(장전 중임이 보인다) */
  function swFxShow(){ if(swFx)return;
    swFx=H("div",{class:"swfx"});
    const sv=E("svg",{viewBox:"0 0 92 112",xmlns:NS}); sv.innerHTML=MAG3_ART; swFx.appendChild(sv);
    sky.appendChild(swFx); }
  function swFxMove(dy){ if(!swFx)return;
    swFx.style.transform="translate(-50%,-50%) translateY("+Math.max(-60,Math.min(96,dy)).toFixed(0)+
      "px) scale("+(1+Math.min(.4,Math.abs(dy)/220)).toFixed(2)+")"; }
  function swFxEnd(ok){ if(!swFx)return; const f=swFx; swFx=null;
    if(ok){ f.classList.add("snap"); setTimeout(()=>f.remove(),260); } else f.remove(); }
  sky.addEventListener("pointerdown",e=>{ swY0=e.clientY; swMax=e.clientY; swArmed=false; swT=Date.now(); });
  sky.addEventListener("pointermove",e=>{
    if(swY0==null)return;
    if(e.clientY>swMax)swMax=e.clientY;
    if(SAVE.ammo<MAG_SIZE&&e.clientY-swY0>18){ swFxShow(); swFxMove(e.clientY-swY0); }
    if(!swArmed&&e.clientY-swY0>44)swArmed=true;
    if(swArmed&&swMax-e.clientY>44&&Date.now()-swT<1000){ swY0=null; swFxEnd(true); gun.reload(); }
  });
  const swEnd=()=>{swY0=null; swFxEnd(false);};
  sky.addEventListener("pointerup",swEnd);
  sky.addEventListener("pointercancel",swEnd);
  sky.addEventListener("pointerleave",swEnd);

  sky.addEventListener("pointerdown",e=>{
    if(PAUSED)return;
    if(R.phase!=="green"&&R.phase!=="red"&&R.phase!=="opening")return;
    const rc=sky.getBoundingClientRect();
    const x=e.clientX-rc.left, y=e.clientY-rc.top;
    Snd.init();
    if(!gun.tryFire(x,y))return;
    Cue2.shot();
    shootAt(x,y);
  });

  /* ---------- 메인 루프 ---------- */
  let lastTs=0;
  function frame(ts){
    RAF=requestAnimationFrame(frame);
    if(!lastTs){lastTs=ts;return;}
    let dt=(ts-lastTs)/1000; lastTs=ts;
    if(PAUSED||SCREEN!=="play")return;
    dt=Math.min(dt,.05);
    if(!W)measure();
    if(R.inv>0)R.inv-=dt;

    if(R.phase==="green"){
      R.greenLeft-=dt;
      let breached=null;
      R.zombies.forEach(z=>{
        if(z.dead)return;
        let v=z.v;
        if(z.back>0){ z.back-=dt; v=-v*.85; }      /* 잠깐 물러섰다 뒤늦게 달려온다 */
        z.d=clamp(z.d-v*dt,.02,.98);
        /* 옆에서 들어오는 놈은 천천히 밀고 들어와야 '사방에서 온다'가 읽힌다 */
        z.off+=(z.toff-z.off)*Math.min(1,dt*1.05);
        /* v0.6 ⑩(사용자 지시) — 한자리에 뭉치지 않는다: 주기적으로 새 가로 목표를 잡아
           화면 전체를 넓게 배회한다(깊이 전진은 그대로 — 다가오는 위협 불변) */
        z.wanderT=(z.wanderT==null?rnd(.3,1.4):z.wanderT)-dt;
        if(z.wanderT<=0){ z.wanderT=rnd(.9,2.4); z.toff=clamp(z.off+rnd(-.85,.85),-.96,.96); }
        if(z.d<=D_LINE&&!breached)breached=z;
      });
      if(breached&&R.inv<=0){ breach(breached); }
      else if(R.greenLeft<=0) goRed();
    } else if(R.phase==="red"){
      R.redLeft-=dt;
      const f=clamp(R.redLeft/R.redTotal,0,1);
      ring.setAttribute("stroke-dasharray",(RING_LEN*f).toFixed(1)+" "+RING_LEN);
      if(R.redLeft<=.9&&R.hurry<1){ R.hurry=1; Cue2.alarm(); }
      /* 시간 초과는 벌이 아니다 — 기회를 놓쳤을 뿐, 유리만 닫힌다(흐름 유지) */
      if(R.redLeft<=0){ R.phase="closing"; ring.setAttribute("opacity","0");
        later(()=>{if(R.phase==="closing")goGreen(false);},220); }
    }

    updClock();

    /* 근접도 = 이 게임의 긴장 게이지. 심장박동·붉은 화면·램프가 전부 여기 걸린다 */
    let minD=1;
    R.zombies.forEach(z=>{ if(!z.dead&&z.d<minD)minD=z.d; });
    R.near=clamp((SPAWN_D-minD)/(SPAWN_D-D_LINE),0,1);
    updProx();
    if(R.phase==="green"||R.phase==="red"){
      R.drumT-=dt;
      if(R.drumT<=0){ Cue2.drum(R.near); R.drumT=1.05-.78*R.near; }
    }

    /* ----- ③⑨ 생존자: 도망 → 가끔 물림(만화식 먼지구름) → 아이템 투척 ----- */
    if(R.cheerT>0){ R.cheerT-=dt; if(R.cheerT<=0)R.survs.forEach(survRun); }
    R.throwT-=dt;
    if(R.throwT<=0&&R.throws.length<2&&R.phase!=="attack"){
      const runners=R.survs.filter(o=>o.state==="run");
      if(runners.length)throwItem(pick(runners));
      R.throwT=rnd(THROW_MS[0],THROW_MS[1])/1000;
    }
    R.survs.forEach(o=>{
      if(o.state==="caught"){ o.t-=dt; if(o.t<=0){ survRun(o); o.dir*=-1; } }
      else if(o.state==="run"){
        o.off+=o.dir*o.sp*dt;
        if(o.off>1.45){o.off=1.45;o.dir=-1;} if(o.off<-1.45){o.off=-1.45;o.dir=1;}
        /* 근처에 지상 좀비가 있으면 붙잡힌다 — 유혈 없이 먼지구름으로(5세 기준) */
        if(R.phase==="green"&&Math.random()<dt*.14){
          const nz=R.zombies.find(z=>!z.dead&&!z.fly&&Math.abs(z.d-o.d)<.07&&Math.abs(z.off-o.off)<.16);
          if(nz){
            o.state="caught"; o.t=1.15;
            o.el.classList.remove("run"); o.el.classList.add("caught");
            const q=proj(o.d,o.off);
            scuffleAt(q.x,q.y-52*q.s*.6,q.s*.62); Cue2.scuffle(); say(pick(OUCHES));
          }
        }
      }
      const q=proj(o.d,o.off);
      const w=71*q.s, k2=w/110;            /* ③ 좀비(118)의 60%. viewBox 110×180, 발끝 y=166 */
      o.el.style.width=w+"px";
      o.el.style.transform=`translate(${(q.x-w/2).toFixed(1)}px,${(q.y-166*k2).toFixed(1)}px)`
        +(o.dir<0&&o.state==="run"?" scaleX(-1)":"");
      o.el.style.zIndex=Math.max(3,q.z-20);
    });
    /* 던져진 아이템 — 포물선으로 카메라 쪽으로 날아온다 */
    R.throws.slice().forEach(tw=>{
      tw.t+=dt/tw.dur;
      if(tw.t>=1){ tw.el.remove(); R.throws=R.throws.filter(q=>q!==tw); return; }
      /* ① 문 평면을 지나는 순간, 문이 닫혀 있으면 부딪혀 깨진다 */
      if(!tw.smashed&&tw.t>=DOOR_T&&doorShut()){ tw.smashed=true; smashThrow(tw); return; }
      const t=tw.t;
      const x2=tw.x0+(tw.x1-tw.x0)*t;
      const y2=tw.y0+(tw.y1-tw.y0)*t-Math.sin(t*Math.PI)*Hp*tw.arc;
      const sz=tw.s0+(tw.s1-tw.s0)*t;
      tw.cx=x2; tw.cy=y2; tw.sz=sz;
      tw.el.style.width=sz+"px"; tw.el.style.height=sz+"px";
      tw.el.style.transform=`translate(${(x2-sz/2).toFixed(1)}px,${(y2-sz/2).toFixed(1)}px)`;
    });

    /* ----- 좀비 그리기 ----- */
    R.zombies.forEach(z=>{
      if(z.dead&&!z.el.parentNode)return;
      const p2=proj(z.d,z.off,z.fly);
      const w=118*p2.s, k=w/150;
      z.el.style.width=w+"px";
      z.el.style.transform=`translate(${(p2.x-w/2).toFixed(1)}px,${(p2.y-222*k).toFixed(1)}px)`;
      z.el.style.zIndex=p2.z;
    });
  }

  /* ---------- 레이스 시작 흐름: 예습 → READY 3,2,1 GO ---------- */
  async function prestudy(idx){
    R.phase="idle"; R.word=stageWords[idx]; R.letters=[...R.word.w];
    R.nextIdx=0; R.fails=0; R.round=idx; R.near=0; R.inv=0; R.drumT=0;
    R.throwT=rnd(1.6,2.8); R.cheerT=0;
    buildSurvivors(); spawnZombies(); buildGoal(); updProx();
    glass.classList.remove("open");
    tl.classList.remove("red"); tl.classList.add("green");
    ring.setAttribute("opacity","0");
    const ov=H("div",{class:"modal"});
    const card=H("div",{class:"card"});
    const pic=H("div",{class:"prept"}); pic.appendChild(partIcon(R.word.k)); card.appendChild(pic);
    card.appendChild(multiWordSVG(R.word.w,260));
    const row=H("div",{style:"display:flex;gap:12px"});
    row.appendChild(ibtn("spk",()=>{say(R.word.w);Cue2.word();}));
    let started=false;
    const go=async()=>{ if(started)return; started=true;
      Snd.init(); if(ov.parentNode)ov.remove(); await readyGo();
      wordT0=performance.now(); };               /* v0.7 ⑩ — 반응속도 측정 시작 */
    row.appendChild(H("button",{class:"bigbtn",on:{click:go}},[icoSVG("play")]));
    card.appendChild(row);
    /* ④ 3초만 기다린다 — 안 누르면 바로 시작(카운트다운 없음) */
    const bar=H("div",{class:"autobar"},[H("i")]);
    card.appendChild(bar);
    ov.appendChild(card); app.appendChild(ov);
    later(()=>{say(R.word.w);Cue2.word();},300);
    later(()=>{ if(SCREEN==="play")go(); },3000);
  }
  async function readyGo(){
    const ov=H("div",{class:"readyov"}); sky.appendChild(ov);
    const show=(t,c)=>{ov.innerHTML="";ov.appendChild(shoutNode(t,c||"#FFD45C"));};
    show("READY"); Cue2.ready(); await wait(620);
    show("GO!","#7BE3B6"); Cue2.go(); await wait(480);   /* ④ 3,2,1 카운트 폐기 */
    ov.remove();
    later(()=>{ if(SCREEN==="play")say(R.word.w); },240);
    goGreen(true);
  }

  measure();                 /* 스폰 전에 화면 치수를 잡아야 깊이 산포가 제대로 걸린다 */
  updAmmoHUD();
  prestudy(0);
  RAF=requestAnimationFrame(frame);
}

/* ====================== 타이틀·결과 ====================== */
function warmTTS(){
  try{ if(window.speechSynthesis){ speechSynthesis.getVoices();
    const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
}
/* v0.8 ①(사용자 지시) — 시작 전 화면을 **Spellshot과 같은 문법**으로 통일.
   순서: 큰 타이틀 → 주인공 아트 → 자원(하트·잉크·씨앗) → ▶ → 3초 자동 시작 게이지 → 별자리
   → 좌상단 🏠 / 우상단 ⚙. 색만 좀비 테마(붉은 신호등 + 독초록 좀비). 카드형 레이아웃은 폐기. */
function scrTitle(){
  clearAll(); SCREEN="title"; regen(Date.now());
  const c=H("div",{class:"pageC"});
  c.appendChild(H("div",{class:"gametitle"},[shoutNode("Red Light","#FF8A7A",true)]));
  /* 주인공 아트 — MG1의 Wordrop 자리에 좀비 한 마리(독초록) */
  const hold=H("div",{class:"heroart"});
  const z=zombieSVG("r","#8BE36B"); z.classList.add("walk");   /* 몸통 = 글자 형태(zombieSVG 문법). 좀비 독초록 */ hold.appendChild(z);
  c.appendChild(hold);
  const bar=H("div",{class:"purse"});
  bar.appendChild(heartsRow());
  bar.appendChild(counter("ink",SAVE.ink));
  bar.appendChild(counter("seed",SAVE.seeds));
  c.appendChild(bar);
  const btn=ibtn("play",()=>{ stopAuto(); if(SAVE.hearts<=0){Snd.no();return;}
    Snd.init(); warmTTS(); scrPlay(); },"big");
  btn.id="startBtn"; c.appendChild(btn);
  /* 공용 표준 — 아무것도 안 눌러도 3초 뒤 자동 시작. ⚙를 열면 멈춘다 */
  const AUTO_MS=3000;
  let autoId=0;
  const ab=H("div",{class:"autobar",id:"autobar"}); ab.appendChild(H("i"));
  function stopAuto(){ if(autoId){clearTimeout(autoId); autoId=0;} ab.classList.add("stop"); }
  if(SAVE.hearts>0){
    c.appendChild(ab);
    autoId=later(()=>{ autoId=0; if(SCREEN==="title"&&SAVE.hearts>0){Snd.init(); warmTTS(); scrPlay();} },
      Math.round(AUTO_MS*(SAVE.set.motion?1:.3)));
  }
  const rw=H("div",{class:"radarSmall"}); rw.appendChild(radarSVG(SAVE.stat)); c.appendChild(rw);
  const gear=ibtn("gear",()=>{ stopAuto(); parentPanel(); }); gear.className="ib corner"; c.appendChild(gear);
  const hm=ibtn("home",()=>{ stopAuto(); location.href="index.html"; });
  hm.className="ib corner cornerL"; hm.id="titleHome"; c.appendChild(hm);
  app.appendChild(c);
}
/* v0.7 ⑨(사용자 지시) — 퍼펙트 단어 = Candy Crush식 연쇄 팡팡 */
function cascadeFX(sky,fw,fh){
  const COLS=["#FFCE5C","#FF8A8A","#7BE3B6","#8CC8EE","#F79FC4","#C9A8F0"];
  const sh=H("div",{class:"perfshout"}); sh.appendChild(shoutNode("PERFECT!","#FFD45C"));
  sky.appendChild(sh); later(()=>sh.remove(),1300);
  for(let i=0;i<11;i++){
    later(()=>{
      if(!sky.parentNode)return;
      const p=H("div",{class:"cascpop"});
      p.style.left=(fw*(.10+.80*Math.random())).toFixed(0)+"px";
      p.style.top=(fh*(.14+.62*Math.random())).toFixed(0)+"px";
      p.style.setProperty("--c",COLS[i%COLS.length]);
      sky.appendChild(p); later(()=>p.remove(),780);
      Snd.t(500+i*75,.09,"triangle",.12);
      if(i%3===2)Snd.t(240+i*40,.14,"sine",.08);
    },90*i);
  }
  later(()=>Cue2.gold(),1050);
}
/* v0.7 ④⑥⑩(사용자 지시) — 결과 = 단어 통계(그림+O/X) + 60% 게이트 + 총점 카운트업. 별표 폐지 */
function scrResult(win,score,log){
  clearAll(); SCREEN="result";
  if(score>SAVE.best){SAVE.best=score;persist();}
  log=log||[];
  const okN=log.filter(x=>x.ok).length, tot=Math.max(1,log.length);
  const pct=Math.round(okN/tot*100), pass=okN/tot>=.6;
  const c=H("div",{class:"center"});
  const card=H("div",{class:"card"});
  card.appendChild(shoutNode(pass?"STAGE CLEAR!":"ALMOST!",pass?"#7BE3B6":"#FFB37A"));
  const grid=H("div",{class:"wstat"});
  log.forEach(x=>{
    const wc=H("div",{class:"wcard "+(x.ok?"ok":"no")});
    const ic=H("div",{class:"wic"}); ic.appendChild(partIcon(x.k)); wc.appendChild(ic);
    wc.appendChild(H("div",{class:"wname",text:x.w}));
    wc.appendChild(H("div",{class:"wbadge "+(x.ok?"ok":"no"),text:x.ok?"\u2713":"\u2717"}));
    if(x.perfect)wc.appendChild(H("div",{class:"wperf",text:"PERFECT"}));
    grid.appendChild(wc);
  });
  card.appendChild(grid);
  card.appendChild(H("div",{class:"stPct",text:okN+" / "+log.length+" \u00b7 "+pct+"%"}));
  const okL=log.filter(x=>x.ok);
  const accB=okN*40;
  const refB=okL.reduce((a,x)=>a+Math.max(0,Math.round((16000-Math.min(16000,x.ms||16000))/400)),0);
  const total=(score||0)+accB+refB;
  const row0=H("div",{class:"stBonus"});
  row0.appendChild(H("span",{class:"bchip",text:"SCORE "+(score||0)}));
  row0.appendChild(H("span",{class:"bchip acc",text:"ACCURACY +"+accB}));
  row0.appendChild(H("span",{class:"bchip ref",text:"SPEED +"+refB}));
  card.appendChild(row0);
  const big=H("b",{class:"num",id:"bigscore",style:"font-size:2.2rem",text:"0"});
  card.appendChild(H("div",{class:"cnt",style:"font-size:1.2rem"},[icoSVG("score"),big]));
  const row=H("div",{style:"display:flex;gap:12px;align-items:center"});
  row.appendChild(ibtn("home",()=>{location.href="index.html";}));
  const nsW=H("div",{class:"nsWrap"+(pass?"":" dis"),id:"nsWrap"});
  nsW.appendChild(H("div",{class:"nsLab",text:"NEXT STAGE"}));
  const nb=H("button",{class:"bigbtn",id:"nextStageBtn",on:{click:()=>{ if(!pass||SAVE.hearts<=0){Snd.no();return;}
    SAVE.stage=(SAVE.stage||1)+1; persist(); Snd.init(); scrPlay(); }}},[icoSVG("play")]);
  nsW.appendChild(nb); row.appendChild(nsW);
  if(SAVE.hearts>0)
    row.appendChild(H("button",{class:"bigbtn",id:"replayBtn",on:{click:()=>{Snd.init();scrPlay();}}},[icoSVG("replay")]));
  card.appendChild(row);
  c.appendChild(card); app.appendChild(c);
  if(pass){ Cue2.fanfare();
    later(()=>{const r2=c.getBoundingClientRect(); winFX(c,r2.width/2,r2.height*.3,true);},250); }
  /* ⑩ 총점이 틱 사운드와 함께 차오른다(정확도·반응속도 보너스 합산) */
  const DUR=1600, t0=performance.now(); let lastTick=0, fin=false;
  window.__TALLY={total:total,acc:accB,ref:refB,pass:pass,pct:pct,done:false};
  (function roll(now){
    if(SCREEN!=="result"||fin)return;
    const p=Math.min(1,(now-t0)/DUR), e=1-Math.pow(1-p,3);
    big.textContent=String(Math.round(total*e));
    if(now-lastTick>70){ lastTick=now; Snd.t(560+920*e,.03,"square",.05); }
    if(p>=1){ fin=true; big.textContent=String(total); window.__TALLY.done=true;
      if(pass)Cue2.fanfare(); else Cue2.beat(); return; }
    requestAnimationFrame(roll);
  })(performance.now());
}
