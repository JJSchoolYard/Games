<!-- ======================================================================
  minigame_mg3_redlight_v0.4.html · 2026-08-14 · 상태: 검토중
  MG3 Red Light — 철자 SPELLING + 순발력 REFLEX (다축)
  "무궁화 꽃이 피었습니다" 계보 · 무너진 도시 내리막길 · 사용자가 술래다.

  v0.4 변경
   ★ **버그 수정(치명)** — v0.3에서 배경 개체가 허수아비→생존자로 바뀌며 함수명이
     `cheerBg`→`cheerSurvs`로 변했는데 `wordClear()`가 옛 이름을 계속 불렀다.
     동기 호출이라 여기서 ReferenceError가 나면서 **점수·별·persist·다음 단계 예약이
     통째로 날아가 한 판을 깨면 게임이 멈췄다.** 회귀 검사 신설(버그 사본으로 재현 확인).
   ① 총을 **Spellshot과 동일**하게 — 각도 전이 `.09s`(스냅하지 않고 스르륵 따라온다),
      하드 오프셋 그림자, 강한 반동/코르크 회전/장전 딥, 조준경형 타겟마크
   ② 좀비가 **배경 맨 끝(지평선)에서 출발**해 다가올수록 커진다 — 스폰 깊이 0.80→**0.97**,
      크기식 (0.46+1.00p) → **(0.30+1.24p)**로 약 4배 성장. 처음엔 작아서 읽기 어렵다
   ③ 사람 크기를 **좀비의 60%**로(118 → 71 기준폭)

  유지: 위험선(넘으면 즉시 하트 -1) · 고정 사격 창 · 오답=넉백 방어 · 정답 서지 ·
  심장박동/붉은 화면/램프 크레센도 · 나는 좀비 · 사방 등장 · 생존자와 물림 연출 ·
  던져주는 아이템과 **이로운 폭탄**(사용자 지정 예외) · 예습 3초 자동 · 스와이프 장전 ·
  Spellshot 동일 SHOUT 서체 · 실루엣이 글자 모양을 흘림 · i/l 구분 글리프 · z 우선 판정.
====================================================================== -->
<style>
:root{
  --ink:#3B2B3A; --ink-soft:#6B5560;
  --paper-0:#FBF3E4; --paper-1:#F2E4CC; --paper-2:#E4D0AE; --paper-3:#CDB489; --paper-4:#A9906A;
  --coral:#FF7A6B; --butter:#FFCE5C; --mint:#6FD9C0; --sky:#6FB8E8; --grape:#B49AE0; --rose:#F79FC4;
  --drop:#8FD8F0; --drop-deep:#5AAECF; --blush:#FF8E86;
  --ui:1; --dur:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper-0);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:calc(16px * var(--ui));user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
/* ⑧ SHOUT 서체 — Spellshot과 동일(둥근 볼드 대문자 + 두꺼운 잉크 외곽, paint-order로 획이 뒤로) */
.shout{font-family:"Arial Rounded MT Bold","Baloo 2","Pretendard",system-ui,sans-serif;
  font-weight:900;letter-spacing:1px;color:var(--sc,#FFD45C);
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
  font-size:clamp(30px,8vw,58px);line-height:1.05;text-align:center;white-space:nowrap;
  filter:drop-shadow(0 4px 0 rgba(59,43,58,.22))}
.callout .shout{font-size:clamp(30px,7.4vw,56px)}   /* v0.9.1 ③ — 가리는 면적을 줄인다 */
.readyov .shout{font-size:clamp(52px,14vw,104px)}
.toast .shout{font-size:clamp(20px,5.4vw,38px)}     /* v0.9.1 ③ */
.reloadhint .shout{font-size:clamp(15px,3.6vw,22px);-webkit-text-stroke:4px var(--ink)}
.pauseov .shout{font-size:clamp(44px,12vw,88px)}
.ib{flex:0 0 auto;width:46px;height:46px;border-radius:14px;border:2.5px solid var(--ink);
  background:var(--paper-1);box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:7px;display:grid;place-items:center}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib svg{width:100%;height:100%;display:block}

/* ---------- 상단 HUD ---------- */
/* ★ 대시보드 = 상단 두 줄. **철자판까지가 대시보드다.**
   철자판을 필드 위에 띄우면 배경·연출·표적과 영원히 싸운다 — 겹침을 하나씩 피해 다니는 것보다
   처음부터 안 겹치는 자리에 두는 것이 옳다(사용자 판단, MG1·MG2·MG4와 동일 표준).
   1행: ♥×N · 점수 · 먹물 · [여백] · ⚙
   2행: 시계+타이머(고정폭) · 여백 · 철자판(왼쪽 정렬, 오른쪽은 비워 둔다) */
.bar{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;z-index:40;
  padding:calc(6px + env(safe-area-inset-top)) 10px 6px;
  background:linear-gradient(var(--paper-0) 88%,transparent)}
.dashrow{display:flex;align-items:center;gap:8px;min-width:0}
/* v0.9 ②(사용자 지시) — 하트를 개수만큼 그리지 않고 **(♥ × 숫자)** 한 덩어리로.
   상한이 올라가도 1행 폭이 흔들리지 않는다(MG1 공용 표준과 동일 표기). */
.hearts{display:flex;gap:4px;align-items:center;flex:0 0 auto;background:var(--paper-1);
  border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:3px 9px}
.hearts svg{width:22px;height:22px;display:block}
.hearts .hx{font-weight:900;font-size:calc(1.02rem);letter-spacing:-.5px;min-width:22px;text-align:left}
.hearts.zero .hx{color:#E4374B}
.cnt{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--paper-1);
  border:2.5px solid var(--ink);border-radius:99px;padding:3px 10px 3px 6px;font-weight:900}
.cnt svg{width:20px;height:20px}
.cnt .num{font-size:calc(.92rem)}
/* ④ 고정폭 — 6자 공간. 점수가 올라가도 폭이 변하지 않아 레이아웃이 흔들리지 않는다 */
/* v0.9 ③(사용자 지시) — 점수·먹물 창을 **같은 폭으로 늘려 1행을 꽉 채운다**(여백 spacer 폐지).
   flex:1 1 0 이면 둘이 남는 폭을 정확히 반씩 나눠 가지므로 화면 폭이 달라도 두 창은 항상 같다. */
.cnt.fixed{flex:1 1 0;min-width:0;width:auto;justify-content:flex-start}
.cnt.fixed .num{flex:1 1 auto;text-align:right;font-variant-numeric:tabular-nums}
.spacer{flex:1 1 auto;min-width:0}
.bar .ib{width:40px;height:40px;border-radius:12px}
/* 라운드 별 — 철자판 안 왼쪽으로 옮겼다(1행 폭을 비워 준다. MG1의 단어 별과 같은 자리) */
.stars{display:flex;gap:3px;flex:0 0 auto}
.stars svg{width:22px;height:22px}
/* ③ 시계 + 타이머 — 하트 바로 아랫줄. 이 칸의 폭이 곧 철자판의 들여쓰기 기준이다 */
.timecell{flex:0 0 auto;width:min(22vw,86px);display:flex;align-items:center}   /* v0.9 ④ — 한 칸 축소 */
.clockwrap{display:flex;align-items:center;gap:5px;background:var(--paper-0);border:3px solid var(--ink);
  border-radius:999px;padding:3px 10px 3px 5px;box-shadow:0 3px 0 var(--ink);flex:1 1 auto;min-width:0}
.clock{width:27px;height:27px;flex:0 0 auto}
.clkface{width:100%;height:100%;display:block}
.clock svg.clkburst{animation:cshake .5s}
@keyframes cshake{25%{transform:translateX(-3px) rotate(-6deg)}75%{transform:translateX(3px) rotate(6deg)}}
.cnum{font-weight:900;font-size:calc(1.02rem);flex:1 1 auto;text-align:right;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}
/* 실패 경고등 3칸 — 언어 0 */
.warns{display:flex;gap:4px;align-items:center}
.warns i{width:17px;height:17px;border-radius:50%;border:2.5px solid var(--ink);
  background:#3A2E3A;box-shadow:inset 0 2px 3px rgba(0,0,0,.45);display:block}
.warns i.on{background:radial-gradient(circle at 35% 32%,#FFE0A0,#FF5A4A 62%);
  box-shadow:0 0 9px #FF5A4A;animation:warnpop .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes warnpop{45%{transform:scale(1.45)}}

/* ---------- 목표 단어 슬롯 ---------- */
/* ★ 철자판 — 대시보드 2행. **왼쪽 정렬 + 오른쪽 개방**(긴 단어가 오른쪽으로 자란다).
   시계 영역만큼 들여쓴 자리에서 시작한다. 필드 위에 띄우지 않으므로
   배경·연출·표적을 가리는 문제 자체가 생기지 않는다. */
.goal{flex:1 1 auto;min-width:0;margin-left:4px;   /* v0.9 ④ — 철자판을 왼쪽으로 더 당긴다 */
  display:flex;align-items:center;justify-content:flex-start;gap:8px;
  background:var(--paper-1);border:3px solid var(--ink);border-radius:16px;
  padding:4px 12px 4px 8px;box-shadow:0 3px 0 rgba(59,43,58,.28);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.goal::-webkit-scrollbar{display:none}
.goal .pic{width:34px;height:34px;flex:0 0 auto}
.goal .pic svg{width:100%;height:100%;display:block}
.slotrow{display:flex;gap:4px;align-items:flex-end;flex:0 0 auto}
.slot{width:26px;height:36px;position:relative;border-bottom:4px solid var(--ink);border-radius:3px}
.slot svg{position:absolute;inset:2px 1px 3px;width:auto;height:auto;max-width:100%;max-height:100%;margin:auto}
.slot.ghost svg{opacity:.20;filter:grayscale(.45)}
.slot.need{background:#FFF3CE}
.slot.need svg{animation:slotpulse 1s ease-in-out infinite}
@keyframes slotpulse{50%{opacity:.55;transform:scale(1.08)}}
.slot.fill svg{opacity:1;animation:slotin .4s cubic-bezier(.2,1.7,.4,1)}
@keyframes slotin{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1)}}

/* ---------- 필드(황혼의 들판) ---------- */
.sky{position:relative;flex:1;overflow:hidden;
  background:linear-gradient(#2A2038 0%,#46283E 4%,#75384A 8%,#B0504A 12%,#D97148 15%,#F0A257 17%,#6A5C66 19%,#5A4E5C 100%)}
.fx{position:absolute;inset:0;z-index:60;pointer-events:none}
.bgsvg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
.worldg{position:absolute;inset:0;z-index:2}
.ent{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.ent svg{display:block;overflow:visible}

/* ---------- 좀비 (v0.1 — 절뚝이는 흐느적) ---------- */
.zombie .bodyg{transform-box:fill-box;transform-origin:50% 94%}
.zombie .legL,.zombie .legR{transform-box:fill-box;transform-origin:50% 4%}
.zombie .armF,.zombie .armB{transform-box:fill-box;transform-origin:14% 12%}
.zombie .armB{transform-origin:86% 12%}
.zombie .limbs{transition:opacity .3s}
.zombie.walk .bodyg{animation:shamble var(--sd,1.15s) ease-in-out infinite var(--ad,0s)}
/* 좌우 기울기와 상하 흔들림의 주기를 어긋나게 해 '절뚝'이 만들어진다 */
@keyframes shamble{
  0%{transform:rotate(-7deg) translateY(0)}
  18%{transform:rotate(-4deg) translateY(-8px)}
  40%{transform:rotate(3deg) translateY(-1px)}
  58%{transform:rotate(7deg) translateY(-6px)}
  78%{transform:rotate(2deg) translateY(0)}
  100%{transform:rotate(-7deg) translateY(0)}}
.zombie.walk .legL{animation:legswing var(--sd,1.15s) ease-in-out infinite var(--ad,0s)}
.zombie.walk .legR{animation:legdrag var(--sd,1.15s) ease-in-out infinite var(--ad,0s)}
@keyframes legswing{0%,100%{transform:rotate(21deg)}50%{transform:rotate(-17deg)}}
@keyframes legdrag{0%,100%{transform:rotate(-8deg)}62%{transform:rotate(7deg)}}
.zombie.walk .armF{animation:armlimp var(--sd,1.15s) ease-in-out infinite var(--ad,0s)}
.zombie.walk .armB{animation:armdangle calc(var(--sd,1.15s) * 1.6) ease-in-out infinite var(--ad,0s)}
@keyframes armlimp{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}}
@keyframes armdangle{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-9deg)}}
.zombie .drool{transform-box:fill-box;transform-origin:50% 0%}
.zombie.walk .drool{animation:drooldrip 3.4s ease-in infinite var(--ad,0s)}
@keyframes drooldrip{0%,55%{transform:scaleY(.25);opacity:.65}
  78%{transform:scaleY(1.7);opacity:.9}
  88%{transform:translateY(26px) scaleY(1.1);opacity:0}100%{opacity:0}}
.zombie.frozen .bodyg,.zombie.frozen .legL,.zombie.frozen .legR,
.zombie.frozen .armF,.zombie.frozen .armB,.zombie.frozen .drool{animation-play-state:paused}
/* 실루엣 — 젖빛 유리 뒤. 몸통(글자)만 새까맣게 남고 얼굴은 숨어 글자꼴이 읽힌다 */
.zombie.sil{filter:brightness(0) blur(.9px) drop-shadow(0 0 4px rgba(255,255,255,.85))
  drop-shadow(0 0 9px rgba(255,255,255,.5));opacity:.93}
.zombie.sil .limbs{opacity:.26}
.zombie.sil .face{opacity:0}
/* 코믹 회피 5종 */
.zombie.dg1 .bodyg{animation:dgMatrix .62s cubic-bezier(.3,1.5,.4,1)}
@keyframes dgMatrix{35%{transform:rotate(-58deg) translateY(16px)}70%{transform:rotate(-58deg) translateY(16px)}}
.zombie.dg2 .bodyg{animation:dgJump .62s cubic-bezier(.3,1.4,.4,1)}
@keyframes dgJump{40%{transform:translateY(-64px) rotate(-8deg)}70%{transform:translateY(-14px)}}
.zombie.dg3 .bodyg{animation:dgSpin .62s ease-in-out}
@keyframes dgSpin{100%{transform:rotate(360deg)}}
.zombie.dg4 .bodyg{animation:dgDuck .62s ease-out}
@keyframes dgDuck{35%,65%{transform:translateY(30px) scaleY(.52) scaleX(1.2)}}
.zombie.dg5 .bodyg{animation:dgBite .62s ease-out}
@keyframes dgBite{25%{transform:translateX(-11px) rotate(-9deg)}55%{transform:translateX(9px) rotate(11deg)}}
.zombie.dg5 .chomp{opacity:1;animation:chompin .5s ease-out}
.zombie .chomp{opacity:0}
@keyframes chompin{0%{transform:translateX(40px) scale(.4)}60%{transform:none}100%{opacity:0}}
/* 쓰러짐 — 위치는 .ent가 쥐고 있으니 안쪽 svg만 넘어뜨린다 */
.zombie.down svg{animation:zdown .6s ease-in forwards;transform-origin:50% 94%}
@keyframes zdown{55%{transform:rotate(48deg) translateY(6px)}100%{transform:rotate(84deg) translateY(16px);opacity:0}}
/* 습격 1단계 — 그 자리에서 확 달려든다 */
.zombie.lunge{z-index:900!important}
.zombie.lunge svg{animation:zlunge .46s cubic-bezier(.4,0,.9,.6) forwards;transform-origin:50% 92%}
@keyframes zlunge{100%{transform:scale(3.6) rotate(6deg)}}
/* 습격 2단계 — 화면 한가운데를 얼굴이 꽉 채운다 */
.lungeov{position:absolute;inset:0;z-index:940;pointer-events:none;display:grid;place-items:center}
.lungeov svg{width:min(96vw,96vh);height:auto;
  animation:lungein 1.05s cubic-bezier(.3,0,.7,.6) forwards;transform-origin:50% 46%;
  filter:drop-shadow(0 12px 26px rgba(20,10,20,.55))}
@keyframes lungein{0%{transform:scale(.30);opacity:0}
  14%{opacity:1}
  62%{transform:scale(1.35)}
  100%{transform:scale(2.6);opacity:1}}

/* ① 나는 좀비 — 지면 평면에서 해방돼 위쪽 공간을 쓴다 */
/* ② 나는 좀비 — 다리를 **뒤로 쭉 뻗은** 자세. 정면 원근에서 뒤로 뻗은 다리는
   짧게 눌려 보이는 게 맞다(foreshortening). 그래서 세로로 납작하게 눌러 위로 붙이고
   투명도를 낮춰 거의 안 보이게 한다. 걷기 애니메이션도 끈다 — 나는데 걸으면 안 된다.
   ★ 그림만 바뀐다. 판정 상자(viewBox 150×240, 발끝 y=222)는 그대로라 조준은 불변. */
.zombie.fly .legL,.zombie.fly .legR{opacity:.26;
  transform:translateY(-9%) scaleY(.20) rotate(3deg) !important;animation:none!important}
.zombie.fly .legR{transform:translateY(-9%) scaleY(.20) rotate(-3deg) !important}
.zombie.fly .foot{opacity:0}
.zombie .wing{transform-box:fill-box;transform-origin:92% 40%;display:none}
.zombie .wingR{transform-origin:8% 40%}
.zombie.fly .wing{display:block}
.zombie.fly.walk .wingL{animation:flapL .34s ease-in-out infinite}
.zombie.fly.walk .wingR{animation:flapR .34s ease-in-out infinite}
@keyframes flapL{50%{transform:rotate(-34deg) scaleY(.72)}}
@keyframes flapR{50%{transform:rotate(34deg) scaleY(.72)}}
.zombie.fly.walk .bodyg{animation:hover 1.6s ease-in-out infinite var(--ad,0s)!important}
@keyframes hover{50%{transform:translateY(-12px) rotate(3deg)}}
body.nomotion .zombie.fly .wing{animation:none}

/* ⑦ 오답 = 아파하며 뒤로 물러남(방어 수단). 반응은 5종이지만 결과는 항상 넉백이라
   유형별로 난이도 신호가 새지 않는다 */
.zombie.hb1 .bodyg{animation:hbStagger .6s ease-out}
@keyframes hbStagger{20%{transform:translateY(-9px) rotate(-18deg) scale(.94)}
  55%{transform:rotate(13deg)}100%{transform:none}}
.zombie.hb2 .bodyg{animation:hbSpin .6s ease-out}
@keyframes hbSpin{100%{transform:rotate(-360deg)}}
.zombie.hb3 .bodyg{animation:hbFlip .6s cubic-bezier(.3,1.3,.4,1)}
@keyframes hbFlip{45%{transform:translateY(-52px) rotate(-160deg)}100%{transform:none}}
.zombie.hb4 .bodyg{animation:hbHop .6s ease-out}
@keyframes hbHop{30%{transform:translateY(-34px) scaleY(1.12)}
  60%{transform:translateY(0) scaleY(.82) scaleX(1.14)}100%{transform:none}}
.zombie.hb5 .bodyg{animation:hbTumble .6s ease-in-out}
@keyframes hbTumble{35%{transform:translateY(14px) rotate(-72deg) scaleY(.8)}
  70%{transform:rotate(-14deg)}100%{transform:none}}
.zombie .ouch{opacity:0}
.zombie.hb1 .ouch,.zombie.hb2 .ouch,.zombie.hb3 .ouch,.zombie.hb4 .ouch,.zombie.hb5 .ouch{
  opacity:1;animation:ouchpop .6s ease-out}
@keyframes ouchpop{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.15);opacity:1}100%{opacity:0}}

/* 격노한 좀비 — 붉은 아지랑이를 두르고 두 배 속도로 달려온다 */
.zombie.rage{filter:drop-shadow(0 0 10px #FF3A2A) drop-shadow(0 0 20px rgba(255,58,42,.6))}
.zombie.rage.sil{filter:brightness(0) blur(.9px) drop-shadow(0 0 6px #FF6A50)
  drop-shadow(0 0 14px rgba(255,90,74,.75));opacity:.95}
.zombie.rage .bodyg{animation-duration:calc(var(--sd,1.15s) * .45)!important}
.zombie.rage .legL,.zombie.rage .legR{animation-duration:calc(var(--sd,1.15s) * .45)!important}

/* 위험 화면 — 가까울수록 가장자리가 붉게 번진다 */
.dangerov{position:absolute;inset:0;z-index:44;pointer-events:none;opacity:0;
  transition:opacity .18s linear;
  background:radial-gradient(ellipse at 50% 60%,rgba(255,60,40,0) 46%,rgba(255,38,24,.55) 82%,rgba(140,8,8,.90) 100%)}
/* 위험선 — 넘으면 물린다 */
.dline{animation:dlinepulse 1.25s ease-in-out infinite}
@keyframes dlinepulse{50%{opacity:.55}}
body.nomotion .dline{animation:none}

/* ③⑨ 도망다니는 생존자 */
.surv .sv{transform-box:fill-box;transform-origin:50% 96%}
.surv.run .sv{animation:svrun .38s ease-in-out infinite}
@keyframes svrun{50%{transform:translateY(-7px) rotate(-4deg)}}
.surv.caught .sv{animation:svshake .12s linear infinite}
@keyframes svshake{25%{transform:translate(-4px,-2px) rotate(-7deg)}75%{transform:translate(4px,2px) rotate(7deg)}}
.surv.cheer .sv{animation:svcheer .4s ease-in-out infinite}
@keyframes svcheer{50%{transform:translateY(-18px) scale(1.06)}}
.surv .svfront{display:none}
.surv.cheer .svfront{display:block}
.surv.cheer .svside{display:none}
body.nomotion .surv .sv{animation:none}
/* 물어뜯기는 순간 — 만화식 먼지구름(5세 기준: 유혈 표현 없음) */
.scuffle{position:absolute;z-index:600;pointer-events:none;margin:-40px 0 0 -40px;width:80px;height:80px}
.scuffle svg{width:100%;height:100%;display:block;animation:scuf .12s linear infinite}
@keyframes scuf{50%{transform:rotate(18deg) scale(1.1)}}

/* ⑨ 생존자가 던져주는 아이템 — 공중에서 쏴 맞히면 내 것.
   ★ z를 유리문(50) **아래**로 내렸다. 그래야 문이 닫혀 있을 때 물건이 문에 부딪혀 깨지는 것이
   그림으로도 맞는다(물건이 유리 앞을 지나가면 문이 없는 것처럼 보인다).
   좀비·생존자는 .worldg(z:2) 안에서 자기들끼리 쌓이므로 물건은 여전히 그들보다 앞이다. */
.thrown{position:absolute;z-index:46;pointer-events:none;will-change:transform}
.thrown .tin{width:100%;height:100%;border-radius:16px;border:4px solid var(--ink);
  background:linear-gradient(#F2E4CC,#D8BE93);box-shadow:0 4px 0 rgba(59,43,58,.35);
  display:grid;place-items:center;animation:tspin 1.1s linear infinite}
.thrown.bomb .tin{background:radial-gradient(circle at 34% 30%,#6B5F72,#2E2733);border-color:#1E1822}
@keyframes tspin{100%{transform:rotate(360deg)}}
.thrown .tin svg{width:66%;height:66%}
.thrown.bomb .tin svg{width:78%;height:78%}
body.nomotion .thrown .tin{animation:none}
/* 폭탄 폭발 = 이 게임에선 이롭다(사용자 지정 예외) */
.blastring{position:absolute;z-index:560;pointer-events:none;border-radius:50%;
  border:10px solid #FFE0A0;margin:-30px 0 0 -30px;width:60px;height:60px;
  animation:blastr .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes blastr{100%{width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;
  border-width:3px;opacity:0}}
.blastflash{position:absolute;inset:0;z-index:555;pointer-events:none;background:#FFF3D0;
  animation:cflash .5s ease-out forwards}

/* ---------- 젖빛 유리 자동문 ---------- */
.glass{position:absolute;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.gpane{position:absolute;top:0;bottom:0;width:50.6%;
  background:linear-gradient(105deg,rgba(214,234,246,.52),rgba(178,208,230,.44) 40%,rgba(220,238,248,.56));
  border-top:0;transition:transform .42s cubic-bezier(.5,0,.2,1)}
.gpane.l{left:0;border-right:5px solid rgba(120,150,170,.75);
  box-shadow:inset -14px 0 22px rgba(120,155,178,.40)}
.gpane.r{right:0;border-left:5px solid rgba(120,150,170,.75);
  box-shadow:inset 14px 0 22px rgba(120,155,178,.40)}
.glass.open .gpane.l{transform:translateX(-101%)}
.glass.open .gpane.r{transform:translateX(101%)}
.gpane::after{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,.5) 0 3px,rgba(255,255,255,0) 3px 9px)}
.gpane b{position:absolute;top:0;bottom:0;width:13px;background:rgba(255,255,255,.55);
  box-shadow:0 0 14px rgba(255,255,255,.7)}
/* ① 닫힌 문에 물건이 부딪힌 순간 — 유리 위(문 앞)에 튐 자국과 파편이 뜬다.
   유리는 안 깨진다(문이 뚫리면 게임 규칙이 무너진다). 깨지는 건 던진 물건 쪽이다. */
.gsplat{position:absolute;z-index:53;pointer-events:none;width:96px;height:96px;
  margin:-48px 0 0 -48px;animation:gsplat .52s ease-out forwards}
.gsplat svg{width:100%;height:100%;display:block}
@keyframes gsplat{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.25);opacity:0}}
.gshard{position:absolute;z-index:54;pointer-events:none;width:14px;height:14px;margin:-7px 0 0 -7px}
.gshard svg{width:100%;height:100%;display:block}
body.nomotion .gsplat{animation-duration:.001s}
.gpane.l b{right:16px} .gpane.r b{left:16px}

/* ---------- 신호등(언어 0 타이머) ---------- */
.tl{position:absolute;z-index:52;pointer-events:none;width:64px}
.tl svg{width:100%;height:auto;display:block}
.tl .bulbR{transition:fill .16s,filter .16s}
.tl .bulbG{transition:fill .16s,filter .16s}
.tl.red .bulbR{fill:#FF4A3D;filter:drop-shadow(0 0 12px #FF5A4A)}
.tl.red .bulbG{fill:#2E4030}
.tl.green .bulbG{fill:#59E07A;filter:drop-shadow(0 0 12px #59E07A)}
.tl.green .bulbR{fill:#472826}
.tlring{transition:none}

/* ---------- 총·탄창(공용 승계) ---------- */
.gun{position:absolute;bottom:-6px;width:min(13vw,66px);z-index:70;pointer-events:none;
  filter:drop-shadow(0 6px 0 rgba(59,43,58,.2))}
/* v0.9 ⑤(사용자 지시) — 총을 **탄창 바로 옆**으로. 탄창은 right:6px·폭 64px이므로
   그 왼쪽에 붙는다(좁은 화면은 아래 미디어쿼리에서 함께 조정). */
.gun{width:min(17vw,86px)}
.gun.right{right:76px} .gun.left{left:76px}
/* 각도가 스냅하지 않고 스르륵 따라와야 총이 입체로 읽힌다(Spellshot 동일) */
.gunrot{transition:transform .09s ease;transform-origin:50% 92%}
.gun.fire .gunrot svg{animation:gunkick .16s ease-out}
@keyframes gunkick{30%{transform:translateY(13px) scale(.98)}}
.gun .cork{transform-box:fill-box;transform-origin:50% 100%}
.gun.fire .cork{animation:corkpop .18s ease-out}
@keyframes corkpop{40%{transform:translateY(-14px) rotate(-10deg)}}
.gun.reload svg{animation:gundip .34s ease}
@keyframes gundip{25%{transform:translateY(34px) rotate(9deg)}70%{transform:translateY(30px) rotate(7deg)}}
body.nomotion .gun.fire .gunrot svg,body.nomotion .gun.fire .cork{animation:none}
/* ⑤ 물총 — 화약 연기가 아니라 **물보라**다 */
.gunpuff{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  z-index:69;pointer-events:none;
  background:radial-gradient(circle,#EAF9FF 0%,rgba(140,215,240,.62) 52%,rgba(140,215,240,0) 76%);
  animation:puff .42s ease-out forwards}
@keyframes puff{from{transform:scale(.4);opacity:.95}to{transform:scale(1.9) translateY(-26px);opacity:0}}
@keyframes puffout{0%{opacity:.95;scale:.5}100%{opacity:0;scale:1.7}}
.bullet{position:absolute;width:18px;height:14px;z-index:71;pointer-events:none;margin:-7px 0 0 -9px;
  transition:transform .115s linear}
.bulhit{position:absolute;width:22px;height:22px;border-radius:50%;z-index:71;pointer-events:none;
  background:radial-gradient(circle,#EAF9FF,rgba(122,205,235,.55) 46%,rgba(122,205,235,0) 72%);
  transform:translate(-50%,-50%);animation:puffout .26s ease-out forwards}
.reticle{animation:retpop .38s cubic-bezier(.2,1.7,.4,1) forwards;transform-box:fill-box;transform-origin:center}
@keyframes retpop{0%{transform:scale(1.7);opacity:0}30%{transform:scale(1);opacity:1}
  75%{opacity:1}100%{transform:scale(.92);opacity:0}}
.magbtn{position:absolute;bottom:10px;width:64px;height:86px;z-index:71;border:none;background:none;
  cursor:pointer;padding:0;filter:drop-shadow(0 3px 2px rgba(59,43,58,.3))}
.magbtn.right{right:6px} .magbtn.left{left:6px}
.magbtn svg{width:100%;height:auto;display:block}
.magrow{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);display:flex;gap:2px;
  align-items:baseline;background:var(--paper-0);border:2px solid var(--ink);border-radius:9px;padding:1px 6px}
.magrow .num{font-size:.8rem;font-weight:900}
.magrow .magn{font-size:.62rem;font-weight:900;color:var(--ink-soft)}
.magbtn.pop{animation:ammopop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes ammopop{40%{transform:scale(1.16)}}
.magbtn.need .magarrow{opacity:1;animation:arrowbob .7s ease-in-out infinite}
.magarrow{position:absolute;left:50%;top:-104px;width:78px;height:96px;margin-left:-39px;opacity:0}
.magbtn.teach .magarrow{opacity:1;animation:arrowbob .7s ease-in-out 2}
/* v0.6 ④ — 스와이프 장전 연출 */
.swfx{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:120;pointer-events:none;
  width:min(36vw,175px);opacity:.95;filter:drop-shadow(0 6px 0 rgba(59,43,58,.25))}
.swfx svg{width:100%;height:auto;display:block}
.swfx.snap{animation:swsnap .26s ease-out}
@keyframes swsnap{0%{transform:translate(-50%,-50%) translateY(48px) scale(1.35)}
  55%{transform:translate(-50%,-50%) translateY(-16px) scale(1.12)}
  100%{transform:translate(-50%,-50%) scale(1)}}
body.nomotion .swfx.snap{animation:none}
.magarrow .fing{transform-box:fill-box;transform-origin:50% 20%;animation:swipehint 1.5s ease-in-out infinite}
@keyframes swipehint{0%,100%{transform:translateY(0)}30%{transform:translateY(26px)}
  60%{transform:translateY(-6px)}80%{transform:translateY(0)}}
body.nomotion .magarrow .fing{animation:none}
@keyframes arrowbob{50%{transform:translateY(5px)}}

/* ---------- 연출 ---------- */
.toast.top{z-index:960}
/* v0.9.1 ①② — top(높이)과 opacity는 JS가 좀비 배치를 보고 정한다. 고정 22%는 폐기 */
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:80;pointer-events:none;
  animation:toastup .82s ease-out forwards}
/* v0.9.2 §6.2 — 적응형 반투명이 무효였다: placeFX의 **인라인 opacity를 애니메이션이 덮어썼다**.
   최고 불투명도를 --fxop 변수로 뽑아 키프레임이 읽게 한다. */
@keyframes toastup{0%{transform:translate(-50%,14px) scale(.6);opacity:0}
  22%{transform:translate(-50%,0) scale(1.06);opacity:var(--fxop,1)}
  80%{opacity:var(--fxop,1)}100%{transform:translate(-50%,-26px);opacity:0}}
.reloadhint{position:absolute;transform:translate(-50%,-100%);z-index:80;pointer-events:none;
  animation:toastup .9s ease-out forwards}
.callout{position:absolute;left:50%;top:15%;transform:translate(-50%,-50%);z-index:82;pointer-events:none}

.callout.in{animation:callin .66s cubic-bezier(.2,1.6,.4,1) forwards}   /* v0.9.1 ③ — 가리는 시간 단축 */
@keyframes callin{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
  20%{transform:translate(-50%,-50%) scale(1.1);opacity:var(--fxop,1)}
  72%{transform:translate(-50%,-50%) scale(1);opacity:var(--fxop,1)}
  100%{transform:translate(-50%,-64%) scale(.94);opacity:0}}
.itempop{position:absolute;width:52px;height:52px;z-index:78;margin:-26px 0 0 -26px;pointer-events:none;
  animation:itempop 1.15s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes itempop{0%{transform:translateY(0) scale(.5);opacity:0}
  25%{transform:translateY(-22px) scale(1.25);opacity:1}
  75%{transform:translateY(-52px) scale(1);opacity:1}
  100%{transform:translateY(-74px) scale(.8);opacity:0}}
.winflash{position:absolute;inset:0;background:radial-gradient(circle,#FFF6D8 0%,rgba(255,246,216,0) 62%);
  z-index:76;pointer-events:none;animation:cflash .32s ease-out}
@keyframes cflash{0%{opacity:.85}100%{opacity:0}}
.confetti{position:absolute;width:12px;height:9px;z-index:77;pointer-events:none;
  animation:confall 1.45s ease-in forwards}
@keyframes confall{0%{transform:translate(0,0) rotate(0);opacity:1}
  100%{transform:translate(var(--cx),var(--cy)) rotate(var(--cr));opacity:0}}
.starburst{position:absolute;width:200px;height:200px;margin:-100px 0 0 -100px;z-index:77;pointer-events:none}
.sbfly{animation:sbfly .65s ease-out forwards;transform-box:fill-box}
@keyframes sbfly{0%{transform:translate(0,0) scale(.4);opacity:1}
  100%{transform:translate(var(--sx),var(--sy)) scale(1);opacity:0}}
/* 습격 — 화면 흔들림 + 초록 번쩍 + 큰 얼굴 */
.sky.hit .worldg,.sky.hit .bgsvg{animation:jolt .7s ease-out}
@keyframes jolt{0%{transform:none}12%{transform:translate(-26px,7px) rotate(-2.2deg)}
  32%{transform:translate(28px,-5px) rotate(2.4deg)}54%{transform:translate(-13px,4px)}
  76%{transform:translate(9px,-3px)}100%{transform:none}}
.gulp{position:absolute;inset:0;z-index:95;pointer-events:none;
  background:radial-gradient(circle at 50% 52%,rgba(120,220,140,.18),rgba(46,74,54,.72) 82%);
  animation:cflash .8s ease-out forwards}

/* ---------- 화면 공통 ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
.card{background:var(--paper-1);border:3.5px solid var(--ink);border-radius:26px;
  box-shadow:0 7px 0 rgba(59,43,58,.4);padding:22px 26px;display:flex;flex-direction:column;
  align-items:center;gap:12px;max-width:min(92vw,460px)}
.bigbtn{display:flex;align-items:center;gap:9px;font-weight:900;font-size:1.15rem;
  background:var(--butter);border:3.5px solid var(--ink);border-radius:20px;padding:13px 30px;
  box-shadow:0 6px 0 var(--ink);cursor:pointer}
.bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.bigbtn svg{width:30px;height:30px}
/* ④ 예습 3초 자동 진행 게이지 */
.autobar{width:min(60vw,240px);height:9px;border-radius:99px;background:var(--paper-2);
  border:2.5px solid var(--ink);overflow:hidden}
.autobar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--butter),var(--coral));
  transform-origin:left;animation:autoshrink 3s linear forwards}
@keyframes autoshrink{to{transform:scaleX(0)}}
.prept{width:min(52vw,220px)}
.prept svg{width:100%;height:auto;display:block}
.readyov{position:absolute;inset:0;display:grid;place-items:center;z-index:88;pointer-events:none}

.pauseov{position:fixed;inset:0;background:rgba(59,43,58,.55);z-index:200;display:grid;place-items:center}

.modal{position:fixed;inset:0;background:rgba(59,43,58,.45);z-index:150;display:grid;place-items:center}
.mbox{background:var(--paper-0);border:3.5px solid var(--ink);border-radius:22px;padding:20px 22px;
  width:min(88vw,420px);max-height:82vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:1.05rem}
.psub{font-weight:900;font-size:.8rem;color:var(--ink-soft);margin:10px 0 2px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:2px dashed var(--paper-3);font-size:calc(.84rem);font-weight:800}
.prow>span{flex:0 0 66px}
.pbar{flex:1;height:14px;border-radius:99px;background:var(--paper-2);border:2.5px solid var(--ink);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--butter),var(--coral))}
.pseg{display:flex;gap:5px}
.pseg button{font:inherit;font-size:calc(.74rem);font-weight:800;padding:7px 10px;border-radius:11px;
  border:2.5px solid var(--ink);background:var(--paper-1);cursor:pointer;min-height:38px}
.pseg button.on{background:var(--butter)}
.pnote{font-size:calc(.76rem);line-height:1.7;color:var(--ink-soft);margin:14px 0 12px;padding:12px;
  background:var(--paper-1);border-radius:14px}
.prow2{display:flex;gap:9px;justify-content:center}
.pbtn{font:inherit;font-weight:800;padding:10px 18px;border-radius:14px;border:2.5px solid var(--ink);
  background:var(--butter);box-shadow:0 4px 0 var(--ink);cursor:pointer}
/* 좁은 화면 HUD 압축 — 하트 5개 + 카운터가 밀려 잘리던 문제 */
@media (max-width:470px){
  .bar{gap:4px;padding:calc(5px + env(safe-area-inset-top)) 6px 5px}
  .dashrow{gap:5px}
  .ib{width:38px;height:38px;border-radius:11px;padding:5px}
  .bar .ib{width:34px;height:34px;border-radius:10px;padding:4px}
  .hearts{gap:1px} .hearts svg{width:18px;height:18px}
  .cnt{padding:2px 7px 2px 4px;gap:3px} .cnt svg{width:15px;height:15px}
  .cnt .num{font-size:calc(.76rem)}
  .cnt.fixed{width:min(27vw,98px)}
  .timecell{width:min(20vw,74px)}
  .clockwrap{padding:2px 7px 2px 3px;gap:3px} .clock{width:22px;height:22px}
  .cnum{font-size:calc(.84rem)}
  .stars svg{width:18px;height:18px}
  .goal{padding:3px 8px 3px 5px;gap:5px;margin-left:3px} .goal .pic{width:28px;height:28px}
  .slot{width:22px;height:30px}
  .magbtn{width:52px;height:70px}
  .gun.right{right:62px} .gun.left{left:62px}   /* v0.9 ⑤ — 좁은 화면에서도 탄창 옆 유지 */
}
@media (prefers-reduced-motion:reduce){:root{--dur:.001}}
body.nomotion .zombie.walk .bodyg,body.nomotion .zombie.walk .legL,body.nomotion .zombie.walk .legR,
body.nomotion .zombie.walk .armF,body.nomotion .zombie.walk .armB,body.nomotion .zombie.walk .drool{animation:none}

/* ---------- v0.18계 ⑥⑨⑩ — 단어 통계·캐스케이드·진행 점 ---------- */
.wstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:390px;width:94%}
.wcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;
  border:3px solid #3B2B3A;border-radius:14px;background:#FBF3E4;box-shadow:0 4px 0 #3B2B3A}
.wcard.no{opacity:.85;background:#F3E0DC}
.wcard .wic{width:62%}.wcard .wic svg{width:100%;height:auto;display:block}
.wcard .wname{font-weight:900;font-size:13px;color:#3B2B3A}
.wbadge{position:absolute;right:-8px;top:-10px;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;
  border:3px solid #3B2B3A;color:#FBF3E4}
.wbadge.ok{background:#57BE8B}.wbadge.no{background:#E4374B}
.wperf{font-size:9px;font-weight:900;letter-spacing:.4px;color:#7A5A00;background:#FFCE5C;
  border:2px solid #3B2B3A;border-radius:999px;padding:1px 6px;margin-top:1px}
.stPct{font-weight:900;font-size:20px;color:#3B2B3A}

<div id="app"></div>
<script>
"use strict";
/* ====================== 저장(전 게임 공유 키) ====================== */
const KEY="wordborn_mg_r1_v0";
const HEART_MAX_BASE=5, HEART_CAP=8, REGEN_MS=20*60*1000;
const MAG_SIZE=25;
const blankSave=()=>({v:1,
  hearts:HEART_MAX_BASE, bonusHearts:0, lastRegen:0,
  ink:0, seeds:0, seen:{},
  stat:{spell:0,read:0,mean:0,mem:0,ref:0,listen:0},
  best:0,
  ammo:25, mags:9,
  set:{sfx:1,voice:1,motion:1,ui:1,lefty:0}});
let storageOK=true;
function load(){let s=null;
  try{const r=localStorage.getItem(KEY); if(r)s=JSON.parse(r);}catch(e){storageOK=false;}
  if(!s||s.v!==1)s=blankSave();
  const b=blankSave(); for(const k in b) if(s[k]==null) s[k]=b[k];
  s.set=Object.assign(b.set,s.set||{}); s.stat=Object.assign(b.stat,s.stat||{});
  return s;}
/* v테스트 ①(사용자 지시, 8/18) — 테스트 버전: 새로 로드할 때마다 저장을 지우고 초기화한다 */
try{localStorage.removeItem(KEY);}catch(e){}
let SAVE=load();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){storageOK=false;}};
const heartCap=()=>Math.min(HEART_CAP,HEART_MAX_BASE+SAVE.bonusHearts);
function regen(now){
  const cap=heartCap();
  if(SAVE.hearts>=cap){SAVE.lastRegen=now;return;}
  if(!SAVE.lastRegen){SAVE.lastRegen=now;return;}
  const n=Math.floor((now-SAVE.lastRegen)/REGEN_MS);
  if(n>0){SAVE.hearts=Math.min(cap,SAVE.hearts+n); SAVE.lastRegen+=n*REGEN_MS; persist();}
}
function applySet(){
  document.documentElement.style.setProperty("--ui",[.92,1,1.14][SAVE.set.ui]||1);
  document.documentElement.style.setProperty("--dur",SAVE.set.motion?1:.001);
  document.body.classList.toggle("nomotion",!SAVE.set.motion);
}
const NS="http://www.w3.org/2000/svg";
const INK="#3B2B3A", PAPER="#FBF3E4";
const CSSV=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function E(t,a,k){const n=document.createElementNS(NS,t);
  if(a)for(const x in a){if(a[x]!=null)n.setAttribute(x,a[x]);}
  if(k)k.forEach(c=>c&&n.appendChild(c));return n;}
function H(t,a,k){const n=document.createElement(t);
  if(a)for(const x in a){ if(x==="html")n.innerHTML=a[x]; else if(x==="text")n.textContent=a[x];
    else if(x==="on")for(const e in a[x])n.addEventListener(e,a[x][e]); else if(a[x]!=null)n.setAttribute(x,a[x]); }
  if(k)k.forEach(c=>c&&n.appendChild(c));return n;}
const hx=c=>{c=c.replace("#","");return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];};
const rgbs=a=>"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const shade=(c,f)=>rgbs(hx(c).map(v=>v*(1-f)));
const tint =(c,f)=>rgbs(hx(c).map(v=>v+(255-v)*f));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];}return a;};

/* ====================== 소리(공용 승계) ====================== */
const Snd={ctx:null,
  init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C();}catch(e){}},
  t(f,d,ty,v){if(!SAVE.set.sfx)return;this.init();const c=this.ctx;if(!c)return;
    try{if(c.state==="suspended")c.resume();
      const o=c.createOscillator(),g=c.createGain();o.type=ty||"sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(v||.15,c.currentTime+.012);
      g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(d||.18));

  tap(){this.t(660,.1,"triangle",.11)},
  no(){this.t(190,.2,"square",.1)},
  soft(){this.t(392,.16,"sine",.08)}};
const Cue2={
  wrong(){Snd.t(160,.26,"square",.10); setTimeout(()=>Snd.t(110,.3,"sawtooth",.08),110);},
  word(){[659,784,988,1319].forEach((f,i)=>setTimeout(()=>Snd.t(f,.28,"triangle",.13),i*90));},
  gold(){[784,1046,1319,1568,2093].forEach((f,i)=>setTimeout(()=>Snd.t(f,.34,"sine",.12),i*70));},
  combo(n){Snd.t(500+Math.min(n,10)*90,.12,"triangle",.10);},
  ready(){Snd.t(392,.3,"sine",.09); setTimeout(()=>Snd.t(523,.34,"sine",.09),260);},
  beat(){Snd.t(660,.09,"square",.09); setTimeout(()=>Snd.t(440,.12,"sine",.07),70);},
  go(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>Snd.t(f,.2,"triangle",.14),i*70));},
  snap(){Snd.t(1568,.06,"triangle",.11); setTimeout(()=>Snd.t(2093,.09,"sine",.08),50);},

    const go=()=>{ const u=new SpeechSynthesisUtterance(t);
      u.lang="en-US"; u.pitch=1.85; u.rate=.8;
      speechSynthesis.cancel(); speechSynthesis.speak(u); };
    if(speechSynthesis.getVoices().length===0){
      let done=false;
      const h=()=>{ if(done)return; done=true;
        try{speechSynthesis.removeEventListener("voiceschanged",h);}catch(e){}
        go(); };
      try{speechSynthesis.addEventListener("voiceschanged",h);}catch(e){}
      setTimeout(h,700);
    } else go();
  }catch(e){}}

/* ⑤ 천 단위 약자 — 1000부터 K, 100만부터 M, 10억부터 B.
   10 미만이면 소수 한 자리(3.6K), 그 이상이면 정수(36K)라 최대 5자다. */
function fmtNum(n){
  n=Math.max(0,Math.round(Number(n)||0));
  const U=[[1e9,"B"],[1e6,"M"],[1e3,"K"]];
  for(const u of U){
    if(n>=u[0]){ const x=n/u[0]; return (x<10?x.toFixed(1):String(Math.round(x)))+u[1]; }
  }
  return String(n);
}

  /* 폰: 흔들기 장전(iOS는 권한이 필요해 첫 터치 때 요청 — 실패 시 잔탄계 탭이 보조 수단) */
  function onMotion(e){
    const a=e.accelerationIncludingGravity; if(!a||a.x==null)return;
    if(lastAcc){ const d=Math.abs(a.x-lastAcc.x)+Math.abs(a.y-lastAcc.y)+Math.abs(a.z-lastAcc.z);
      const now=Date.now();
      if(d>24&&now-shakeT>1200){ shakeT=now; reload(); } }
    lastAcc={x:a.x,y:a.y,z:a.z};
  }
  /* ⑧ 플립 장전 — 폰을 뒤집었다 되돌리면(beta 급반전) 장전. 흔들기와 함께 동작 */
  let flipT=0, wasFlipped=false;
  function onOrient(e){
    if(e.beta==null)return;
    const flipped=Math.abs(e.beta)>140||Math.abs(e.gamma||0)>140;
    const now=Date.now();
    if(wasFlipped&&!flipped&&now-flipT<2500){ reload(); flipT=0; }
    if(flipped&&!wasFlipped)flipT=now;
    wasFlipped=flipped;
  }
  try{ if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=="function")
    window.addEventListener("deviceorientation",onOrient); }catch(e){}
  try{
    if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==="function"){
      const ask=()=>{DeviceMotionEvent.requestPermission().then(st=>{
        if(st==="granted"){window.addEventListener("devicemotion",onMotion);
          window.addEventListener("deviceorientation",onOrient);}}).catch(()=>{});
        document.removeEventListener("touchstart",ask);};
      document.addEventListener("touchstart",ask,{passive:true});
    } else if(window.DeviceMotionEvent) window.addEventListener("devicemotion",onMotion);
  }catch(e){}
  return {el, reload,
    tryFire(x,y){
      if(reloading)return false;
      if(SAVE.ammo<=0){ Snd.t(340,.06,"square",.09); hint("RELOAD!");
        say("Reload!");
        const mb=document.getElementById("magBtn");
        if(mb){mb.classList.add("need");}
        return false; }
      SAVE.ammo-=1; persist();
      if(onAmmo)onAmmo();
      const m=muzzlePx();
      const ang=Math.max(-16,Math.min(16,Math.atan2(x-m.x,Math.max(60,m.y-y))*180/Math.PI*.5));
      rot.style.transform=`rotate(${ang.toFixed(1)}deg)`;
      el.classList.remove("fire"); void el.offsetWidth; el.classList.add("fire");
      const now=Date.now(); if(now-puffT>90){ puffT=now;
        const p=H("div",{class:"gunpuff"});
        p.style.left=m.x+"px"; p.style.top=m.y+"px";
        sky.appendChild(p); setTimeout(()=>p.remove(),450); }
      /* 물방울이 총구에서 탭 지점까지 실제로 날아간다(로직·속도 동일, 그림만 물방울) */
      const b=H("div",{class:"bullet"});
      const bs=E("svg",{viewBox:"-10 -10 20 20",xmlns:NS,style:"width:100%;height:100%;display:block"});
      /* v0.7 ① — 날아가는 것도 코르크 */
      bs.appendChild(E("path",{d:"M-4.5 -3H4.5V7Q4.5 10 0 10Q-4.5 10 -4.5 7Z",
        fill:"#D9A05B",stroke:INK,"stroke-width":3,"stroke-linejoin":"round"}));
      bs.appendChild(E("ellipse",{cx:0,cy:-4.5,rx:7,ry:4.5,fill:"#E4B678",stroke:INK,"stroke-width":3}));
      b.appendChild(bs);
      b.style.left=m.x+"px"; b.style.top=m.y+"px";
      sky.appendChild(b);
      requestAnimationFrame(()=>{b.style.transform=
        `translate(${(x-m.x).toFixed(0)}px,${(y-m.y).toFixed(0)}px) scale(.5)`;});
      setTimeout(()=>{ b.remove();
        const hp=H("div",{class:"bulhit"});
        hp.style.left=x+"px"; hp.style.top=y+"px";
        sky.appendChild(hp); setTimeout(()=>hp.remove(),260); },115);
      if(SAVE.ammo===0)hint("RELOAD!");
      return true;
    }};
}

let PAUSED=false, pauseOv=null;
function setPaused(on){
  if(on===PAUSED)return; PAUSED=on;
  document.body.classList.toggle("paused",on);
  if(on){ if(SCREEN==="play"&&!pauseOv){
      pauseOv=H("div",{class:"pauseov"},[shoutNode("PAUSE","#FFD45C")]);
      document.body.appendChild(pauseOv); }
    try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
  } else { if(pauseOv){pauseOv.remove(); pauseOv=null;} }
}
window.addEventListener("blur",()=>setPaused(true));
window.addEventListener("focus",()=>setPaused(false));
document.addEventListener("visibilitychange",()=>setPaused(document.hidden));

/* 카드 뒷면 = 찐스쿨 브랜드 마크(사용자 확정: 브랜드 마크라 "모국어 0"의 예외).
   원본 로고를 종이컷 문법으로 재현 — 원형 테두리 + 앰버 호 + 기하 자모 + SCHOOL. */
const LOGO_NAVY="#1E2A38", LOGO_AMBER="#E8B012";
function logoBackSVG(){
  const s=E("svg",{viewBox:"0 0 200 200",xmlns:NS});
  /* 링 두 조각 — .lring 은 "원 자체"라 안쪽 검사(§로고 검사)에서 제외한다 */
  s.appendChild(E("circle",{class:"lring",cx:100,cy:100,r:91,fill:"#FFFFFF",
    stroke:LOGO_NAVY,"stroke-width":7}));
  /* 링 오른쪽 아래의 앰버 구간 */
  s.appendChild(E("path",{class:"lring",d:"M182.5 138.4A91 91 0 0 1 156.0 171.6",fill:"none",
    stroke:LOGO_AMBER,"stroke-width":7,"stroke-linecap":"round"}));
  /* ★ 자모 묶음 — 원본과 대조해 **위로 8단위 올리고 ㄴ 획을 줄였다**.
     v0.2까지는 ㄴ 획 아래끝이 148.5라 SCHOOL(윗선 149)과 **맞닿아** 있었고
     오른끝이 155.5로 링(91)에 바짝 붙었다. 원본은 ㄴ 아래끝 143 · 오른끝 147이다. */
  const g=E("g",{fill:"none","stroke-width":19,"stroke-linecap":"round","stroke-linejoin":"round"});
  g.appendChild(E("path",{d:"M50 52H84",stroke:LOGO_AMBER}));
  g.appendChild(E("path",{d:"M78 52V89Q78 101 66 101Q56 101 53 92",stroke:LOGO_AMBER}));
  g.appendChild(E("path",{d:"M84 52H120",stroke:LOGO_NAVY}));
  g.appendChild(E("path",{d:"M112 52V83Q112 95 100 95Q90 95 87 86",stroke:LOGO_NAVY}));
  g.appendChild(E("path",{d:"M142 52V95",stroke:LOGO_NAVY}));
  g.appendChild(E("path",{d:"M76 116V133H138",stroke:LOGO_NAVY}));
  s.appendChild(g);
  /* ★ SCHOOL — v0.2까지 font-size 31·y 180이라 글자 폭이 **155 단위**(원 지름의 85%)로
     불어나 링을 25.6 단위 뚫고 나갔다(사용자 제보 "브랜드 로고가 깨지면 안 되잖아").
     원본 로고에서 SCHOOL은 원 지름의 **약 46%**다.
     ★ `textLength` + `lengthAdjust`로 폭을 **95 단위에 못 박는다** — 기기마다 대체 글꼴이
       달라 폭이 흔들리는 문제까지 함께 막힌다(글꼴이 없어도 원 안에 들어온다). */
  const t=E("text",{x:100,y:167,"text-anchor":"middle","font-size":21,"font-weight":"800",
    textLength:95,lengthAdjust:"spacingAndGlyphs",fill:LOGO_NAVY,
    "font-family":"Arial Rounded MT Bold,Baloo 2,Pretendard,system-ui,sans-serif"});
  t.textContent="SCHOOL";
  s.appendChild(t);
  return s;
}



/* ══════════════════════════════════════════════════════════════════════

   ----------------------------------------------------------------------
   v0.1의 "2층 투시 집"은 베이지 방 8칸 + 평평한 잔디라 그림이 죽어 있었다
   (사용자 지적 "배경이 다른 미니게임에 비해 너무 재미없어").
   ★ 축제 사격 부스를 고른 이유:
     ① **총 메커닉이 이야기로 설명된다** — 원래 총을 쏘는 곳이다
     ② 경품 선반 2단이 곧 **2행 4열 카드 배치** — 방 8칸보다 훨씬 시원하다

     ④ 깜빡이는 전구·도는 관람차·펄럭이는 깃발 — 움직일 자리가 많다
   ★ 측정값(BX·BW·fH·BY·BH)은 그대로 쓴다 — 카드 배치 코드 무변경.
   ══════════════════════════════════════════════════════════════════════ */
/* 관찰 구간의 목표칸 — 아직 목표를 밝히지 않는다(밝히면 8장을 볼 이유가 사라진다).

const BOOTH = {
  wood:"#B9814E", woodD:"#95643A", woodL:"#D9A469",
  post:"#E8556E", cream:"#FFF3DE", awn:"#E8556E",
  wall:"#3E2F63", wallS:"#4E3B78", night:"#241C3C",
  bulb:"#FFE9A8", bulbOff:"#8F7FA8", tent:"#7B5FA8", boardw:"#6B4A78"
};

function boothParts(g, BX, BY, BW, BH, fH, W, Hp){
  const A=(t,at)=>{const el=E(t,at); g.appendChild(el); return el;};
  const gy=BY+BH;                       /* 부스 바닥선(아래 선반) */
  const cw=BW/4;
  const N=(v)=>(+v).toFixed(1);

  /* ── 1) 밤하늘 별 ── */
  for(let i=0;i<26;i++){
    const sx=((i*97+31)%100)/100*W, sy=((i*61+13)%100)/100*(BY*0.78), r=1.3+((i*37)%3)*0.9;
    A("circle",{cx:N(sx),cy:N(sy),r:N(r),fill:"#FFF6D8",
      opacity:(0.4+((i*29)%5)*0.12).toFixed(2)});
  }
  /* ── 2) 관람차 — 오른쪽 뒤에서 천천히 돈다 ── */
  const fwr=Math.min(BY*.30,W*.20), fwx=W*.80, fwy=BY*.44;
  A("path",{d:`M${N(fwx-fwr*.5)} ${N(BY*.96)}L${N(fwx)} ${N(fwy)}L${N(fwx+fwr*.5)} ${N(BY*.96)}`,
    fill:"none",stroke:BOOTH.tent,"stroke-width":5,"stroke-linecap":"round",opacity:.9});
  const wheel=E("g",{class:"fw6",style:`transform-origin:${N(fwx)}px ${N(fwy)}px`});
  wheel.appendChild(E("circle",{cx:N(fwx),cy:N(fwy),r:N(fwr),fill:"none",stroke:BOOTH.tent,"stroke-width":5,opacity:.95}));
  wheel.appendChild(E("circle",{cx:N(fwx),cy:N(fwy),r:N(fwr*.5),fill:"none",stroke:BOOTH.tent,"stroke-width":3.5,opacity:.7}));
  for(let i=0;i<8;i++){ const a2=i*Math.PI/4;
    const ex=fwx+Math.cos(a2)*fwr, ey=fwy+Math.sin(a2)*fwr;
    wheel.appendChild(E("path",{d:`M${N(fwx)} ${N(fwy)}L${N(ex)} ${N(ey)}`,
      stroke:BOOTH.tent,"stroke-width":3.5,opacity:.8}));
    wheel.appendChild(E("circle",{cx:N(ex),cy:N(ey),r:5,
      fill:i%2?"#FFB3C0":BOOTH.bulb,stroke:BOOTH.night,"stroke-width":2.5,opacity:.98}));
  }
  g.appendChild(wheel);
  /* ── 3) 텐트 지붕 — 왼쪽 뒤 ── */
  (BY<Hp*.24 ? [[.11,.8]] : [[.11,1],[.28,.72]]).forEach(([fx,sc])=>{
    const tx=W*fx, tw=W*.115*sc, th=BY*.30*sc, base=BY*.96;
    A("path",{d:`M${N(tx-tw)} ${N(base)}L${N(tx)} ${N(base-th)}L${N(tx+tw)} ${N(base)}Z`,
      fill:BOOTH.tent,stroke:BOOTH.night,"stroke-width":3.5,opacity:.92});
    for(let k=-1;k<=1;k+=2)A("path",{d:`M${N(tx)} ${N(base-th)}L${N(tx+tw*k*.5)} ${N(base)}`,
      stroke:"#9C7ECC","stroke-width":3,opacity:.85});
    A("path",{d:`M${N(tx)} ${N(base-th)}v${N(-BY*.05)}`,stroke:BOOTH.tent,"stroke-width":3,"stroke-linecap":"round"});
    A("circle",{cx:N(tx),cy:N(base-th-BY*.062),r:3.5,fill:BOOTH.bulb,class:"blb","data-i":2});
  });

  /* ── 4) 전구 줄 — 하늘을 가로질러 늘어져 깜빡인다 ── */
  const ly=BY*.16, sag=BY*.20;
  A("path",{d:`M-6 ${N(ly)}Q${N(W*.5)} ${N(ly+sag)} ${N(W+6)} ${N(ly)}`,
    fill:"none",stroke:"#6A5788","stroke-width":3.5});
  for(let i=0;i<=7;i++){
    const t=i/7, bx=W*t;
    const by=ly*(1-t)*(1-t)+(ly+sag)*2*t*(1-t)+ly*t*t;
    A("path",{d:`M${N(bx)} ${N(by)}v${N(BY*.028)}`,stroke:"#6A5788","stroke-width":3});
    A("circle",{cx:N(bx),cy:N(by+BY*.052),r:5.5,class:"blb","data-i":i%4,
      fill:[BOOTH.bulb,"#FFB3C0","#9FE8D4","#FFC97A"][i%4],stroke:INK,"stroke-width":2.5});
  }

  /* ── 5) 축제 바닥 — 널판 보도 ── */
  const bwY=gy+Math.max(10,(Hp-gy)*.34);
  A("rect",{x:-4,y:N(bwY),width:W+8,height:N(Hp-bwY+10),fill:BOOTH.boardw});
  A("rect",{x:-4,y:N(bwY),width:W+8,height:7,fill:"#8A6294"});
  for(let i=0;i<=8;i++)A("path",{d:`M${N(W*i/8)} ${N(bwY+6)}V${Hp+8}`,
    stroke:"#573C63","stroke-width":3,opacity:.7});

  /* ── 6) 부스 뒷판 — 사탕 줄무늬(방 8칸보다 시원하다) ── */
  A("rect",{x:N(BX),y:N(BY),width:N(BW),height:N(BH),rx:8,fill:BOOTH.wall,stroke:INK,"stroke-width":7});
  const sw=BW/9;
  for(let i=1;i<9;i+=2)A("rect",{x:N(BX+sw*i),y:N(BY+4),width:N(sw),height:N(BH-8),fill:BOOTH.wallS});
  A("rect",{x:N(BX+4),y:N(BY+4),width:N(BW-8),height:N(BH*.05),fill:"#2A2049",opacity:.55});

  /* ── 7) 카운터 — 부스 앞판(아래 선반 밑). 부스가 땅에 붙는다 ── */
  const ch=bwY-gy+6;
  if(ch>8){
    A("rect",{x:N(BX-W*.010),y:N(gy),width:N(BW+W*.020),height:N(ch),rx:6,
      fill:BOOTH.awn,stroke:INK,"stroke-width":6});
    const nc=6, cwd=(BW+W*.020)/nc;
    for(let i=0;i<nc;i+=2)A("rect",{x:N(BX-W*.010+cwd*i),y:N(gy+4),width:N(cwd),height:N(ch-8),fill:BOOTH.cream});
    A("rect",{x:N(BX-W*.022),y:N(gy-4),width:N(BW+W*.044),height:11,rx:5,
      fill:BOOTH.wood,stroke:INK,"stroke-width":5});
  }

  /* ── 8) 선반판 2단 — 카드가 이 선 위에 선다(fH 그대로) ── */
  for(let f=0;f<2;f++){
    const y=BY+fH*(f+1);
    A("rect",{x:N(BX-W*.018),y:N(y-7),width:N(BW+W*.036),height:14,rx:5,
      fill:BOOTH.wood,stroke:INK,"stroke-width":5});
    A("rect",{x:N(BX-W*.018+3),y:N(y-4.5),width:N(BW+W*.036-6),height:4,rx:2,fill:BOOTH.woodL,opacity:.75});
    if(f===0)for(let c=1;c<4;c++)A("circle",{cx:N(BX+cw*c),cy:N(y+10),r:4,
      class:"blb","data-i":c,fill:BOOTH.bulb,stroke:INK,"stroke-width":2.5});
  }

  /* ── 9) 좌우 기둥 — 사탕 지팡이 줄무늬 ── */
  [BX-W*.030, BX+BW+W*.002].forEach(px=>{
    const pw=W*.028;
    A("rect",{x:N(px),y:N(BY-8),width:N(pw),height:N(BH+ (ch>8?ch:0) +14),rx:6,
      fill:BOOTH.cream,stroke:INK,"stroke-width":5});
    const tot=BH+(ch>8?ch:0), n=Math.max(5,Math.round(tot/24));
    for(let i=0;i<n;i++)A("path",{
      d:`M${N(px)} ${N(BY+tot*(i+.15)/n)}l${N(pw)} ${N(-tot/n*.55)}`,
      stroke:BOOTH.post,"stroke-width":6,opacity:.95});
    A("rect",{x:N(px),y:N(BY-8),width:N(pw),height:N(tot+14),rx:6,
      fill:"none",stroke:INK,"stroke-width":5});
  });

  /* ── 10) 차양 — 스캘럽 줄무늬 + 과녁 엠블럼(사격 부스라는 표시, 글자 없이) ── */
  const ah=Math.max(16,BY*.16), ay=BY-ah-Math.max(6,BY*.05);
  const ax0=BX-W*.058, ax1=BX+BW+W*.058;
  A("path",{d:`M${N(ax0)} ${N(ay)}H${N(ax1)}L${N(ax1-W*.014)} ${N(ay+ah)}H${N(ax0+W*.014)}Z`,
    fill:BOOTH.cream,stroke:INK,"stroke-width":6,"stroke-linejoin":"round"});
  const nb=8, bwd=(ax1-ax0)/nb;
  for(let i=0;i<nb;i+=2)A("path",{
    d:`M${N(ax0+bwd*i)} ${N(ay)}h${N(bwd)}l${N(-W*.014)} ${N(ah)}h${N(-bwd)}Z`,fill:BOOTH.awn});
  const ix0=ax0+W*.014, ix1=ax1-W*.014;
  for(let i=0;i<nb;i++){
    const sx0=ix0+(ix1-ix0)*i/nb, sx1=ix0+(ix1-ix0)*(i+1)/nb;
    A("path",{d:`M${N(sx0)} ${N(ay+ah)}Q${N((sx0+sx1)/2)} ${N(ay+ah+ah*.55)} ${N(sx1)} ${N(ay+ah)}Z`,
      fill:i%2?BOOTH.awn:BOOTH.cream,stroke:INK,"stroke-width":4,"stroke-linejoin":"round"});
  }
  A("path",{d:`M${N(ax0)} ${N(ay)}H${N(ax1)}`,stroke:INK,"stroke-width":6,"stroke-linecap":"round"});
}

/* ══════════════════════════════════════════════════════════════════════
   v0.4 — 배경 아이템: **풍선에 매달린 경품**(사용자 지시)
   ----------------------------------------------------------------------
   카드에서 아이템 쌍을 뺐으므로 획득 경로를 배경으로 옮긴다.
   ★ MG6의 곤충과 **같은 문법**이다 — 운반체가 지나가고, 쏘면 획득, 무벌.
     두 게임이 같은 규칙을 쓰면 아이가 한 번만 배운다.
   ★ 풍선은 **밤하늘(부스 위)** 을 지난다. 카드와 세로로 안 겹치므로
     MG6에서 겪은 "운반체가 표적 클릭을 가로챈다" 문제가 구조적으로 없다.
   ══════════════════════════════════════════════════════════════════════ */
const BALLOON_COLS=["#FF7A8E","#FFC65C","#6FD9C0","#8FB8F0","#C39BF5"];
function balloonSVG(col, itemKind){
  const s=E("svg",{viewBox:"0 0 76 132",xmlns:NS});
  const c=col||BALLOON_COLS[0];
  /* 풍선 몸통 + 하이라이트 + 매듭 */
  s.appendChild(E("path",{d:"M38 6C56 6 68 20 68 38C68 56 52 72 38 80C24 72 8 56 8 38C8 20 20 6 38 6Z",
    fill:c,stroke:INK,"stroke-width":5,"stroke-linejoin":"round"}));
  s.appendChild(E("path",{d:"M22 24Q17 34 19 44",fill:"none",stroke:"#FFFFFF","stroke-width":5,
    "stroke-linecap":"round",opacity:.75}));
  s.appendChild(E("path",{d:"M32 80L38 88L44 80Z",fill:shade(c,.2),stroke:INK,"stroke-width":4,
    "stroke-linejoin":"round"}));
  /* 실 */
  s.appendChild(E("path",{d:"M38 88Q34 94 38 98",fill:"none",stroke:INK,"stroke-width":3}));
  /* 매달린 경품 — 실제 아이템 그림을 그대로 쓴다(획득물과 그림이 같아야 한다) */
  /* itemSVG는 viewBox 0 0 64 64다 — 중심을 (32,32)로 잡아야 실 끝에 매달린다 */
  const box=E("g",{transform:"translate(38,108) scale(0.78)"});
  const it=itemSVG(itemKind);
  if(it){ const inner=E("g",{transform:"translate(-32,-32)"});
    while(it.firstChild)inner.appendChild(it.firstChild);
    box.appendChild(inner); }
  s.appendChild(box);
  return s;
}

function scrPlay(){
  clearAll(); SCREEN="play"; regen(Date.now());
  const stageWords=shuf(WORDS.slice()).slice(0,ROUNDS);
  /* ★ v0.3 — 라운드 → **판(board)** 구조(사용자 확정).
     한 판(8장)의 pre-study에서 단어 3쌍을 다 가르치므로, 그 판에서 **여러 문제**를 낸다.
     7단어를 최대한 고르게 나눈다 → 3·2·2. (3·3·1은 마지막 판이 1문제라 김이 빠진다.) */
  const BOARDS=(function(){
    const n=Math.ceil(ROUNDS/WORD_PAIRS), out=[]; let i=0;
    for(let b=0;b<n;b++){
      const take=Math.ceil((ROUNDS-i)/(n-b));
      out.push(stageWords.slice(i,i+take)); i+=take;
    }
    return out;                              /* 7 → [3,2,2] */
  })();
  let score=0;
  const wordLog=[]; let wordT0=0;
  function finishStage(){
    for(let i2=wordLog.length;i2<stageWords.length;i2++){const qq=stageWords[i2]; wordLog.push({k:qq.k,w:qq.w,ok:false});}
    scrResult(wordLog.filter(x=>x.ok).length/Math.max(1,wordLog.length)>=.6, score, wordLog);
  }

  /* ---------- HUD = 대시보드 2행 (MG3 v0.9.2 정본 그대로 · 부품·순서·수치 동일) ---------- */
  const bar=H("div",{class:"bar"});
  const rowT=H("div",{class:"dashrow top"});
  const rowB=H("div",{class:"dashrow bot"});
  const homeBtn=ibtn("home",wbHome); homeBtn.id="playHome";
  rowT.appendChild(homeBtn);
  const hearts=H("div",{class:"hearts",id:"hearts"}); rowT.appendChild(hearts);
  rowT.appendChild(H("div",{class:"cnt fixed"},[icoSVG("score"),H("b",{class:"num",id:"scoreN",text:"0"})]));
  const inkBox=H("div",{class:"cnt fixed",id:"inkBox"},[icoSVG("ink"),H("b",{class:"num",text:fmtNum(SAVE.ink)})]);
  rowT.appendChild(inkBox);
  rowT.appendChild(ibtn("gear",parentPanel));
  const clk=simpleClock();
  const clockBox=H("div",{class:"clock",id:"clock"}); clockBox.appendChild(clk.svg);
  const cnum=H("b",{class:"cnum",id:"cnum",text:"--"});
  const clockWrap=H("div",{class:"clockwrap"},[clockBox,cnum]);
  rowB.appendChild(H("div",{class:"timecell"},[clockWrap]));
  bar.appendChild(rowT); bar.appendChild(rowB);
  app.appendChild(bar);
  let clkLast=-1;
  /* 시계는 지금 국면의 남은 시간을 그대로 읽는다(관찰 8초 · 사격 6초) */
  function updClock(){
    let p=1, sec=0, on=false;
    if(R.phase==="peek"){ p=clamp(R.peekLeft/PEEK_SEC,0,1); sec=Math.ceil(Math.max(0,R.peekLeft)); on=true; }
    else if(R.phase==="hunt"){ p=clamp(R.huntLeft/HUNT_SEC,0,1); sec=Math.ceil(Math.max(0,R.huntLeft)); on=true; }
    clk.set(p);
    const t=on?String(sec):"--";
    if(t!==cnum.textContent){
      cnum.textContent=t;
      if(on&&sec<=1&&clkLast>sec)clk.burst();
      clkLast=sec;
    }
  }
  function updHearts(){ hearts.innerHTML="";
    hearts.appendChild(icoSVG(SAVE.hearts>0?"heart":"heartOff"));
    hearts.appendChild(H("b",{class:"hx",text:"×"+SAVE.hearts}));
    hearts.classList.toggle("zero",SAVE.hearts<=0); }
  function updScore(){ const n=document.getElementById("scoreN"); if(n)n.textContent=fmtNum(score);
    inkBox.querySelector(".num").textContent=fmtNum(SAVE.ink); }
  updHearts();

  /* ---------- 필드 ---------- */
  const sky=H("div",{class:"sky"});
  const bg=E("svg",{class:"bgsvg"});
  const houseG=E("g");
  bg.appendChild(houseG);
  sky.appendChild(bg);
  const worldg=H("div",{class:"worldg"}); sky.appendChild(worldg);
  const fx=E("svg",{class:"fx"}); sky.appendChild(fx);
  /* 목표 = 단어 그림 하나(.gword — MG2·MG4와 같은 부품). 철자판 안에 상자를 두지 않는다 */
  const goal=H("div",{class:"goal"}); rowB.appendChild(goal);
  const wtrack=H("div",{class:"wtrack",id:"wtrack",style:"--pg-ok:#F5C542"}); rowB.appendChild(wtrack);
  app.appendChild(sky);
  const gun=buildGun(sky,updAmmoHUD);
  const magBtn=buildMagBtn(); sky.appendChild(magBtn);
  buildReloadCue(sky);
  magBtn.addEventListener("pointerdown",e=>{e.stopPropagation();
    const cue=document.getElementById("reloadCue");
    if(cue){cue.classList.add("on"); setTimeout(updAmmoHUD,1400);} });

  /* ---------- 상태 ---------- */
  const R={phase:"idle",round:0,word:null,cards:[],sel:[],
           board:0,qIdx:0,qList:[],balloons:[],
           peekLeft:0,huntLeft:0,fails:0,miss:0,busy:false};
  window.__MG5=R;

  /* ---------- 측정 + 축제 경품 부스 ---------- */
  let W=0,Hp=0,BX=0,BY=0,BW=0,BH=0,fH=0,cw=0,cardW=0,cardH=0,fieldRO=null;
  function measure(){
    const r=sky.getBoundingClientRect();
    if(!r.width||!r.height)return;
    if(Math.abs(r.width-W)<.5&&Math.abs(r.height-Hp)<.5)return;
    W=r.width; Hp=r.height;
    fx.setAttribute("viewBox",`0 0 ${W} ${Hp}`);
    bg.setAttribute("viewBox",`0 0 ${W} ${Hp}`);
    /* 카드 크기에서 층 높이를 거꾸로 잡는다 — 방이 카드보다 훨씬 크면 건물이 텅 비어 보인다 */
    BX=W*.023; BW=W*.954; cw=BW/4;
    cardW=cw*.93; cardH=cardW*1.50;
    /* ★ v0.4 — 층 높이를 **카드 기준**으로 잡는다.
       v0.3까지는 `fH = 동물키 × 1.06 = 카드높이 × 1.70`이라 **선반의 70%가 동물 머리 공간**이었다.
       동물을 없앴으니 카드 위 여유만 남기면 된다 → 그만큼이 통째로 **밤하늘로 간다**
       (하늘 132 → 약 280px. 풍선이 날아다닐 자리가 저절로 생긴다). */
    fH=cardH*1.16; BH=fH*2;
    /* ★ v0.2 — 부스를 **아래로 붙이고 위를 전부 밤하늘로 준다**.
       v0.1은 BY를 6.8%로 못 박아 하늘이 46px밖에 안 남았고(관람차·전구줄이 화면 밖),
       대신 부스 아래에 237px짜리 빈 잔디가 깔렸다. 위아래를 맞바꾼다. */
    /* ★ 아래 여백은 **0.22 밑으로 내리면 안 된다** — 첫 시도에 0.155로 줬더니
       아래 칸 카드가 총·탄창 위로 내려와 **탭이 총에 먹혔다**(아이템 짝을 못 맞춤).
       스위트 20번(카드 하단 ≤ 0.78)이 그대로 잡아냈다. */
    const botPad=Hp*.22;                /* 아래 — 총·탄창 자리(불변) */
    const skyMin=Hp*.17;                /* 위 — 밤하늘 최소치(관람차·전구줄) */
    const maxB=Hp-botPad-skyMin;
    if(BH>maxB){ const k=maxB/BH; BH*=k; fH*=k; cardH*=k; cardW=cardH/1.50; }
    BY=Hp-botPad-BH;
    drawHouse(); layoutCards();
  }
  /* ★ v0.2 — 배경을 **밤의 축제 경품 사격 부스**로 교체(사용자 지적 "배경이 재미없어").
     측정값(BX·BW·fH·BY·BH)은 그대로라 카드 배치 코드는 한 줄도 안 바뀐다.
     선반판 2단이 곧 카드 2행이고, 카드는 예전처럼 선반 위에 선다. */
  function drawHouse(){
    houseG.innerHTML="";
    boothParts(houseG,BX,BY,BW,BH,fH,W,Hp);
  }

  /* ---------- 카드 8장 = 단어 3쌍(단어+그림) + **아이템 1쌍**(같은 아이템 2장) ----------
     ★ v0.3 — 이 판에서 낼 문제 단어들을 먼저 넣고, 3쌍이 안 되면 다른 단어로 채운다.
       채움 단어는 **미끼**다(pre-study에서 같이 배우지만 문제로는 안 나온다). */
  function buildBoard(bi){
    R.board=bi; R.qList=BOARDS[bi].slice(); R.qIdx=0;
    R.word=R.qList[0];
    const need=WORD_PAIRS-R.qList.length;
    const fill=need>0
      ? shuf(WORDS.filter(w=>!R.qList.some(q=>q.k===w.k))).slice(0,need) : [];
    const set=shuf(R.qList.concat(fill));
    /* ★ v0.4 — 아이템 카드 폐기(사용자 지시). 8장이 **전부 단어 4쌍**이다.
       아이템 쌍은 학습과 무관한 짝이라, 아이가 8장 중 2장을 외우는 데 쓰는
       기억 용량이 단어에 안 쓰이고 있었다. 아이템은 배경(풍선)으로 옮겼다. */
    const items=[];
    set.forEach(w=>{ items.push({w:w,type:"word"}); items.push({w:w,type:"pic"}); });
    shuf(items);
    worldg.innerHTML="";
    R.cards=items.map((it,i)=>{
      const f=Math.floor(i/4), c=i%4;
      /* 동물 — 카드 뒤에 선다(카드가 자기보다 크다) */
      /* ★ v0.4 — 거북이·토끼·앞발 폐기(사용자 지시 "너무 정신 사나와").
         8마리가 각자 다른 색으로 서 있어 **시선이 카드가 아니라 동물로 갔다**.
         기억 게임인데 주인공이 밀려나 있었다. 이제 카드가 선반 위에 혼자 선다.
         부수 효과: 카드당 DOM 3개 → **1개**. */
      const el=H("div",{class:"c5"});
      const inn=H("div",{class:"c5in"});
      const bk=H("div",{class:"c5f bk"}); bk.appendChild(logoBackSVG());
      const fr=H("div",{class:"c5f fr"});
      if(it.type==="word") fr.appendChild(multiWordSVG(it.w.w,300));
      else                 fr.appendChild(partIcon(it.w.k));
      inn.appendChild(bk); inn.appendChild(fr);
      el.appendChild(inn); worldg.appendChild(el);
      return {el,it,f,c,x:0,y:0,w:0,h:0,open:false,locked:false};
    });
    layoutCards();
  }
  function layoutCards(){
    if(!R.cards.length||!W)return;
    R.cards.forEach(cd=>{
      const bx=BX+cw*(cd.c+.5);
      const fy=BY+fH*(cd.f+1)-Math.max(6,fH*.045);     /* 그 층의 바닥선 */
      /* 카드는 선반 위에 선다 */
      const y=fy-cardH, x=bx-cardW/2;
      cd.x=x; cd.y=y; cd.w=cardW; cd.h=cardH;
      cd.el.style.left=x.toFixed(1)+"px"; cd.el.style.top=y.toFixed(1)+"px";
      cd.el.style.width=cardW.toFixed(1)+"px"; cd.el.style.height=cardH.toFixed(1)+"px";
    });
  }
  const openCard=cd=>{cd.open=true; cd.el.classList.add("open");};
  const shutCard=cd=>{if(cd.locked)return; cd.open=false; cd.el.classList.remove("open");};

  /* ══════════════════════════════════════════════════════════════════════
     v0.3 판 진행 — ① READY GO → ② pre-study(쌍 단위) → ③ 소리 문제 ×N
     ----------------------------------------------------------------------
     ★ pre-study는 **짝을 짝으로** 가르친다(사용자 지시). 한 장씩 랜덤으로 열면
       아이가 3초에 글자를, 7초에 그림을 보고 "이 둘이 짝"임을 스스로 추론해야 했다.
       동시에 2초씩 열면 그 추론이 사라지고 **위치 기억**만 남는다.
       4쌍 × 2초 = 8초. 예습 카드 모달은 이 단계가 흡수했으므로 없앴다.
     ★ 본 게임은 **소리로만** 문제를 낸다 — Listening. 목표칸엔 글자가 아니라 스피커.
     ══════════════════════════════════════════════════════════════════════ */
  async function roundStart(){
    R.phase="idle"; R.busy=true;
    buildGoal(true);                     /* 목표는 가린 채로 — 칸 높이는 그대로 */
    const ov=H("div",{class:"readyov"}); sky.appendChild(ov);
    const show=(t,c)=>{ov.innerHTML="";ov.appendChild(shoutNode(t,c||"#FFD45C"));};
    show("READY"); Cue2.ready(); await wait(620);
    show("GO!","#7BE3B6"); Cue2.go(); await wait(480);   /* 3·2·1 카운트다운 없음 */
    ov.remove();
    if(SCREEN!=="play")return;
    R.busy=false; peek();
  }

  /* ② pre-study — **짝끼리 동시에** 2초씩, 4쌍 8초 */
  function peek(){
    R.phase="peek"; R.peekLeft=PEEK_SEC;
    buildGoal(true);
    /* 카드를 짝으로 묶는다 — 단어쌍은 k로, 아이템쌍은 type으로 */
    const byKey={};
    R.cards.forEach((cd,i)=>{
      const key=cd.it.w.k;
      (byKey[key]=byKey[key]||[]).push(i);
    });
    const pairs=shuf(Object.keys(byKey).map(k=>byKey[k]));
    pairs.forEach((idxs,n)=>{
      later(()=>{ if(SCREEN!=="play"||R.phase!=="peek")return;
        idxs.forEach(ci=>{ const cd=R.cards[ci];
          openCard(cd); cd.el.classList.add("pop"); });
        Cue2.snap();
        /* 단어쌍이면 그 낱말을 읽어 준다 — 소리와 글자를 여기서 처음 잇는다 */
        const w0=R.cards[idxs[0]].it.w;
        if(w0) later(()=>{ if(SCREEN==="play")say(w0.w); },140);
        later(()=>{ if(SCREEN==="play")idxs.forEach(ci=>shutCard(R.cards[ci]));
          idxs.forEach(ci=>R.cards[ci].el.classList.remove("pop")); },PAIR_OPEN);
      },n*PAIR_STEP);
    });
    later(()=>{ if(SCREEN!=="play")return;
      R.cards.forEach(shutCard); askNext(); },PEEK_SEC*1000+220);
  }

  /* ③ 문제 — 판의 단어를 하나씩. 화면엔 글자가 없다(소리로만) */
  function askNext(){
    if(SCREEN!=="play")return;
    R.word=R.qList[R.qIdx];
    R.fails=0; R.miss=0; R.sel=[];
    startHunt();
    buildGoal();                         /* 스피커 — 목표 글자는 안 보여준다 */
    wordT0=performance.now();
    later(()=>speak(),240);
    /* 듣기가 유일한 단서라 한 번 더 읽어 준다(MG6와 같은 문법) */
    later(()=>{ if(SCREEN==="play"&&R.phase==="hunt"&&R.fails===0)speak(); },2800);
  }
  function speak(){
    if(!R.word)return;
    say(R.word.w); Cue2.word();
    goal.classList.remove("say"); void goal.offsetWidth; goal.classList.add("say");
  }
  function startHunt(){
    R.phase="hunt"; R.huntLeft=HUNT_SEC; R.busy=false; R.sel=[];
    /* 이미 맞힌 짝은 열린 채 잠겨 있다 — 남은 카드만 다시 닫는다 */
    R.cards.forEach(cd=>{ if(!cd.locked)shutCard(cd); });
  }

  /* ---------- 목표칸 = 단어 그림(공용 부품 .gword) ----------
     ★ 관찰 구간에는 목표를 감춘다(밝히면 8장을 볼 이유가 없어진다).
       감출 때도 **같은 부품**을 써야 2행 높이가 흔들리지 않는다 —
       라운드 도중에 대시보드 높이가 바뀌면 필드까지 같이 움직인다. */
  /* ★ v0.3 — 사격 중에도 **글자를 보여주지 않는다**. 문제는 소리로만(Listening).
     ★ 안전장치: TTS가 꺼져 있으면(`SAVE.set.voice` off 또는 speechSynthesis 없음)
       소리가 유일한 단서인 게임이 **성립 자체를 못 한다** → 그때만 글자를 띄운다.
     ★ 어느 쪽이든 **같은 부품(.gword)**을 써야 대시보드 2행 높이가 안 흔들린다. */
  function canHear(){
    try{ return !!SAVE.set.voice && typeof window!=="undefined" && !!window.speechSynthesis; }
    catch(e){ return false; }
  }
  function buildGoal(hidden){
    goal.innerHTML="";
    const gw=H("div",{class:"gword"});
    if(hidden)            gw.appendChild(hiddenGoalSVG());
    else if(canHear())    gw.appendChild(listenSVG());        /* 소리로만 */
    else                  gw.appendChild(multiWordSVG(R.word.w,300));  /* 음소거 대체 */
    goal.appendChild(gw);
    goal.classList.toggle("tapable",!hidden&&canHear());
    renderTrack(wtrack,wordLog,stageWords.length);
  }
  /* 목표칸을 누르면 다시 들려준다 */
  goal.addEventListener("pointerdown",e=>{
    e.stopPropagation();
    if(R.phase==="hunt"&&canHear())speak();
  });

  /* ---------- 연출 문구 회피 (4게임 공통 문법 — 투명도는 --fxop 변수로) ---------- */
  const FX_BANDS=[0.10,0.24,0.40,0.56,0.72];
  function fxSpot(){
    const sr=sky.getBoundingClientRect();
    if(!sr.height)return {top:0.15,op:.95};
    const ys=[];
    R.cards.forEach(cd=>{ if(!cd.h)return;
      ys.push({c:(cd.y+cd.h*.5)/sr.height, h:cd.h/sr.height}); });
    let best=FX_BANDS[0], bg2=-1;
    FX_BANDS.forEach(b=>{
      let m=9;
      ys.forEach(o=>{ m=Math.min(m,Math.abs(b-o.c)-o.h*.5); });
      if(m>bg2){bg2=m; best=b;}
    });
    const op=clamp(.42+(bg2+.02)*3.4,.42,.95);
    return {top:best,op:op};
  }
  function callout(t,col){
    const sp=fxSpot();
    const d=H("div",{class:"callout"});
    d.style.setProperty("--fxop",sp.op.toFixed(2));
    d.style.top=(sp.top*100).toFixed(1)+"%";
    d.appendChild(shoutNode(t,col));
    sky.appendChild(d);
    requestAnimationFrame(()=>d.classList.add("in"));
    later(()=>d.remove(),1000);
  }

  /* ---------- 배경 아이템: 풍선 경품 (v0.4, 사용자 지시) ----------
     ★ MG6의 곤충과 같은 문법 — 지나가고, 쏘면 획득, **무벌**(탄약만 소모).
     ★ 풍선은 **밤하늘(부스 위 BY 윗공간)** 만 지난다. 카드와 세로로 안 겹치므로
       MG6에서 겪은 "운반체가 표적 클릭을 가로챈다" 문제가 구조적으로 없다.
       그래도 판정 순서를 코드로 못 박는다 — 풍선 먼저, 카드는 그다음. */
  const BALLOON_MAX=2;                 /* 동시에 뜨는 최대 개수 */
  let balNext=2.2;
  function spawnBalloon(force){
    if(!W||(!force&&R.balloons.length>=BALLOON_MAX))return null;
    const kind=rollDropItem();
    const dir=Math.random()<.5?1:-1;
    const sc=0.82+Math.random()*0.30;
    const el=H("div",{class:"bal"+(dir<0?" flip":"")});
    el.style.setProperty("--bs",sc.toFixed(2));
    el.appendChild(balloonSVG(pick(BALLOON_COLS),kind));
    sky.appendChild(el);
    const b={el,kind,dir,sc,t:Math.random()*6,hit:false,
             sp:26+Math.random()*20, amp:6+Math.random()*8, w:1.5+Math.random()*1.2,
             x:dir>0?-60:W+60, y0:BY*(0.22+Math.random()*0.46), y:0};
    b.y=b.y0; R.balloons.push(b);
    return b;
  }
  R._bal=spawnBalloon;
  function moveBalloons(dt){
    for(let i=R.balloons.length-1;i>=0;i--){
      const b=R.balloons[i];
      b.t+=dt; b.x+=b.dir*(b.hit?150:b.sp)*dt;
      b.y=b.y0+Math.sin(b.t*b.w)*b.amp;
      b.el.style.transform=`translate(${b.x.toFixed(1)}px,${b.y.toFixed(1)}px) scale(${b.sc})`;
      if(b.x<-90||b.x>W+90){ b.el.remove(); R.balloons.splice(i,1); }
    }
  }
  const balloonAt=(x,y)=>R.balloons.find(b=>!b.hit&&
    Math.abs(x-b.x)<38*b.sc&&Math.abs(y-b.y)<52*b.sc);
  function popBalloon(b,x,y){
    b.hit=true;
    b.el.classList.add("pop");
    const g=grantItem(b.kind);
    if(g.score)score+=g.score;
    if(g.ink)SAVE.ink+=g.ink;
    persist(); updScore();
    itemPop(sky,x,y,b.kind);
    callout("BONUS!","#F5C542");
    later(()=>{ if(b.el.parentNode)b.el.remove();
      const i=R.balloons.indexOf(b); if(i>=0)R.balloons.splice(i,1); },420);
  }

  /* ---------- 판정 ---------- 
     ★ v0.1(사용자 지적 "맞춰도 성공이 안 된다"): v0.0.2는 **단어 카드를 먼저** 쏴야만
       정답으로 쳤다. 짝이 맞는 두 장이라도 그림을 먼저 쏘면 오답 + 하트 -1 + 단어 상실 —
       화면에 순서 신호가 하나도 없으니 사용자에겐 그냥 버그였다. 순서 강제를 폐기한다.
     새 규칙: 두 장을 뒤집으면 판정한다.
       · 목표 단어의 짝(단어+그림) → 성공
       · 아이템 짝(같은 아이템 2장) → 아이템 획득 + 잠금, 라운드는 계속(무벌)
       · 그 외 → **시간 -2초**, 두 장 다시 닫힘, 타이머가 남는 한 몇 번이고 재시도
       · 하트는 **타이머가 0이 될 때만** -1 */
  const isTarget=cd=>cd.it.w&&cd.it.w.k===R.word.k;
  function shootAt(x,y){
    reticleFX(fx,x,y);
    if(R.phase!=="hunt"||R.busy){ Cue2.tink(); return; }
    let hit=null;
    for(let i=R.cards.length-1;i>=0;i--){
      const cd=R.cards[i];
      if(cd.locked||cd.open)continue;
      if(x>=cd.x&&x<=cd.x+cd.w&&y>=cd.y&&y<=cd.y+cd.h){ hit=cd; break; }
    }
    /* ★ 풍선이 먼저 — 하늘에 떠 있고 카드와 세로로 안 겹친다 */
    if(!hit){
      const b=balloonAt(x,y);
      if(b){ popBalloon(b,x,y); return; }
      R.miss++; Cue2.tink(); return;                 /* 헛발 = 탄약만 소모, 벌 없음 */
    }
    openCard(hit); hit.el.classList.add("hit");
    later(()=>hit.el.classList.remove("hit"),420);
    R.sel.push(hit);
    if(R.sel.length<2){ Cue2.tink(); return; }
    judge(R.sel[0],R.sel[1]);
  }
  function judge(a,bq){
    R.busy=true;
    /* ★ v0.4 — 아이템 짝 분기 폐기. 8장이 전부 단어라 판정은 **둘 중 하나**다:
       목표 짝이면 성공, 아니면 시간 −2초. 아이템은 배경 풍선으로 옮겼다. */
    const target=(isTarget(a)&&isTarget(bq)&&a.it.type!==bq.it.type);
    if(target){                                     /* 목표 짝 — 성공 */
      [a,bq].forEach(cd=>{cd.locked=true; cd.el.classList.add("done");});
      R.sel=[]; Cue2.word(); wordClear(); return;
    }
    /* 그 외 — 시간만 깎고 다시 닫는다. 단어는 잃지 않는다 */
    R.fails++;
    [a,bq].forEach(cd=>cd.el.classList.add("bad"));
    Snd.no();
    R.huntLeft=Math.max(0,R.huntLeft-MISS_SEC);
    penaltyFX();
    later(()=>{
      [a,bq].forEach(cd=>{cd.el.classList.remove("bad"); shutCard(cd);});
      R.sel=[];
      if(SCREEN==="play"&&R.phase==="hunt")R.busy=false;
    },760);
  }
  /* 시간이 깎인 것을 눈으로 알린다 — 시계 옆에 -2초가 튄다 */
  function penaltyFX(){
    const cell=document.querySelector(".timecell");
    if(cell){ cell.classList.remove("pen"); void cell.offsetWidth; cell.classList.add("pen");
      later(()=>cell.classList.remove("pen"),620); }
    clk.burst();
    const sp=fxSpot();
    const d=H("div",{class:"callout"});
    d.style.setProperty("--fxop",sp.op.toFixed(2));
    d.style.top=(sp.top*100).toFixed(1)+"%";
    d.appendChild(shoutNode("-"+MISS_SEC+"s","#FF8A7A"));
    sky.appendChild(d);
    requestAnimationFrame(()=>d.classList.add("in"));
    later(()=>d.remove(),1000);
  }

  /* ---------- 라운드 마무리 — ★ 성공이든 실패든 **8장 전부 앞면**을 보여준다
     (사용자 지시). 못 맞힌 카드가 뭐였는지 아이가 확인하고 넘어간다.
     목표 짝 두 장에는 초록 테두리를 둘러 "이 둘이 짝이었어"를 가르친다. ---------- */
  function revealAll(){
    R.cards.forEach(cd=>{ cd.locked=true; openCard(cd); });
    R.cards.forEach(cd=>{ if(isTarget(cd)) cd.el.classList.add("ans"); });
    Cue2.snap();
  }

  /* ---------- 단어 상실 / 완성 ---------- */
  /* ★ v0.3 — 문제 하나가 끝난 뒤 **판이 아직 안 끝났으면 전 카드를 열지 않는다**.
     v0.2의 "한 문제 끝나면 전 카드 공개"를 그대로 두면 문제1을 맞힌 순간
     문제2·3의 답까지 통째로 알려주게 된다. 공개는 **판 끝**으로 옮겼다.
     (사용자 지시의 의도 — "못 맞힌 카드가 뭐였는지 확인" — 는 그대로 지켜진다.) */
  function afterQuestion(ms){
    R.qIdx+=1; R.round+=1;
    const boardDone=(R.qIdx>=R.qList.length);
    if(boardDone) revealAll();                   /* ★ 판 끝에서만 8장 전부 공개 */
    later(()=>{
      if(SCREEN!=="play")return;
      if(SAVE.hearts<=0){ finishStage(); return; }
      if(R.round>=ROUNDS){ finishStage(); return; }
      if(boardDone){ buildBoard(R.board+1); roundStart(); }
      else askNext();                            /* 같은 판에서 다음 문제 */
    }, boardDone?ms+900:ms);                     /* 판 끝은 카드를 볼 시간을 더 준다 */
  }
  function wordClear(){
    R.phase="clear"; R.busy=true;
    winFX(sky,W/2,Hp*.42,true);
    Cue2.fanfare(); Cue2.clap();
    gainMag();
    /* ★ 축 개편 — 소리를 듣고(listen) 글자 카드를 찾고(spell) 위치를 기억한다(mem).
       v0.2까지 쓰던 ref는 이 게임의 행동과 맞지 않았고, mem은 6게임 중 아무도 안 썼다. */
    SAVE.stat.listen+=1; SAVE.stat.spell+=1; SAVE.stat.mem+=1;
    SAVE.seen[R.word.w]=(SAVE.seen[R.word.w]||0)+1;
    persist();
    const pf=(R.fails===0&&R.miss===0);          /* 실패 짝 0 + 헛발 0 = 두 장 만에 끝냈다 */
    wordLog.push({k:R.word.k,w:R.word.w,ok:true,perfect:pf,ms:performance.now()-wordT0});
    renderTrack(wtrack,wordLog,stageWords.length);
    if(pf){ score+=80; cascadeFX(sky,W||360,Hp||520); }
    score+=140; updScore();
    say(R.word.w);
    afterQuestion(1700);
  }
  function timeUp(){
    R.phase="idle"; R.busy=true;
    /* ★ 하트가 깎이는 경우는 **여기 하나뿐**이다(사용자 확정 v0.1) */
    SAVE.hearts=Math.max(0,SAVE.hearts-1); persist(); updHearts();
    callout("TIME!","#FF8A7A"); Snd.no();
    /* 못 맞힌 문제는 **그 짝만** 펴서 정답을 알려 준다(나머지는 다음 문제용이라 덮어 둔다) */
    R.cards.forEach(cd=>{ if(isTarget(cd)){ cd.locked=true; openCard(cd);
      cd.el.classList.add("ans"); } });
    Cue2.snap();
    wordLog.push({k:R.word.k,w:R.word.w,ok:false});
    renderTrack(wtrack,wordLog,stageWords.length);
    afterQuestion(1700);
  }

  /* ---------- 입력: 스와이프 장전(4게임 동일) + 사격 ---------- */
  let swY0=null,swMax=0,swArmed=false,swT=0,swFx=null;
  function swFxShow(){ if(swFx)return;
    swFx=H("div",{class:"swfx"});
    const sv=E("svg",{viewBox:"0 0 92 112",xmlns:NS}); sv.innerHTML=MAG3_ART; swFx.appendChild(sv);
    sky.appendChild(swFx); }
  function swFxMove(dy){ if(!swFx)return;
    swFx.style.transform="translate(-50%,-50%) translateY("+Math.max(-60,Math.min(96,dy)).toFixed(0)+
      "px) scale("+(1+Math.min(.4,Math.abs(dy)/220)).toFixed(2)+")"; }
  function swFxEnd(ok){ if(!swFx)return; const f=swFx; swFx=null;
    if(ok){ f.classList.add("snap"); setTimeout(()=>f.remove(),260); } else f.remove(); }
  const swEnd=()=>{ swY0=null; swArmed=false; swFxEnd(false); };
  sky.addEventListener("pointerdown",e=>{ swY0=e.clientY; swMax=e.clientY; swArmed=false; swT=Date.now(); });
  sky.addEventListener("pointermove",e=>{
    if(swY0==null)return;
    if(e.clientY>swMax)swMax=e.clientY;
    if(SAVE.ammo<MAG_SIZE&&e.clientY-swY0>18){ swFxShow(); swFxMove(e.clientY-swY0); }
    if(!swArmed&&e.clientY-swY0>44)swArmed=true;
    if(swArmed&&swMax-e.clientY>44&&Date.now()-swT<1000){ swY0=null; swFxEnd(true); gun.reload(); }
  });
  sky.addEventListener("pointerup",swEnd);
  sky.addEventListener("pointercancel",swEnd);
  sky.addEventListener("pointerleave",swEnd);
  sky.addEventListener("pointerdown",e=>{
    if(PAUSED)return;
    if(R.phase!=="hunt")return;
    const rc=sky.getBoundingClientRect();
    const x=e.clientX-rc.left, y=e.clientY-rc.top;
    Snd.init();
    if(!gun.tryFire(x,y))return;
    Cue2.shot();
    shootAt(x,y);
  });

  /* ---------- 루프 ---------- */
  let last=performance.now();
  function frame(now){
    if(SCREEN!=="play")return;
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(!PAUSED){
      /* 풍선은 게임 화면 내내 뜬다(쏠 수 있는 건 사냥 중에만) */
      if(W){ balNext-=dt; if(balNext<=0){ spawnBalloon(); balNext=3.5+Math.random()*4; }
             moveBalloons(dt); }
      if(R.phase==="peek"){ R.peekLeft-=dt; }
      else if(R.phase==="hunt"){
        R.huntLeft-=dt;
        if(R.huntLeft<=0&&!R.busy) timeUp();
      }
      updClock();
    }
    RAF=requestAnimationFrame(frame);
  }

  try{ fieldRO=new ResizeObserver(()=>measure()); fieldRO.observe(sky); }catch(e){}
  measure();
  updAmmoHUD();
  buildBoard(0);
  measure();
  roundStart();
  RAF=requestAnimationFrame(frame);
}

/* v0.8 ①(사용자 지시) — 시작 전 화면을 **Spellshot과 같은 문법**으로 통일.
   순서: 큰 타이틀 → 주인공 아트 → 자원(하트·잉크·씨앗) → ▶ → 3초 자동 시작 게이지 → 별자리
   → 좌상단 🏠 / 우상단 ⚙. 색만 좀비 테마(붉은 신호등 + 독초록 좀비). 카드형 레이아웃은 폐기. */

     뒷면 카드 두 장이 살짝 겹쳐 서고, 한 장이 앞면으로 열려 있다. */

  const AUTO_MS=3000;

/* v0.7 ⑨(사용자 지시) — 퍼펙트 단어 = Candy Crush식 연쇄 팡팡 */
function cascadeFX(sky,fw,fh){
  const COLS=["#FFCE5C","#FF8A8A","#7BE3B6","#8CC8EE","#F79FC4","#C9A8F0"];
  const sh=H("div",{class:"perfshout"}); sh.appendChild(shoutNode("PERFECT!","#FFD45C"));
  sky.appendChild(sh); later(()=>sh.remove(),1300);
  for(let i=0;i<11;i++){
    later(()=>{
      if(!sky.parentNode)return;
      const p=H("div",{class:"cascpop"});
      p.style.left=(fw*(.10+.80*Math.random())).toFixed(0)+"px";
      p.style.top=(fh*(.14+.62*Math.random())).toFixed(0)+"px";
      p.style.setProperty("--c",COLS[i%COLS.length]);
      sky.appendChild(p); later(()=>p.remove(),780);
      Snd.t(500+i*75,.09,"triangle",.12);
      if(i%3===2)Snd.t(240+i*40,.14,"sine",.08);
    },90*i);
  }
  later(()=>Cue2.gold(),1050);
}
/* v0.7 ④⑥⑩(사용자 지시) — 결과 = 단어 통계(그림+O/X) + 60% 게이트 + 총점 카운트업. 별표 폐지 */
function scrResult(win,score,log){
  clearAll(); SCREEN="result";
  if(score>SAVE.best){SAVE.best=score;persist();}
  log=log||[];
  const okN=log.filter(x=>x.ok).length, tot=Math.max(1,log.length);
  const pct=Math.round(okN/tot*100), pass=okN/tot>=.6;
  const c=H("div",{class:"center"});
  const card=H("div",{class:"card"});
  card.appendChild(shoutNode(pass?"STAGE CLEAR!":"ALMOST!",pass?"#7BE3B6":"#FFB37A"));
  const grid=H("div",{class:"wstat"});
  log.forEach(x=>{
    const wc=H("div",{class:"wcard "+(x.ok?"ok":"no")});
    const ic=H("div",{class:"wic"}); ic.appendChild(partIcon(x.k)); wc.appendChild(ic);
    wc.appendChild(H("div",{class:"wname",text:x.w}));
    wc.appendChild(H("div",{class:"wbadge "+(x.ok?"ok":"no"),text:x.ok?"\u2713":"\u2717"}));
    if(x.perfect)wc.appendChild(H("div",{class:"wperf",text:"PERFECT"}));
    grid.appendChild(wc);
  });
  card.appendChild(grid);
  card.appendChild(H("div",{class:"stPct",text:okN+" / "+log.length+" \u00b7 "+pct+"%"}));
  const okL=log.filter(x=>x.ok);
  const accB=okN*40;
  const refB=okL.reduce((a,x)=>a+Math.max(0,Math.round((16000-Math.min(16000,x.ms||16000))/400)),0);
  const total=(score||0)+accB+refB;
  const row0=H("div",{class:"stBonus"});
  row0.appendChild(H("span",{class:"bchip",text:"SCORE "+(score||0)}));
  row0.appendChild(H("span",{class:"bchip acc",text:"ACCURACY +"+accB}));
  row0.appendChild(H("span",{class:"bchip ref",text:"SPEED +"+refB}));
  card.appendChild(row0);
  const big=H("b",{class:"num",id:"bigscore",style:"font-size:2.2rem",text:"0"});
  card.appendChild(H("div",{class:"cnt",style:"font-size:1.2rem"},[icoSVG("score"),big]));
  const row=H("div",{style:"display:flex;gap:12px;align-items:center"});
  row.appendChild(ibtn("home",wbHome));
  const nsW=H("div",{class:"nsWrap"+(pass?"":" dis"),id:"nsWrap"});
  nsW.appendChild(H("div",{class:"nsLab",text:"NEXT STAGE"}));
  const nb=H("button",{class:"bigbtn",id:"nextStageBtn",on:{click:()=>{ if(!pass||SAVE.hearts<=0){Snd.no();return;}
    SAVE.stage=(SAVE.stage||1)+1; persist(); Snd.init(); scrPlay(); }}},[icoSVG("play")]);
  nsW.appendChild(nb); row.appendChild(nsW);
  if(SAVE.hearts>0)
    row.appendChild(H("button",{class:"bigbtn",id:"replayBtn",on:{click:()=>{Snd.init();scrPlay();}}},[icoSVG("replay")]));
  card.appendChild(row);
  c.appendChild(card); app.appendChild(c);
  if(pass){ Cue2.fanfare();
    later(()=>{const r2=c.getBoundingClientRect(); winFX(c,r2.width/2,r2.height*.3,true);},250); }
  /* ⑩ 총점이 틱 사운드와 함께 차오른다(정확도·반응속도 보너스 합산) */
  const DUR=1600, t0=performance.now(); let lastTick=0, fin=false;
  window.__TALLY={total:total,acc:accB,ref:refB,pass:pass,pct:pct,done:false};
  try{if(window.parent!==window)parent.postMessage({wb:"tally",pass:pass,pct:pct},"*");}catch(e){}
  (function roll(now){
    if(SCREEN!=="result"||fin)return;
    const p=Math.min(1,(now-t0)/DUR), e=1-Math.pow(1-p,3);
    big.textContent=String(Math.round(total*e));
    if(now-lastTick>70){ lastTick=now; Snd.t(560+920*e,.03,"square",.05); }
    if(p>=1){ fin=true; big.textContent=String(total); window.__TALLY.done=true;
      if(pass)Cue2.fanfare(); else Cue2.beat(); return; }
    requestAnimationFrame(roll);
  })(performance.now());
}

<script>
/* ═══ Wordborn Prototype 통합 어댑터(v0.5.1) — 월드 iframe 연동 · 긴 단어 맞춤 ═══
   ① wbHome(): iframe 안이면 부모(월드)에 exit 메시지, 단독 실행이면 기존 허브 이동.
   ② wbFitGoal(): 대시보드 철자판이 넘치면 그림 숨김→축소로 **끝 글자까지** 보이게.
   ③ 결과 화면에서 부모에 tally(pass/pct) 통지 — 클리어 시 월드가 지도로 복귀. */
function wbHome(){
  try{ if(window.parent!==window){ parent.postMessage({wb:"exit"},"*"); return; } }catch(e){}
  try{ location.href="index.html?t="+Date.now(); }catch(e){}
}
function wbFitGoal(){
  try{
    var goal=document.querySelector(".hud .goal")||document.querySelector(".goal");
    if(!goal||!goal.isConnected)return;
    var row=goal.querySelector(".slots")||goal.querySelector(".slotrow");
    if(!row||!row.children.length)return;
    var pic=goal.querySelector(".gpic")||goal.querySelector(".pic");
    row.style.transform=""; row.style.marginRight=""; if(pic)pic.style.display="";
    var need=row.scrollWidth; if(!need)return;
    function avail(){
      var gr=goal.getBoundingClientRect(), rr=row.getBoundingClientRect();
      var padR=parseFloat(getComputedStyle(goal).paddingRight)||0;
      return Math.max(24, gr.right-padR-rr.left);
    }
    var a=avail();
    if(need<=a)return;
    if(pic && a/need<0.74){ pic.style.display="none"; a=avail(); if(need<=a)return; }
    var k=Math.max(0.30, Math.min(1, a/need));
    row.style.transformOrigin="left center";
    row.style.transform="scale("+k+")";
    row.style.marginRight=(-need*(1-k)).toFixed(1)+"px";
  }catch(e){}
}
window.addEventListener("resize",function(){ setTimeout(wbFitGoal,80); });
window.addEventListener("orientationchange",function(){ setTimeout(wbFitGoal,120); });
</script>
