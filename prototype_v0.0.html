<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2D9AC">
<title>Wordborn</title>
<style>
:root{ --ink:#3b2b3a; --ink-soft:#725d6c; --paper:#fbf3e4; --paper-2:#fff9ed; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  color:var(--ink); background:#F2D9AC; overflow:hidden;
}
#app{max-width:560px;margin:0 auto;height:100vh;height:100svh;
  display:flex;flex-direction:column;position:relative}
button{font-family:inherit}

/* ── 공용 부품 ── */
.cbtn{width:44px;height:44px;flex:0 0 44px;border:3px solid var(--ink);border-radius:15px;
  background:var(--paper);box-shadow:0 4px 0 var(--ink);font:800 22px/1 system-ui;
  color:var(--ink);cursor:pointer;padding:0}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.cbtn.ghost{border:none;background:none;box-shadow:none;pointer-events:none}
.pill{font-size:12.5px;font-weight:850;padding:6px 12px;border-radius:999px;
  border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink)}
.pill.ok{background:#DFF3E4}
.play{border:4px solid var(--ink);border-radius:18px;background:#FFD05E;
  box-shadow:0 5px 0 var(--ink);font:900 19px/1 inherit;color:var(--ink);
  padding:14px 18px;cursor:pointer}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}

/* ── 아바타 룸 ── */
.room{position:relative;flex:1;overflow:hidden}
.roombg{position:absolute;inset:0;width:100%;height:100%}
.rhud{position:absolute;top:12px;left:0;right:0;display:flex;gap:8px;justify-content:center}
.wbtn{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);
  width:clamp(150px,44vw,210px);border:none;background:none;padding:0;cursor:pointer}
.wbtn .wdrop{width:100%;height:auto;display:block;animation:wbob 3s ease-in-out infinite}
@keyframes wbob{50%{transform:translateY(-8px)}}
.wbtn.hop .wdrop{animation:whop .55s ease}
@keyframes whop{30%{transform:translateY(-26px) rotate(-4deg)}60%{transform:translateY(0) scale(1.06,.94)}}
.wlids{opacity:0}
.wdrop{animation:none}
.blink .wlids{opacity:1}
.blink .weyes circle{opacity:0}
.rname{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);
  font-size:14px;font-weight:900;background:var(--paper);border:2.5px solid var(--ink);
  border-radius:999px;padding:3px 13px;box-shadow:0 3px 0 var(--ink)}
.door{position:absolute;right:6%;bottom:24%;width:clamp(78px,22vw,104px);
  border:none;background:none;padding:0;cursor:pointer}
.door svg{width:100%;height:auto;display:block;filter:drop-shadow(0 5px 0 rgba(59,43,58,.3))}
.door:active svg{transform:translateY(3px)}
.mapgo{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);min-width:62%}
.mapgo:active{transform:translateX(-50%) translateY(3px)}

/* ── 스크롤 지도 ── */
.mapwrap{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mapwrap::-webkit-scrollbar{display:none}
.mapboard{position:relative;width:100%}
.mbg{position:absolute;inset:0;width:100%;height:100%;display:block}
.maphud{position:absolute;top:10px;left:0;right:0;display:flex;gap:8px;
  justify-content:center;align-items:center;pointer-events:none;z-index:5}
.maphud .cbtn,.maphud .pill{pointer-events:auto}
.sign{position:absolute;left:50%;transform:translate(-50%,-50%);text-align:center;
  background:#E8B37B;border:3.5px solid var(--ink);border-radius:14px;padding:5px 16px 6px;
  box-shadow:0 4px 0 var(--ink);line-height:1.1;z-index:2}
.sign b{font-size:15.5px;display:block}
.sign span{font-size:8.5px;font-weight:800;letter-spacing:.12em;color:var(--ink-soft)}
.sign::before,.sign::after{content:"";position:absolute;top:-9px;width:7px;height:9px;
  background:#C98D52;border:2.5px solid var(--ink);border-radius:3px}
.sign::before{left:18%}.sign::after{right:18%}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(56px,15vw,74px);
  border:none;background:none;padding:0;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:2px;z-index:3}
.node svg{width:100%;height:auto;display:block}
.node .nlab{font-size:clamp(9.5px,2.5vw,11.5px);font-weight:850;white-space:nowrap;
  background:var(--paper);border:2px solid var(--ink);border-radius:999px;
  padding:1px 7px;line-height:1.45;box-shadow:0 2px 0 var(--ink)}
.node.lock{cursor:default}
.node.lock .nlab{opacity:.6}
.node.open>svg{animation:nbob 2.4s ease-in-out infinite}
@keyframes nbob{50%{transform:translateY(-5px)}}
.mark{position:absolute;left:50%;top:-46%;transform:translateX(-50%);width:56%;
  pointer-events:none;animation:mhop 1.4s ease-in-out infinite}
.mark .wdrop{width:100%;height:auto;display:block}
@keyframes mhop{50%{transform:translateX(-50%) translateY(-7px)}}
.bfly{animation:bf 3.4s ease-in-out infinite}
@keyframes bf{50%{transform:translate(9px,-13px)}}
.boat{animation:bt 4.6s ease-in-out infinite}
@keyframes bt{50%{transform:translate(-8px,-8px) rotate(-3deg)}}
.cl{animation:cldrift 9s ease-in-out infinite}
@keyframes cldrift{50%{transform:translateX(14px)}}
.tw{animation:tw 2.2s ease-in-out infinite}
.tw2{animation:tw 2.2s ease-in-out 1.1s infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}

/* ── 스테이지 시트 ── */
.dim{position:absolute;inset:0;background:rgba(43,28,44,.42);z-index:8;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,520px);background:var(--paper-2);border:4px solid var(--ink);
  border-bottom:none;border-radius:26px 26px 0 0;box-shadow:0 -6px 0 rgba(59,43,58,.25);
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;
  flex-direction:column;gap:12px;animation:up .28s ease}
@keyframes up{from{transform:translateY(40%)}}
.grow{display:flex;align-items:center;gap:9px}
.gdot{width:17px;height:17px;border-radius:50%;border:2.5px solid var(--ink);flex:0 0 auto}
.grow b{font-size:18px}
.gen{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-soft);margin-left:auto}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wchip{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;
  border:2px solid var(--ink);background:var(--paper);opacity:.55}
.wchip.got{opacity:1;background:#DFF3E4}
.bar{height:14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.prtxt{font-size:12px;font-weight:800;color:var(--ink-soft);text-align:right;margin-top:-6px}

/* ── 게임 실행 ── */
.gbar{display:flex;align-items:center;gap:8px;padding:3px 8px 3px}
.gname{flex:1;min-width:0;text-align:center;font-size:10px;font-weight:800;letter-spacing:.13em;
  color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn.mini{width:30px;height:30px;flex:0 0 30px;border-width:2.5px;border-radius:10px;
  box-shadow:0 3px 0 var(--ink);font:800 15px/1 system-ui}
.gwrap{flex:1;margin:0 6px 6px;border:4px solid var(--ink);border-radius:18px;overflow:hidden;
  box-shadow:0 5px 0 var(--ink);background:#2f2230}
.ctoast{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:12;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--paper-2);border:4px solid var(--ink);border-radius:20px;
  box-shadow:0 6px 0 var(--ink);padding:14px 26px;animation:ctpop .45s cubic-bezier(.2,1.7,.4,1)}
.ctoast b{font-size:24px;letter-spacing:.04em}
.ctoast span{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--ink-soft)}
@keyframes ctpop{0%{transform:translateX(-50%) scale(.5);opacity:0}}
.gframe{width:100%;height:100%;border:none;display:block}

@media (prefers-reduced-motion:reduce){
  .wbtn .wdrop,.node.open>svg,.mark,.bfly,.boat,.cl,.tw,.tw2{animation:none}}

/* ══════════════════════════════════════════════════════════════════════
   Wordborn World v0.1 — 아바타 룸 + 스크롤 지도 (사용자 지시 3건)
   ----------------------------------------------------------------------
   ① 인포그래픽 지도 폐기 → 게임 그림: 섬·바다·거울나라를 한 장의 긴 지도로
      그리고 **세로 스크롤**로 여행한다. 출발지는 맨 아래 거울문.
   ② **아바타 룸** 신설 — Wordrop이 사는 방이 홈 화면이다.
   ③ 두 대륙 16테마 전부 **실제 게임**으로 돈다 — MG1·MG3·MG5 테마 어댑터.
   진행도 흡수 장치는 v0.0 그대로: 게임은 한 줄도 안 고치고, 살아 있는 동안
   저장(`SAVE.seen`)을 읽어 월드 저장으로 합친다.
   ══════════════════════════════════════════════════════════════════════ */
const GKEY = "wordborn_mg_r1_v0";
const WKEY = "wordborn_world_v0";
const CLEAR_PCT = 0.6;

const GAMES = {
  mg1:{f:"minigame_mg1_spellshot_v0.22.1.html",   kr:"철자 사격",     en:"Spell Shot",   theme:true },
  mg2:{f:"minigame_mg2_pickone_v0.12.2.html",   kr:"하나 고르기",   en:"Pick One",     theme:false},
  mg3:{f:"minigame_mg3_redlight_v0.10.1.html",    kr:"무궁화꽃",      en:"Red Light",    theme:true },
  mg4:{f:"minigame_mg4_icebergbreak_v0.19.2.html",kr:"빙산 깨기",   en:"Iceberg Break",theme:false},
  mg5:{f:"minigame_mg5_flipmatch_v0.5.1.html",    kr:"뒤집기 짝맞추기",en:"Flip Match",  theme:true },

/* ★ v0.1 — 배정은 해시가 아니라 **사람이 고른 표**다.
   철자·듣기 게임(MG1·MG3·MG5)은 그림 없이도 성립하므로 아이콘 미완 9테마를 맡고,
   그림이 필수인 MG2는 아이콘이 있는 face를 맡는다. MG4는 아이콘이 채워지면 합류.
   띄어쓰기·하이픈 낱말(baseball cap·T-shirt)은 철자 게임을 피해 MG5로 보냈다. */
const GAME_FOR = {
  "face":"mg2",
  "body-1":"mg1", "body-2":"mg1", "clothes-f2":"mg1",
  "clothes-1":"mg3", "bathroom":"mg3", "clean-f":"mg3",
  "clothes-2":"mg5", "clothes-m":"mg5", "clothes-f1":"mg5"
};
const gameFor = id => WB.themes[id].game==="scene" ? "mg6" : (GAME_FOR[id]||"mg5");

/* Wordrop 마커가 서는 순서 — 여정의 진행 순서(지도 아래→위) */
const JOURNEY = ["body-1","face","clean-f","clothes-1","clothes-f2","bathroom",
  "clothes-f1","clothes-m","body-2","clothes-2","looks",
  "family-2","family-1","people","family-m","family-f"];

/* ---------- 저장 ---------- */
function wload(){
  let s=null;
  try{ const r=localStorage.getItem(WKEY); if(r)s=JSON.parse(r); }catch(e){}
  s = s || {}; s.seen = s.seen || {};
  return s;
}
let W = wload();
const wsave = ()=>{ try{ localStorage.setItem(WKEY, JSON.stringify(W)); }catch(e){} };

function absorbGameSave(){
  let g=null;
  try{ const r=localStorage.getItem(GKEY); if(r)g=JSON.parse(r); }catch(e){}
  if(!g||!g.seen)return false;
  let changed=false;
  Object.keys(g.seen).forEach(k=>{ const v=g.seen[k]|0;
    if(v>(W.seen[k]|0)){ W.seen[k]=v; changed=true; } });
  if(changed)wsave();
  return changed;
}

/* ---------- 테마 상태 ---------- */
const THEMES = Object.keys(WB.themes);
const ready = id => true;   /* v0.1 — 어댑터로 16테마 전부 실제 게임이 돈다 */
function progress(id){
  const ws=WB.load(id).words;
  const n=ws.filter(w=>(W.seen[w.w]|0)>0).length;
  return ws.length ? n/ws.length : 0;
}
const cleared = id => progress(id) >= CLEAR_PCT;
const learnedWords = ()=> {
  const set=new Set();
  THEMES.forEach(id=>WB.load(id).words.forEach(w=>{ if((W.seen[w.w]|0)>0)set.add(w.w); }));
  return set.size;
};

const INC = {};
THEMES.forEach(id=>INC[id]=[]);
WB.DATA.edges.forEach(([a,b])=>{ if(INC[b])INC[b].push(a); });
function unlocked(id){
  if(!ready(id))return false;
  const pre=INC[id].filter(ready);
  if(!pre.length)return true;
  return pre.some(cleared);
}
const nodeState = id => cleared(id) ? "done" : (unlocked(id) ? "open" : "lock");

const $ = (t,a,k)=>{ const e=document.createElement(t);
  if(a)Object.keys(a).forEach(n=>{ if(n==="text")e.textContent=a[n];
    else if(n==="html")e.innerHTML=a[n];
    else if(n==="on")Object.keys(a[n]).forEach(v=>e.addEventListener(v,a[n][v]));
    else e.setAttribute(n,a[n]); });
  (k||[]).forEach(c=>c&&e.appendChild(c)); return e; };
const NS2="http://www.w3.org/2000/svg";
const S = (t,a,k)=>{ const e=document.createElementNS(NS2,t);
  if(a)Object.keys(a).forEach(n=>e.setAttribute(n,a[n]));
  (k||[]).forEach(c=>c&&e.appendChild(c)); return e; };

/* 작은 효과음 — 클릭·팝(월드 전용, 게임 소리와 무관) */
const Zap=(function(){
  let ac=null;
  const t=(f,d,ty,g)=>{ try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), v=ac.createGain();
    o.type=ty||"sine"; o.frequency.value=f;
    v.gain.setValueAtTime(g||.08,ac.currentTime);
    v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.12));
    o.connect(v); v.connect(ac.destination); o.start(); o.stop(ac.currentTime+(d||.12)); }catch(e){} };
  return { tap(){t(740,.09,"triangle",.06);},
           open(){t(523,.1,"sine",.07); setTimeout(()=>t(784,.14,"sine",.07),80);},
           pop(){t(988,.12,"sine",.08); setTimeout(()=>t(1319,.16,"sine",.06),70);} };
})();

function nodeArt(id,st){
  const g=gameFor(id);
  const sv=S("svg",{viewBox:"0 0 100 100"});
  const c = st==="lock" ? "#CFC6D4" : GCOL[g];
  sv.appendChild(S("circle",{cx:50,cy:53,r:40,fill:INK,opacity:".28"}));
  sv.appendChild(S("circle",{cx:50,cy:50,r:40,fill:c,stroke:INK,"stroke-width":6}));
  sv.appendChild(S("circle",{cx:50,cy:50,r:31,fill:PAPER,stroke:INK,"stroke-width":4}));
  if(st==="lock"){
    sv.appendChild(S("rect",{x:37,y:46,width:26,height:22,rx:5,fill:"#E5DEEA",stroke:INK,"stroke-width":4.5}));
    sv.appendChild(S("path",{d:"M43 46V39a7 7 0 0 1 14 0v7",fill:"none",stroke:INK,"stroke-width":4.5}));
    sv.appendChild(S("circle",{cx:50,cy:56,r:3.4,fill:INK}));
  }else{
    sv.appendChild(doodle(id));
  }
  const pr=progress(id);
  if(pr>0&&st!=="lock"){
    const C=2*Math.PI*46;
    sv.appendChild(S("circle",{cx:50,cy:50,r:46,fill:"none",stroke:"#FFF","stroke-width":5,
      "stroke-dasharray":`${(C*pr).toFixed(1)} ${C.toFixed(1)}`,
      "stroke-linecap":"round",transform:"rotate(-90 50 50)",opacity:".95"}));
  }
  if(st==="done"){
    sv.appendChild(S("g",{transform:"translate(76,22)"},[
      S("circle",{cx:0,cy:0,r:13,fill:"#FFD05E",stroke:INK,"stroke-width":4}),
      S("path",{d:"M0 -7L1.9 -2.2 7 -1.8 3 1.4 4.2 6 0 3.4 -4.2 6 -3 1.4 -7 -1.8 -1.9 -2.2Z",
        fill:"#FFF",stroke:INK,"stroke-width":2,"stroke-linejoin":"round"})]));
  }
  return sv;
}

let mapScroll=-1;                       /* 지도 스크롤 위치 기억 */
function scrMap(){
  clear();
  const wrap=$("div",{class:"mapwrap"});
  const board=$("div",{class:"mapboard"});
  board.appendChild(mapBG());

  /* 대륙 이름표 — 지도 위에 얹힌 나무 팻말 */
  const signs=[["Snuggle Family Isle",178],["Mirror Mirror Land",1272]];
  signs.forEach(([en,y])=>{
    board.appendChild($("div",{class:"sign",style:`top:${y/MAPH*100}%`},[
      $("b",{text:en})]));
  });

  /* 노드 */
  const marker = JOURNEY.find(id=>nodeState(id)==="open") || JOURNEY[JOURNEY.length-1];
  THEMES.forEach(id=>{
    const p=POS[id]; if(!p)return;
    const st=nodeState(id);
    const n=$("button",{class:"node "+st,style:`left:${p[0]/MAPW*100}%;top:${p[1]/MAPH*100}%`,
      "aria-label":WB.themes[id].en,
      on:{click:()=>{ if(st==="lock"){Zap.tap();return;} Zap.open(); openSheet(id); }}});
    n.appendChild(nodeArt(id,st));
    n.appendChild($("b",{class:"nlab",text:WB.themes[id].en}));
    if(id===marker){
      const m=$("span",{class:"mark"},[wordropSVG(34)]);
      n.appendChild(m);
    }
    board.appendChild(n);
  });
  wrap.appendChild(board);
  app.appendChild(wrap);

  /* 떠 있는 머리띠 — 방으로 + 진행 */
  const done=THEMES.filter(cleared).length;
  app.appendChild($("div",{class:"maphud"},[
    $("button",{class:"cbtn",text:"⌂","aria-label":"My room",on:{click:()=>{Zap.tap(); mapScroll=wrap.scrollTop; scrRoom();}}}),
    $("span",{class:"pill ok",text:"★ "+done+" / "+THEMES.length}),
    $("span",{class:"pill",text:"Words "+learnedWords()})]));

  /* 크기 — 폭에 비례해 판 높이를 잡아 그림 비율을 지킨다 */
  const size=()=>{ if(board.isConnected)board.style.height=(wrap.clientWidth*MAPH/MAPW)+"px"; };
  size(); window.__mapSize=size;
  /* 출발지(맨 아래 거울 문)에서 시작 — 이전 위치가 있으면 거기로 */
  requestAnimationFrame(()=>{ wrap.scrollTop = mapScroll>=0 ? mapScroll : wrap.scrollHeight; });
}

/* ---------- 스테이지 시트(지도 위 팝업) ---------- */
function openSheet(id){
  const wrap=document.querySelector(".mapwrap");
  if(wrap)mapScroll=wrap.scrollTop;
  const t=WB.themes[id], g=gameFor(id), G2=GAMES[g];
  const dim=$("div",{class:"dim",on:{click:e=>{ if(e.target===dim){Zap.tap(); dim.remove(); } }}});
  const sh=$("div",{class:"sheet"});
  sh.appendChild($("div",{class:"grow"},[
    $("span",{class:"gdot",style:"background:"+GCOL[g]}),
    $("b",{text:t.en}),
    $("span",{class:"gen",text:G2.en})]));
  const ws=WB.load(id).words;
  const wl=$("div",{class:"wlist"});
  ws.forEach(w=>wl.appendChild($("span",{class:"wchip"+((W.seen[w.w]|0)>0?" got":""),text:w.w})));
  sh.appendChild(wl);
  const pr=progress(id);
  sh.appendChild($("div",{class:"bar"},[$("i",{style:`width:${(pr*100).toFixed(0)}%;background:${GCOL[g]}`})]));
  sh.appendChild($("div",{class:"prtxt",
    text:Math.round(pr*100)+"% · "+ws.filter(w=>(W.seen[w.w]|0)>0).length+"/"+ws.length+
      (cleared(id)?" · CLEAR!":"")}));
  sh.appendChild($("button",{class:"play",text:"▶  PLAY",
    on:{click:()=>{Zap.open(); dim.remove(); launch(id,g);}}}));
  dim.appendChild(sh);
  app.appendChild(dim);
}

/* ---------- 게임 실행 ---------- */
let poll=null;
function launch(id,g){
  clear();
  const url = GAMES[g].f + (GAMES[g].theme ? ("?theme="+encodeURIComponent(id)) : "");
  const t2=WB.themes[id], isle=WB.conts[t2.cont];
  const bar=$("div",{class:"gbar"},[
    $("button",{class:"cbtn mini",text:"‹","aria-label":"Back to map",on:{click:()=>closeGame(id)}}),
    $("b",{class:"gname",text:(isle.en+"  ·  "+t2.en).toUpperCase()}),
    $("span",{class:"cbtn mini ghost"})]);
  const fr=$("iframe",{class:"gframe",src:url,title:t2.en});
  app.appendChild(bar); app.appendChild($("div",{class:"gwrap"},[fr]));
  clearInterval(poll);
  poll=setInterval(absorbGameSave, 900);
  window.__WORLD_LIVE=id;
}
function closeGame(id){
  clearInterval(poll); poll=null;
  absorbGameSave();
  window.__WORLD_LIVE=null;
  scrMap();
  openSheet(id);
}

/* ---------- 게임 메시지(프로토타입) ----------
   게임이 결과 화면에서 tally(pass)를 보내면: 점수 롤업을 잠깐 보여준 뒤 지도로 복귀.
   게임 안 홈 버튼(wbHome)은 exit를 보낸다 — 수동 복귀(지도+시트). */
function finishGame(id){
  clearInterval(poll); poll=null;
  absorbGameSave();
  window.__WORLD_LIVE=null;
  scrMap();
  const t=WB.themes[id];
  const el=$("div",{class:"ctoast"},[$("b",{text:"CLEAR!"}),
    $("span",{text:t.en.toUpperCase()})]);
  app.appendChild(el); Zap.pop();
  setTimeout(()=>el.remove(),2200);
}
window.addEventListener("message",e=>{
  const d=e&&e.data; if(!d||typeof d!=="object")return;
  const id=window.__WORLD_LIVE; if(id==null)return;
  if(d.wb==="exit"){ Zap.tap(); closeGame(id); }
  else if(d.wb==="tally"){
    absorbGameSave();
    if(d.pass)setTimeout(()=>{ if(window.__WORLD_LIVE===id)finishGame(id); },2300);
  }
});

/* ---------- 시작 ---------- */
const app = document.getElementById("app");
function clear(){ app.innerHTML=""; }
window.addEventListener("resize",()=>{ if(window.__mapSize)window.__mapSize(); });
/* Wordrop 깜빡임 — 3.4초마다 잠깐 감는다 */
setInterval(()=>{ document.querySelectorAll(".wbtn .wdrop").forEach(d=>{
  d.classList.add("blink"); setTimeout(()=>d.classList.remove("blink"),190); }); },3400);
window.__WORLD={ get save(){return W;}, absorb:absorbGameSave,
  progress, cleared, unlocked, ready, gameFor,
  goMap:()=>scrMap(), goRoom:()=>scrRoom(),
  reset(){ W={seen:{}}; wsave(); mapScroll=-1; scrMap(); } };
scrMap();

</script>
</body>
