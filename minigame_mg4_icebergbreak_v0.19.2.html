  function onTap(x,y){
    if(over||lockFire||!running||PAUSED)return;
    if(!GUN.tryFire(x,y))return;                   /* ⑤ 총알 소모 — 없으면 장전부터 */
    Cue2.shot();                                   /* ⑩ 총성 */
    reticleFX(fxSVG,x,y);
    const ice=iceAt(x,y);
    if(!ice){                                      /* 빈 곳(오발) — 벌 없음, 퍼펙트만 깨진다(v0.15 ⑨) */
      wordMiss++;
      const who=BG.hit(x,y);
      if(who){ const pt=BG.stun(who);
        if(pt){ const line=pick(OUCH);
          const d=H("div",{class:"ouchline"}); d.appendChild(shoutNode(line,"#FF9A8A"));
          d.style.left=pt.x+"px"; d.style.top=pt.y+"px"; sky.appendChild(d);
          say(line); Snd.t(300,.16,"square",.09);
          later(()=>d.remove(),1500); } }
      else Snd.tap();
      return; }
    /* ====== v0.9 ④ 모든 얼음은 5연타로 부서진다(4-A 승인) ======
       연타 수를 유형마다 다르게 하면 부서지는 속도로 정답·폭탄을 유추하게 돼 읽기 학습이 샌다.
       결말만 유형별로 갈린다: 정답=획득 / 오답=그림이 눈밭으로 낙하+시간 -1.5초(파괴 시 1회) /
       폭탄=깨지는 순간 대참사 / 아이템=보상. */
    const q=curWord(); if(!q)return;
    const isRight=(ice.t==="pic"&&ice.k===q.k);
    if(!isRight&&(ice.t==="pic"||ice.t==="bomb"))wordMiss++;   /* v0.15 ⑨ — 오답·폭탄 타격 = 실수 */
    ice.hits++;
    Cue2.impact(); Snd.t(240+ice.hits*70,.08,"square",.10);
    ice.el.classList.remove("hitp"); void ice.el.offsetWidth; ice.el.classList.add("hitp");
    const crs=ice.el.querySelectorAll(".cr");
    /* v0.10 — 균열 그림은 4단계인데 타수가 8이 됐다. 두 대에 한 단계씩 번지게 해
       "얼마나 남았나"가 계속 읽히도록 한다(진행 피드백이 끊기면 8타는 지루해진다). */
    const stage=Math.min(4,Math.ceil(ice.hits/2));
    for(let i2=0;i2<stage;i2++)crs[i2]&&crs[i2].setAttribute("opacity",1);
    if(isRight)score+=6;                            /* 점수는 정답 얼음 타격에만 */
    mark(x,y,isRight||ice.t==="item");
    if(ice.hits<R4_TAPS){ updHUD(); return; }       /* 아직 안 깨졌다 */

    /* ---- 파괴 완료 ---- */
    if(ice.t==="bomb"){                             /* ④ 폭탄은 "깨질 때" 터진다(v0.8의 한 방 폭발 폐기) */
      pengGrumble(ice);                             /* 폭탄 빙산 위에 있었어도 투덜댄다 */
      bombBlast(ice,x,y); return;
    }
    tipBurst(ice);                                  /* ⑥ 꼭대기가 먼저 떨어져 나간다 */
    pengGrumble(ice);                               /* ★ 올라가 있던 펭귄이 정면을 보고 투덜댄다 */
    smashFX(ice.x,ice.y,ice.size); Cue2.smashBig();
    if(ice.t==="empty"){                            /* v0.10 ③ 빈 빙산 — 벌도 보상도 없다 */
      removeIce(ice,true);
      later(()=>{ if(!over&&SCREEN==="play")spawnIce({t:"empty"}); },1400);
      updHUD(); return;
    }
    if(ice.t==="item"){                             /* ⑤ 아이템 — 보상, 벌 없음 */
      const gain=grantItem(ice.item);
      score+=gain.score; inkRun+=gain.ink;
      itemPop(sky,ice.x,ice.y,ice.item);
      removeIce(ice,true); replaceIce(1100);
      updHUD(); updAmmoHUD();
      return;
    }
    if(!isRight){                                   /* v0.15 ⑥ — 오답 얼음 완파 = 그 단어는 **틀린 것**. 다음 단어로 */
      streak=0;
      Cue2.wrong(); toast(pick(SCOLD),false);
      dropCardToSnow(ice);
      removeIce(ice,true);
      sky.classList.remove("hurt"); void sky.offsetWidth; sky.classList.add("hurt");
      updHUD();
      wordLog.push({k:q.k,w:q.w,ok:false});
      matched[q.k]=R4_NEED;                          /* 소진 처리 — 같은 단어를 다시 뽑지 않는다 */
      paintGoal();
      const nx2=pickNext();
      if(!nx2){stageClear(); return;}
      lockFire=true; BG.cheer(900); cur=nx2;
      later(async()=>{ if(over)return;
        paintGoal();
        await preStudy(cur);
        if(over||SCREEN!=="play")return;
        spawnWave();
        wordMiss=0; wordT0=performance.now();
        lockFire=false;
      },SAVE.set.motion?900:120);
      return;
    }
    /* ---- 정답 얼음 파괴 ---- */
    breaks++; streak++; matched[q.k]++; SAVE.stat.mean+=1; persist();
    const pf=(wordMiss===0);                                        /* v0.15 ⑨ */
    wordLog.push({k:q.k,w:q.w,ok:true,perfect:pf,ms:performance.now()-wordT0});
    if(pf){ score+=80; cascadeFX(sky,FW,FH); }
    const bonus=30+Math.min(streak,8)*5;
    score+=bonus; inkRun+=4;
    if(matched[q.k]>=R4_NEED){                      /* 이 단어 학습 성공 */
      learned++; SAVE.seen[q.w]=(SAVE.seen[q.w]||0)+1;
      score+=60; inkRun+=8;
    }
    if(Math.random()<.10){seedRun++; Cue2.gold();
      const p=H("div",{class:"goldpop"}); p.appendChild(mgSVG("seed"));
      sky.appendChild(p); later(()=>p.remove(),1400);}
    /* ⑫ 보상감 — 감탄사+박수(+학습 완성 시 팡파르·콘페티). 단어 TTS 없음 */
    toast(pick(PRAISE),true); Cue2.clap();
    if(matched[q.k]>=R4_NEED){ Cue2.fanfare(); winFX(sky,ice.x,ice.y,true); gainMag(); }
    removeIce(ice,true);
    paintGoal();
    updHUD();
    const nx=pickNext();
    if(!nx){stageClear();}
    else{
      /* 단어 전환 간격 1.5초 — 헷갈림 방지. 그동안 곰·표범이 정면 보고 환호,
         입력·타이머는 정지(간격이 페널티가 되면 안 된다) */
      lockFire=true;
      BG.cheer(1500);
      cur=nx;
      /* v0.10 ① — 새 단어는 **그 단어의 예습 카드**로 시작한다(3초 자동 + ▶ 즉시).
         v0.9는 스테이지 앞에서 3단어를 몰아 보여주고 전환 때는 소리만 났다. */
      later(async()=>{ if(over)return;
        paintGoal();
        await preStudy(cur);
        if(over||SCREEN!=="play")return;
        spawnWave();
        wordMiss=0; wordT0=performance.now();    /* v0.15 ⑨⑩ */
        lockFire=false;
      },SAVE.set.motion?900:120);
    }
  }
  /* v0.9 ④ 깨진 오답 얼음의 그림이 눈밭으로 떨어진다 — 포물선 낙하 → 눈 퍼프 + 튀어오름 →
     눈가루 남기고 파묻힌다. R2 v0.3 교훈대로 CSS 전이가 아니라 JS rAF 구동(레이스 없음). */
  function dropCardToSnow(ice){
    const x0=ice.x, y0=ice.y, cs=ice.size*.66;
    const groundY=BG.snowPy();
    if(!SAVE.set.motion){ BG.puffAt(x0); Snd.t(180,.12,"triangle",.1); return; }
    const d=H("div",{class:"cardfall"});
    const pc=H("div",{style:`width:${cs}px;height:${cs}px`});
    pc.appendChild(partIcon(ice.k)); d.appendChild(pc);
    d.style.left=(x0-cs/2)+"px"; d.style.top=(y0-cs/2)+"px";
    sky.appendChild(d);
    const fallH=Math.max(40,groundY-y0);
    const fallMs=Math.max(520,Math.min(1150,Math.sqrt(fallH)*46));
    const drift=rnd(-38,38), spin=rnd(150,300)*(Math.random()<.5?-1:1);
    const HOP_MS=360, REST_MS=700, hopH=Math.min(46,fallH*.17);
    let phase="fall", el2=0, lastN=performance.now(), endRot=0;
    function put(dx,dy,rot,sc,op){
      d.style.transform=`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)})`;
      if(op!==undefined)d.style.opacity=op.toFixed(2);
    }
    function step(now){
      if(SCREEN!=="play"||over){d.remove();return;}
      const dt=Math.min(48,now-lastN); lastN=now;
      if(PAUSED){requestAnimationFrame(step);return;}
      el2+=dt;
      if(phase==="fall"){
        const p=Math.min(1,el2/fallMs);
        put(drift*p,fallH*p*p,spin*p,1-.30*p);
        if(p>=1){ phase="hop"; el2=0; endRot=spin;
          BG.puffAt(x0+drift); Snd.t(180,.12,"triangle",.11); Snd.t(90,.16,"sine",.07); }
      }else if(phase==="hop"){
        const p=Math.min(1,el2/HOP_MS);
        const up=Math.sin(p*Math.PI)*hopH;          /* 한 번 통 튀고 눕는다 */
        put(drift+p*6,fallH-up,endRot+p*14,.70);
        if(p>=1){ phase="rest"; el2=0;
          for(let i=0;i<3;i++){
            const du=E("circle",{cx:x0+drift+rnd(-10,10),cy:groundY-2-i*4,r:rnd(2.4,4),
              fill:"#FFFFFF",opacity:.9,class:"snowdust",style:`animation-delay:${i*120}ms`});
            fxSVG.appendChild(du); later(()=>du.remove(),1100);}
        }
      }else{
        const s=Math.min(1,el2/REST_MS);            /* 눈에 서서히 파묻힌다 */
        put(drift+6,fallH+s*s*14,endRot+14,.70-.06*s,1-s);
        if(s>=1){d.remove();return;}
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------- 입력 ---------- */
  const pos=e=>{const r=sky.getBoundingClientRect();
    const q=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    return {x:q.clientX-r.left,y:q.clientY-r.top};};
  let lastShot=0;
  const tryTap=(x,y)=>{const n=Date.now(); if(n-lastShot<90)return; lastShot=n; onTap(x,y);};
  sky.addEventListener("pointerdown",e=>{const q=pos(e); tryTap(q.x,q.y);});
  /* ★ 기관총 연사 — 꾹 누르고 있으면 초당 MG_RPS발(피스톨은 한 번에 한 발).
     누르는 동안 좌표를 계속 갱신하므로 손가락을 끌면 그쪽으로 쏜다. */
  let __hx=0,__hy=0,__autoId=0;
  function __autoStop(){ if(__autoId){clearInterval(__autoId);__autoId=0;} }
  function __autoStart(){ __autoStop();
    __autoId=setInterval(()=>{ if(SAVE.mgAmmo<=0||PAUSED){__autoStop();return;} tryTap(__hx,__hy); },
      Math.round(1000/MG_RPS)); }
  sky.addEventListener("pointerdown",e=>{const q=pos(e);__hx=q.x;__hy=q.y; if(SAVE.mgAmmo>0)__autoStart();});
  sky.addEventListener("pointermove",e=>{const q=pos(e);__hx=q.x;__hy=q.y;});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>sky.addEventListener(t,__autoStop));

  /* ① 이중 입력 제거 — pointerdown 단일 경로. PointerEvent가 없는 옛 브라우저만 터치 폴백 */
  if(!window.PointerEvent)sky.addEventListener("touchstart",e=>{const q=pos(e); tryTap(q.x,q.y);},{passive:true});
  const GUN=buildGun(sky,updAmmoHUD);              /* ⑥ 원근 팝건 + ⑤ 탄약 */
  const magBtn=buildMagBtn(); sky.appendChild(magBtn);
  /* v0.17 공통④ — 탄창 버튼 장전 폐지(사용자 지시). 탭 = 스와이프 제스처 안내만 잠깐 켠다 */
  magBtn.addEventListener("pointerdown",e=>{e.stopPropagation();
    const cue=document.getElementById("reloadCue");
    if(cue){cue.classList.add("on"); setTimeout(updAmmoHUD,1400);} });
  buildReloadCue(sky);                 /* 공용 표준 — 탄창 소진 시 화면 중앙 안내 */
  attachSwipeReload(sky,GUN);          /* 공용 표준 — 아래→위 스와이프 장전 */
  updAmmoHUD();

  /* ---------- 스테이지 흐름 ----------
     READY·GO는 스테이지에 한 번만(사용자 지시). 인트로 = 예습:
     세 단어를 그림카드와 함께 발음해 준다 — 뜻을 직관으로 먼저 심는다. */
  /* 공용 표준 예습 — 그림+단어+TTS, 3초 게이지가 다 줄면 자동 진행. ▶면 즉시 */
  const PRESTUDY_MS=3000;
  let introN=0;
  function preStudy(w){
    return new Promise(res=>{
      const card=H("div",{class:"introcard"});
      const p=H("div",{class:"ipic"}); p.appendChild(partIcon(w.k)); card.appendChild(p);
      card.appendChild(geoWord(w.w,CSSV("--butter"),Math.min(320,window.innerWidth*.6)));
      const gv=H("div",{class:"gauge"}); const gi=H("i"); gv.appendChild(gi); card.appendChild(gv);
      let fired=false;
      const done=()=>{ if(fired)return; fired=true;
        banner.classList.remove("in"); banner.classList.remove("tap"); res(); };
      const go=mgBtn("play",done,"big"); go.id="preGoBtn"; go.classList.add("goBtn");
      card.appendChild(go);
      const ms=Math.round(PRESTUDY_MS*(SAVE.set.motion?1:.3));
      gv.style.setProperty("--gms",ms+"ms");
      bannerShow(card,ms+140,"big tap");
      requestAnimationFrame(()=>gi.classList.add("run"));
      say(w.w); Cue2.word();
      later(done,ms);
    });
  }
  async function stageIntro(retry){
    running=false; lockFire=true;
    ices.slice().forEach(i=>removeIce(i,false));
    /* ⑩ 새 제거 — 배경 생명은 펭귄떼·물개·곰·표범(rangeBG)이 담당한다 */
    if(!cur)cur=pickNext();
    paintGoal();
    roundLeft=R4_TIME; lastCount=-1; paintClock();
    /* v0.10 ①(사용자 지시) — **예습은 지금 할 단어 하나만.**
       v0.9는 스테이지 시작에 단어 3개를 연달아 보여줘 카드가 3장 이어졌다.
       이제 한 장만 보여주고, **단어가 바뀔 때마다** 그 단어의 예습 카드를 새로 띄운다
       (배울 단어와 예습이 붙어 있어야 기억에 남는다). */
    await preStudy(cur);
    /* 공용 표준 — 첫 스테이지만 READY + 3·2·1 + GO. 두 번째부터·재도전은 READY → GO */
    /* v6차 ③(Red Light 기준) — **3·2·1 카운트다운 폐지**. 어느 라운드든 READY → GO 한 리듬.
       MG3는 처음부터 이 방식이었고, 매 단어마다 예습 카드가 따로 있으므로 카운트다운은 늘어짐만 만든다. */
    introN++;
    bannerShow(shoutNode("READY","#FFD45C"),640,"big");
    Cue2.ready(); await wait(620);
    bannerShow(shoutNode("GO!","#7BE3B6"),520,"big go");
    Cue2.go();
    spawnWave();                                   /* GO! 이후에야 얼음이 나타난다 */
    await wait(380);
    lockFire=false; running=true; last=performance.now();
    wordMiss=0; wordT0=performance.now();        /* v0.15 ⑨⑩ */
    /* ① 첫 단어도 소리로 — 듣고 타겟을 찾는 학습 흐름의 시작점(사용자 지시).
       GO! 징글이 끝난 직후에 읽어야 안 씹힌다 */
    later(()=>{const q2=curWord(); if(q2&&running)say(q2.w);},320);
  }
  function stageClear(){
    running=false; lockFire=true;
    const q=curWord();
    Cue2.fanfare(); Cue2.clap(); say(pick(PRAISE));   /* ⑫ 팡파르+박수 */
    winFX(sky,FW/2,FH*.4,true);
    BG.cheer(1500);
    const cel=H("div",{class:"celebrate cyc"});
    cel.appendChild(geoWord(q?q.w:"",CSSV("--butter"),Math.min(420,window.innerWidth*.82)));
    sky.appendChild(cel);
    ices.slice().forEach(i=>removeIce(i,true));
    sky.classList.remove("panic");
    later(()=>{cel.remove(); finish("clear");},1500);
    updHUD();
  }
  function stageFail(skipHeart){
    if(!running&&roundLeft>0)return;
    running=false; lockFire=true; streak=0;
    roundLeft=0; paintClock(); sky.classList.remove("panic");
    clock.burst(); Cue2.smash();
    if(!skipHeart){SAVE.hearts=Math.max(0,SAVE.hearts-1); persist();} updHUD();
    ices.slice().forEach(i=>removeIce(i,true));
    /* v0.15 ⑥ — 시간 초과: 지금 단어는 틀린 것. 재도전 없이 종료(남은 단어는 finish가 집계) */
    const q=curWord();
    if(q&&!wordLog.some(x=>x.k===q.k))wordLog.push({k:q.k,w:q.w,ok:false});
    later(()=>finish(SAVE.hearts<=0?"hearts":"time"),1250);
  }
  /* v0.15 ⑥ — TRY AGAIN 재도전 화면 폐기(사용자 지시) */
  function finish(why){
    if(over)return; over=true; running=false;
    sky.classList.remove("panic");
    window.removeEventListener("resize",onRz); window.removeEventListener("orientationchange",onRz);
    if(fieldRO){fieldRO.disconnect(); fieldRO=null;}
    SAVE.ink+=inkRun; SAVE.seeds+=seedRun;
    if(score>SAVE.best)SAVE.best=score;
    if(SAVE.hearts<heartCap()&&!SAVE.lastRegen)SAVE.lastRegen=Date.now();
    persist();
    pool.forEach(w=>{ if(!wordLog.some(x=>x.k===w.k))wordLog.push({k:w.k,w:w.w,ok:false}); });  /* v0.15 ⑥ */
    later(()=>scrResult({score,lettersHit:breaks,inkRun,seedRun,why,words:learned,log:wordLog}),800);
  }

  /* ══════ ★ 빙산 위 펭귄 ══════
     올라가 있다가 → 가장자리로 뒤뚱뒤뚱 → **바다로 뛰어든다** → 물보라 → 잠시 뒤 다른 빙산에 올라온다.
     빙산이 부서지면 → **정면을 보고 투덜댄다**(벌은 없다. 5세 기준: 실패를 벌로 만들지 않는다). */
  const PENGS=[]; const PENG_N=3;
  function pengTopY(ice){                       /* 빙산 꼭대기의 화면 Y — 파도를 그대로 탄다 */
    const elTop=ice.y-ice.h*BERG_ICON.cy/BERG_VBH;
    return elTop+ice.h*22/BERG_VBH;
  }
  function makeBergPeng(){
    const el=H("div",{class:"bergpeng"});
    el.appendChild(bergPengSVG(false,false));
    iceLayer.appendChild(el);
    const p={el,ice:null,st:"idle",t:0,wait:rnd(.4,3.2),vx:0,vy:0,x:0,y:0,size:34};
    PENGS.push(p); return p;
  }
  function pengPerch(p){
    const cand=ices.filter(i=>!i.dead&&!PENGS.some(q=>q!==p&&q.ice===i));
    if(!cand.length){ p.st="idle"; p.wait=rnd(.6,1.4); return; }
    p.ice=pick(cand); p.st="perch"; p.t=0; p.wait=rnd(1.6,4.2);
    p.size=Math.max(30,Math.min(58,p.ice.size*.46));   /* 너무 작으면 펭귄인지 안 읽힌다 */
    p.el.style.display="";
    p.el.className="bergpeng";
    p.el.innerHTML=""; p.el.appendChild(bergPengSVG(false,false));
  }
  function pengDive(p){
    p.st="dive"; p.t=0;
    p.x=p.ice?p.ice.x:FW*.5; p.y=p.ice?pengTopY(p.ice):FH*.4;
    p.vx=rnd(-1,1)<0?-1:1; p.ice=null;
    p.el.innerHTML=""; p.el.appendChild(bergPengSVG(false,false));
  }
  /* ★ 부서진 빙산에 올라가 있었다면 — 정면을 보고 투덜댄다 */
  function pengGrumble(ice){
    const p=PENGS.find(q=>q.ice===ice); if(!p)return;
    p.st="mad"; p.t=0; p.x=ice.x; p.y=pengTopY(ice); p.ice=null;
    p.el.className="bergpeng mad";
    p.el.innerHTML=""; p.el.appendChild(bergPengSVG(true,true));
    Snd.t(300,.09,"square",.10); setTimeout(()=>Snd.t(220,.13,"square",.09),110);
  }
  function pengSplash(x,y){
    const d=H("div",{class:"pengsplash"});
    d.appendChild(pengSplashSVG());
    d.style.left=x+"px"; d.style.top=y+"px";
    iceLayer.appendChild(d); later(()=>d.remove(),520);
  }
  function pengTick(dt){
    for(const p of PENGS){
      if(p.st==="idle"){ p.wait-=dt; if(p.wait<=0)pengPerch(p);
        /* ⚠️ 여기서 무조건 감추면 방금 올라간 펭귄까지 같이 감춘다 — 아직 idle일 때만 감춘다 */
        if(p.st==="idle"){ p.el.style.display="none"; continue; } }
      if(p.st==="perch"){
        if(!p.ice||p.ice.dead){ pengDive(p); continue; }
        p.x=p.ice.x; p.y=pengTopY(p.ice);
        p.wait-=dt; if(p.wait<=0)pengDive(p);
      } else if(p.st==="mad"){
        p.t+=dt; p.y-=dt*6;
        if(p.t>1.7){ p.el.className="bergpeng"; pengDive(p); }
      } else if(p.st==="dive"){
        p.t+=dt;
        p.x+=p.vx*38*dt;
        p.y+=(60+260*p.t)*dt;                     /* 중력처럼 점점 빨라진다 */
        if(p.y>FH*.86){ pengSplash(p.x,p.y); Snd.t(620,.07,"sine",.08);
          p.st="idle"; p.wait=rnd(1.2,3.4); p.el.style.display="none"; continue; }
      }
      p.el.style.width=p.size+"px"; p.el.style.height=(p.size*74/60)+"px";
      p.el.style.left=(p.x-p.size/2)+"px";
      p.el.style.top=(p.y-p.size*74/60)+"px";
    }
  }

  /* ★ 빙산이 파도에 오르내린다. 표시와 판정이 **같은 값**을 쓴다 */
  function bobIces(now){
    const t=now/1000;
    for(const ice of ices){
      if(ice.dead)continue;
      const dy=Math.sin(t*ice.bobW+ice.bobP)*ice.bobA;
      ice.y=ice.y0+dy;                                   /* ← 판정이 보는 값 */
      ice.el.style.top=(ice.y-ice.h*BERG_ICON.cy/BERG_VBH)+"px";
      ice.el.style.transform="rotate("+(Math.sin(t*ice.bobW*.7+ice.bobP)*ice.bobR).toFixed(2)+"deg)";
    }
  }
  for(let i=0;i<PENG_N;i++)makeBergPeng();
  /* ---------- 루프 ---------- */
  updHUD(); stageIntro(false);
  (function loop(now){
    if(SCREEN!=="play")return;
    RAF=requestAnimationFrame(loop);
    if(PAUSED){last=now; return;}                /* ⑪ 창 비활성 — 전부 정지 */
    const dt=Math.min(48,now-last); last=now;
    if(SAVE.set.motion!==false)bobIces(now);
    pengTick(Math.min(.05,dt/1000));
    if(running&&!over&&!lockFire){
      /* 정답 얼음 존재 보증 — 보충 경합으로 정답이 사라지면 클리어가 막힌다(R2 v0.3 §3.2 교훈) */
      ensureT+=dt;
      if(ensureT>1200){ ensureT=0;
        const q2=curWord();
        if(q2&&!ices.some(i=>i.k===q2.k))spawnIce({t:"pic",w:q2}); }
      roundLeft-=dt;
      const n=Math.ceil(roundLeft/1000);
      if(roundLeft<=3000&&n!==lastCount){lastCount=n; countTick(n);}
      paintClock();
      if(roundLeft<=0){stageFail();}
    }
  })(last);
}

  /* ---- 상태기계 — 결정적 sim 시계(simT). 환호·일시정지(⑪) 동안 완전 정지 ---- */

  const PCYC=4100, P_IDLE=1700, P_DIVE=850;
  function tick(now){

  /* ③② 환호 — 전 개체가 카메라 정면을 보고 뛴다. 곰은 대칭 정면 얼굴로 전환,

      inner.style.setProperty("--bx",(i%2?-860:860)+"px");
      inner.style.setProperty("--by",(-260-(i%2)*110)+"px");
      inner.classList.remove("cheerany","backin"); inner.classList.add("blast");});
    setTimeout(()=>{
      const back=n=>{n.classList.remove("blast"); n.classList.add("backin");
        setTimeout(()=>n.classList.remove("backin"),520);};
      [bear,seal].forEach(back);
      pengHolds.forEach(({inner})=>back(inner));
      seal2Holds.forEach(({inner})=>back(inner));
    },ms);
  }
  /* v0.9 ④ 오답 얼음이 깨지면 그림이 눈밭에 떨어진다 — 착지선과 눈 퍼프(해변판 splashAt의 북극 버전) */
  /* 이름은 승계하되 뜻이 바뀌었다 — 눈밭 지면 Y → **수면 Y**(연출이 닿는 바닥) */
  function snowPy(){ const m=mapPx(); return 600*m.s+m.oy; }   /* 연출이 닿는 바닥(수면 앞쪽) */
  function puffAt(px){
    const m=mapPx();
    const vx=Math.max(30,Math.min(970,(px-m.ox)/m.s));
    const g=E("g",{class:"snowpuff",transform:`translate(${vx.toFixed(1)},558)`});
    g.appendChild(E("path",{d:"M-30 4Q-34 -14 -18 -12M30 4Q34 -14 18 -12",
      fill:"none",stroke:"#FFFFFF","stroke-width":7,"stroke-linecap":"round"}));
    g.appendChild(E("ellipse",{cx:0,cy:0,rx:30,ry:9,fill:"#FFFFFF",opacity:.85}));
    [[-16,-16,4.6],[12,-22,3.8],[24,-10,3.2],[-26,-8,3]].forEach(([dx,dy,r])=>
      g.appendChild(E("circle",{cx:dx,cy:dy,r,fill:"#FFFFFF",opacity:.9})));
    play.appendChild(g);
    setTimeout(()=>g.remove(),700);
  }
  /* ★ 수평선의 화면 Y — 빙산 배치가 이 값을 기준으로 삼는다(어림짐작 금지) */
  function horizonPy(){ const m=mapPx(); return 150*m.s+m.oy; }
  return {node:w, hit, stun, cheer, blast, snowPy, horizonPy, puffAt};
}

/* v0.18계 ⑨(사용자 지시) — 퍼펙트 단어 = Candy Crush식 연쇄 팡팡 */
function cascadeFX(sky,fw,fh){
  const COLS=["#FFCE5C","#FF8A8A","#7BE3B6","#8CC8EE","#F79FC4","#C9A8F0"];
  const sh=H("div",{class:"perfshout"}); sh.appendChild(shoutNode("PERFECT!","#FFD45C"));
  sky.appendChild(sh); later(()=>sh.remove(),1300);
  for(let i=0;i<11;i++){
    later(()=>{
      if(!sky.parentNode)return;
      const p=H("div",{class:"cascpop"});
      p.style.left=(fw*(.10+.80*Math.random())).toFixed(0)+"px";
      p.style.top=(fh*(.14+.62*Math.random())).toFixed(0)+"px";
      p.style.setProperty("--c",COLS[i%COLS.length]);
      sky.appendChild(p); later(()=>p.remove(),780);
      Snd.t(500+i*75,.09,"triangle",.12);
      if(i%3===2)Snd.t(240+i*40,.14,"sine",.08);
    },90*i);
  }
  later(()=>Cue2.gold(),1050);
}
/* v0.18계 ⑥⑩(사용자 지시) — 결과 = 단어 통계(그림+O/X) + 60% 게이트 + 총점 카운트업(정확도·반응속도) */
function scrResult(r){
  clearAll(); SCREEN="result";
  const c=H("div",{class:"pageC result"});
  const log=r.log||[];
  const okN=log.filter(x=>x.ok).length, tot=Math.max(1,log.length);
  const pct=Math.round(okN/tot*100), pass=okN/tot>=.6;
  c.appendChild(H("div",{class:"stTitle"},[shoutNode(pass?"STAGE CLEAR!":"ALMOST!",pass?"#7BE3B6":"#FFB37A",true)]));
  const grid=H("div",{class:"wstat"});
  log.forEach(x=>{
    const card=H("div",{class:"wcard "+(x.ok?"ok":"no")});
    const ic=H("div",{class:"wic"}); ic.appendChild(partIcon(x.k)); card.appendChild(ic);
    card.appendChild(H("div",{class:"wname",text:x.w}));
    card.appendChild(H("div",{class:"wbadge "+(x.ok?"ok":"no"),text:x.ok?"\u2713":"\u2717"}));
    if(x.perfect)card.appendChild(H("div",{class:"wperf",text:"PERFECT"}));
    grid.appendChild(card);
  });
  c.appendChild(grid);
  c.appendChild(H("div",{class:"stPct",text:okN+" / "+log.length+" \u00b7 "+pct+"%"}));
  const okL=log.filter(x=>x.ok);
  const accB=okN*40;
  const refB=okL.reduce((a,x)=>a+Math.max(0,Math.round((16000-Math.min(16000,x.ms||16000))/400)),0);
  const total=(r.score||0)+accB+refB;
  const row=H("div",{class:"stBonus"});
  row.appendChild(H("span",{class:"bchip",text:"SCORE "+(r.score||0)}));
  row.appendChild(H("span",{class:"bchip acc",text:"ACCURACY +"+accB}));
  row.appendChild(H("span",{class:"bchip ref",text:"SPEED +"+refB}));
  c.appendChild(row);
  const big=H("div",{class:"bigscore",id:"bigscore",text:"0"});
  c.appendChild(big);
  const purse=H("div",{class:"purse"});
  const inkC=counter("ink",r.inkRun); inkC.classList.add("gain"); purse.appendChild(inkC);
  if(r.seedRun>0){const sd=counter("seed",r.seedRun); sd.classList.add("gain","seedgain"); purse.appendChild(sd);}
  purse.appendChild(heartsRow());
  c.appendChild(purse);
  /* ⑥ 60% 이상 = 다음 스테이지 버튼 활성, 미만 = 비활성 */
  const btnrow=H("div",{class:"btnrow"});
  const nb=mgBtn("play",()=>{ if(!pass||SAVE.hearts<=0){Snd.no();return;}
    SAVE.stage=(SAVE.stage||1)+1; persist(); scrPlay(); },"big");
  nb.id="nextStageBtn";
  const nbWrap=H("div",{class:"nsWrap"+(pass?"":" dis"),id:"nsWrap"},
    [H("div",{class:"nsLab",text:"NEXT STAGE"}),nb]);
  btnrow.appendChild(nbWrap);
  const rb=mgBtn("replay",()=>{ if(SAVE.hearts<=0){Snd.no();return;} scrPlay(); },"big");
  rb.id="replayBtn"; btnrow.appendChild(rb);
  c.appendChild(btnrow);
  const gear=mgBtn("gear",parentPanel); gear.className="ib corner"; c.appendChild(gear);
  const hm=mgBtn("home",goHub); hm.className="ib corner cornerL"; hm.id="resultHome"; c.appendChild(hm);
  app.appendChild(c);
  Snd.win();
  /* ⑩ 총점이 틱 사운드와 함께 차오른다 */
  const DUR=1600, t0=performance.now(); let lastTick=0, fin=false;
  window.__TALLY={total:total,acc:accB,ref:refB,pass:pass,pct:pct,done:false};
  try{if(window.parent!==window)parent.postMessage({wb:"tally",pass:pass,pct:pct},"*");}catch(e){}
  (function roll(now){
    if(SCREEN!=="result"||fin)return;
    const p=Math.min(1,(now-t0)/DUR), e=1-Math.pow(1-p,3);
    big.textContent=String(Math.round(total*e));
    if(now-lastTick>70){ lastTick=now; Snd.t(560+920*e,.03,"square",.05); }
    if(p>=1){ fin=true; big.textContent=String(total); big.classList.add("pop");
      window.__TALLY.done=true;
      if(pass)Cue2.fanfare(); else Cue2.beat();
      return; }
    requestAnimationFrame(roll);
  })(performance.now());
}

   테스트 전용. 출시 빌드에서는 이 블록을 통째로 뺀다. */
/* ② 버그 수정: 오디오·음성은 사용자 제스처가 있어야 풀린다 — 첫 포인터에서 예열.
   (시작 버튼 클릭이 곧 제스처라 이후 인트로 발음·카운트다운 비프가 안정적으로 난다) */
document.addEventListener("pointerdown",function warmup(){
  Snd.init(); try{if(Snd.ctx&&Snd.ctx.state==="suspended")Snd.ctx.resume();}catch(e){}
  try{ if(window.speechSynthesis){ speechSynthesis.getVoices();
    const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
  document.removeEventListener("pointerdown",warmup);
},{capture:true});
/* 개발용 홈버튼(사용자 지시 2026-08-03 ⑦): 누르면 하트 5·탄창 10개(25발 장전+예비 9) 리필 후 허브로.
   테스트 반복을 위한 개발 환경 전용 편의 — 본편 이식 시 제거 대상 */
/* ② 필드의 홈 버튼 폐기 — 제어판(⚙) 안 "게임 목록으로"가 유일한 출구다 */
document.addEventListener("touchstart",function once(){Snd.init();

<script>
/* ═══ Wordborn Prototype 통합 어댑터(v0.19.2) — 월드 iframe 연동 · 긴 단어 맞춤 ═══
   ① wbHome(): iframe 안이면 부모(월드)에 exit 메시지, 단독 실행이면 기존 허브 이동.
   ② wbFitGoal(): 대시보드 철자판이 넘치면 그림 숨김→축소로 **끝 글자까지** 보이게.
   ③ 결과 화면에서 부모에 tally(pass/pct) 통지 — 클리어 시 월드가 지도로 복귀. */
function wbHome(){
  try{ if(window.parent!==window){ parent.postMessage({wb:"exit"},"*"); return; } }catch(e){}
  try{ location.href="index.html?t="+Date.now(); }catch(e){}
}
function wbFitGoal(){
  try{
    var goal=document.querySelector(".hud .goal")||document.querySelector(".goal");
    if(!goal||!goal.isConnected)return;
    var row=goal.querySelector(".slots")||goal.querySelector(".slotrow");
    if(!row||!row.children.length)return;
    var pic=goal.querySelector(".gpic")||goal.querySelector(".pic");
    row.style.transform=""; row.style.marginRight=""; if(pic)pic.style.display="";
    var need=row.scrollWidth; if(!need)return;
    function avail(){
      var gr=goal.getBoundingClientRect(), rr=row.getBoundingClientRect();
      var padR=parseFloat(getComputedStyle(goal).paddingRight)||0;
      return Math.max(24, gr.right-padR-rr.left);
    }
    var a=avail();
    if(need<=a)return;
    if(pic && a/need<0.74){ pic.style.display="none"; a=avail(); if(need<=a)return; }
    var k=Math.max(0.30, Math.min(1, a/need));
    row.style.transformOrigin="left center";
    row.style.transform="scale("+k+")";
    row.style.marginRight=(-need*(1-k)).toFixed(1)+"px";
  }catch(e){}
}
window.addEventListener("resize",function(){ setTimeout(wbFitGoal,80); });
window.addEventListener("orientationchange",function(){ setTimeout(wbFitGoal,120); });
</script>
